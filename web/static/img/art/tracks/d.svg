    <circle cx="460" cy="300" r="26" fill="#f2c46d"/>
    <path d="M460 286 V314 M452 292 h12 a5 5 0 0 1 0 8 h-8 a5 5 0 0 0 0 8 h12" stroke-width="2"/>
