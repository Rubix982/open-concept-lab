    <path d="M300 206 L352 130 L312 214 Z" fill="#e8836b" fill-opacity="0.85"/>
    <path d="M300 206 L248 282 L288 198 Z" fill="#fffdf8"/>
    <circle cx="300" cy="206" r="7" fill="#2b2a28"/>
    <path d="M300 96 C 300 60, 310 40, 320 20" stroke="#4338a8" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M90 330 C 180 300, 220 330, 300 316 S 450 300, 520 250" stroke="#4338a8" stroke-width="2" stroke-dasharray="3 8"/>
    <path d="M512 244 L524 248 L520 260" stroke="#4338a8" stroke-width="2"/>
