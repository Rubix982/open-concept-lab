    <path d="M200 222 L380 222 L420 242 L240 242 Z" fill="#fffdf8"/>
    <path d="M200 256 L380 256 L420 276 L240 276 Z" fill="#fffdf8"/>
    <path d="M200 290 L380 290 L420 310 L240 310 Z" fill="#fffdf8"/>
    <path d="M150 168 L470 214" stroke="#a4442f" stroke-width="2.4" stroke-dasharray="6 8"/>
    <path d="M120 150 L160 172 L150 184 L110 162 Z" fill="#f2c46d"/>
    <path d="M440 190 C 480 200, 500 240, 480 280" stroke="#4338a8" stroke-width="2"/>
