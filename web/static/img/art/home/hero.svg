<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="A small, friendly round creature standing for a language model. It holds a magnifying glass up to its own thought bubble, where a bug has been crossed out beside a tick and a pair of code brackets. A seedling grows beside it; sparkles float around.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>
  <ellipse cx="300" cy="260" rx="250" ry="180" fill="#f2c46d" opacity="0.22"/>
  <ellipse cx="230" cy="398" rx="140" ry="16" fill="#2b2a28" opacity="0.07"/>
  <g class="ocl-hero__sparkles"><path d="M96 106 Q98.52 117.48 110 120 Q98.52 122.52 96 134 Q93.48 122.52 82 120 Q93.48 117.48 96 106 Z" fill="#f2c46d" stroke="none"/><path d="M520 73 Q521.98 82.02 531 84 Q521.98 85.98 520 95 Q518.02 85.98 509 84 Q518.02 82.02 520 73 Z" fill="#f2c46d" stroke="none"/><path d="M548 321 Q549.62 328.38 557 330 Q549.62 331.62 548 339 Q546.38 331.62 539 330 Q546.38 328.38 548 321 Z" fill="#e8836b" stroke="none"/><path d="M70 292 Q71.44 298.56 78 300 Q71.44 301.44 70 308 Q68.56 301.44 62 300 Q68.56 298.56 70 292 Z" fill="#4338a8" stroke="none"/><path d="M330 53 Q331.26 58.74 337 60 Q331.26 61.26 330 67 Q328.74 61.26 323 60 Q328.74 58.74 330 53 Z" fill="#e8836b" stroke="none"/></g>
  <g filter="url(#rough)" fill="none" stroke="#2b2a28" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
