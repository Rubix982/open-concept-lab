<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-label="Six small drawings in two rows, one for each thing graphics software reuses. Across time: two frames, with a ball that has moved only a little between them. Across space: a grid of pixels where the middle one borrows from its four neighbours. Across runs: a first run drawn as a long bar ending in answer A, and a second run that starts from A, so most of its bar is a dashed outline marked not redone. Across resolutions: a coarse triangle mesh with an arrow to a fine one. Across shapes: a short figure and a tall figure, with the same patch of cloth carried from the first to the second. Across many instances: one box marked once, with lines fanning out to five uses.">
  <style type="text/css"><![CDATA[
    /* An image element cannot read the page's custom properties, so the
       figure carries its own light and dark values. Every var() keeps its
       light value as a fallback for converters that ignore :root. */
    :root {
      --paper: #f4f1ea;
      --raised: #fffdf8;
      --ink: #2b2a28;
      --faint: #6b6863;
      --indigo: #4338a8;
      --oxide: #a4442f;
      --sage: #4a6f55;
      --gold: #e0a93a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b1a18;
        --raised: #24231f;
        --ink: #eeece6;
        --faint: #9a968e;
        --indigo: #b1a9ff;
        --oxide: #e3977f;
        --sage: #93c9a5;
        --gold: #f2c46d;
      }
      rect[filter*="grain"] { display: none; }
    }
  ]]></style>

  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="72"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="900" height="490" fill="var(--paper, #f4f1ea)"/>
  <rect width="900" height="490" filter="url(#grain)"/>
  <g stroke="var(--faint, #6b6863)" stroke-width="1" opacity="0.3" stroke-dasharray="2 6">
    <path d="M302 30 L302 460 M597 30 L597 460 M30 246 L870 246"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif">

    <!-- across time -->
    <g transform="translate(15 16)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS TIME</text>
      <g filter="url(#rough)" stroke="var(--ink, #2b2a28)" stroke-linecap="round" stroke-linejoin="round">
        <rect x="20" y="48" width="100" height="84" rx="3" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <rect x="160" y="48" width="100" height="84" rx="3" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <circle cx="56" cy="92" r="13" fill="var(--indigo, #4338a8)" fill-opacity="0.55" stroke-width="1.8"/>
        <circle cx="194" cy="92" r="13" fill="none" stroke="var(--faint, #6b6863)" stroke-width="1.4" stroke-dasharray="3 4"/>
        <circle cx="212" cy="88" r="13" fill="var(--indigo, #4338a8)" fill-opacity="0.55" stroke-width="1.8"/>
        <path d="M122 70 C 132 56, 148 56, 158 70 M151 67 L158 70 L156 62" fill="none" stroke="var(--sage, #4a6f55)" stroke-width="2"/>
      </g>
      <text x="70" y="150" font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">frame 1</text>
      <text x="210" y="150" font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">frame 2</text>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">the previous frame or step</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">warm-starting a solver · refitting a tree</text>
    </g>

    <!-- across space -->
    <g transform="translate(310 16)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS SPACE</text>
      <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
        <rect x="110" y="84" width="20" height="20" fill="var(--sage, #4a6f55)" fill-opacity="0.35"/>
        <rect x="150" y="84" width="20" height="20" fill="var(--sage, #4a6f55)" fill-opacity="0.35"/>
        <rect x="130" y="64" width="20" height="20" fill="var(--sage, #4a6f55)" fill-opacity="0.35"/>
        <rect x="130" y="104" width="20" height="20" fill="var(--sage, #4a6f55)" fill-opacity="0.35"/>
        <rect x="130" y="84" width="20" height="20" fill="var(--gold, #e0a93a)" fill-opacity="0.85"/>
        <path d="M90 44 H190 V144 H90 Z M110 44 V144 M130 44 V144 M150 44 V144 M170 44 V144 M90 64 H190 M90 84 H190 M90 104 H190 M90 124 H190" fill="none" stroke="var(--ink, #2b2a28)" stroke-width="1.3"/>
        <path d="M113 94 L128 94 M124 90 L128 94 L124 98 M167 94 L152 94 M156 90 L152 94 L156 98 M140 67 L140 82 M136 78 L140 82 L144 78 M140 121 L140 106 M136 110 L140 106 L144 110" fill="none" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
      </g>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">a neighbour's work</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">irradiance caching · ReSTIR</text>
    </g>

    <!-- across runs -->
    <g transform="translate(605 16)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS RUNS</text>
      <text x="14" y="76" font-size="11" fill="var(--faint, #6b6863)">run 1</text>
      <text x="14" y="126" font-size="11" fill="var(--faint, #6b6863)">run 2</text>
      <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
        <rect x="60" y="64" width="180" height="16" rx="4" fill="var(--faint, #6b6863)" fill-opacity="0.25" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <rect x="60" y="114" width="136" height="16" rx="4" fill="none" stroke="var(--faint, #6b6863)" stroke-width="1.3" stroke-dasharray="4 4"/>
        <rect x="196" y="114" width="44" height="16" rx="4" fill="var(--sage, #4a6f55)" fill-opacity="0.45" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <circle cx="240" cy="72" r="5" fill="var(--ink, #2b2a28)"/>
        <circle cx="240" cy="122" r="5" fill="var(--ink, #2b2a28)"/>
        <path d="M236 80 C 228 96, 206 98, 200 110 M195 104 L200 110 L205 104" fill="none" stroke="var(--sage, #4a6f55)" stroke-width="2"/>
      </g>
      <text x="252" y="76" font-size="12" font-style="italic" fill="var(--ink, #2b2a28)">A</text>
      <text x="252" y="126" font-size="12" font-style="italic" fill="var(--ink, #2b2a28)">A′</text>
      <text x="128" y="126" font-size="10.5" text-anchor="middle" fill="var(--faint, #6b6863)">not redone</text>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">an earlier, slightly different run</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">repeated drapes in a fitting loop</text>
    </g>

    <!-- across resolutions -->
    <g transform="translate(15 256)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS RESOLUTIONS</text>
      <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="22" y="50" width="80" height="80" fill="var(--gold, #e0a93a)" fill-opacity="0.3"/>
        <path d="M22 50 H102 V130 H22 Z M62 50 V130 M22 90 H102 M22 90 L62 50 M22 130 L102 50 M62 130 L102 90" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <path d="M170 50 H250 V130 H170 Z M190 50 V130 M210 50 V130 M230 50 V130 M170 70 H250 M170 90 H250 M170 110 H250 M170 70 L190 50 M170 90 L210 50 M170 110 L230 50 M170 130 L250 50 M190 130 L250 70 M210 130 L250 90 M230 130 L250 110" stroke="var(--ink, #2b2a28)" stroke-width="1.2"/>
        <path d="M110 90 L160 90 M154 85 L160 90 L154 95" stroke="var(--sage, #4a6f55)" stroke-width="2"/>
      </g>
      <text x="62" y="150" font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">coarse</text>
      <text x="210" y="150" font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">fine</text>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">a coarse solution</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">multigrid · coarse-to-fine cloth</text>
    </g>

    <!-- across shapes -->
    <g transform="translate(310 256)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS SHAPES</text>
      <g filter="url(#rough)" stroke="var(--ink, #2b2a28)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 144 H260" stroke="var(--faint, #6b6863)" stroke-width="1.2" fill="none"/>
        <circle cx="60" cy="68" r="9" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <path d="M44 82 Q 60 76, 76 82 L78 144 L42 144 Z" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <path d="M45 88 L75 88 L77 122 L43 122 Z" fill="var(--gold, #e0a93a)" fill-opacity="0.8" stroke-width="1.8"/>
        <circle cx="205" cy="48" r="10" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <path d="M187 63 Q 205 57, 223 63 L226 144 L184 144 Z" fill="var(--raised, #fffdf8)" stroke-width="1.8"/>
        <path d="M188 71 L222 71 L224 115 L186 115 Z" fill="var(--gold, #e0a93a)" fill-opacity="0.8" stroke-width="1.8"/>
        <path d="M92 100 C 118 84, 148 84, 172 100 M165 95 L172 100 L165 104" fill="none" stroke="var(--sage, #4a6f55)" stroke-width="2"/>
      </g>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">a result on another shape</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">deformation transfer · garment transfer</text>
    </g>

    <!-- across many instances -->
    <g transform="translate(605 256)">
      <text x="14" y="22" font-size="12.5" letter-spacing="1.3" fill="var(--ink, #2b2a28)">ACROSS MANY INSTANCES</text>
      <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M94 92 L221 54 M94 92 L221 73 M94 92 L221 92 M94 92 L221 111 M94 92 L221 130" fill="none" stroke="var(--sage, #4a6f55)" stroke-width="1.6"/>
        <rect x="22" y="70" width="72" height="44" rx="3" fill="var(--gold, #e0a93a)" fill-opacity="0.8" stroke="var(--ink, #2b2a28)" stroke-width="1.8"/>
        <circle cx="230" cy="54" r="7" fill="var(--raised, #fffdf8)" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <circle cx="230" cy="73" r="7" fill="var(--raised, #fffdf8)" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <circle cx="230" cy="92" r="7" fill="var(--raised, #fffdf8)" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <circle cx="230" cy="111" r="7" fill="var(--raised, #fffdf8)" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
        <circle cx="230" cy="130" r="7" fill="var(--raised, #fffdf8)" stroke="var(--ink, #2b2a28)" stroke-width="1.6"/>
      </g>
      <text x="58" y="97" font-size="12" font-style="italic" text-anchor="middle" fill="var(--ink, #2b2a28)">once</text>
      <text x="230" y="154" font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">each use</text>
      <text x="14" y="184" font-size="14.5" font-style="italic" fill="var(--ink, #2b2a28)">work paid once, used for every case</text>
      <text x="14" y="206" font-size="11.5" fill="var(--faint, #6b6863)">precomputed radiance transfer</text>
    </g>
  </g>
</svg>
