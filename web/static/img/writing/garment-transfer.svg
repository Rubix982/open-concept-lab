<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 520" role="img" aria-label="Two figures in an A-pose. On the left, a shorter figure, 1.609 m, wears a kameez, trousers and a dupatta hanging from one shoulder, draped from the flat pattern. An arrow labelled 1.2 seconds carries the garment to a taller figure, 1.753 m, on the right. There the kameez and trousers fit, graded to the new body, with edges 6 to 7 percent longer at the median and 22 to 30 percent longer at the 95th percentile. The dupatta's free end has torn: one edge in twenty is 4.9 times as long or more, and 96 of its points are inside the body. Below, two bars on one time axis: draping again takes about 6 minutes, 4 to 7 across runs; carrying over takes 1.2 seconds, too thin to see.">
  <style type="text/css"><![CDATA[
    :root {
      --paper: #f4f1ea;
      --raised: #fffdf8;
      --ink: #2b2a28;
      --faint: #6b6863;
      --indigo: #4338a8;
      --oxide: #a4442f;
      --sage: #4a6f55;
      --gold: #e0a93a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b1a18;
        --raised: #24231f;
        --ink: #eeece6;
        --faint: #9a968e;
        --indigo: #b1a9ff;
        --oxide: #e3977f;
        --sage: #93c9a5;
        --gold: #f2c46d;
      }
      rect[filter*="grain"] { display: none; }
    }
  ]]></style>

  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="76"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>

    <!-- A mannequin 300 units tall, feet at the origin, in an A-pose. -->
    <g id="mannequin" fill="var(--raised, #fffdf8)" stroke="var(--faint, #6b6863)" stroke-width="2" stroke-linejoin="round">
      <path d="M -36 -242 L -79 -152 L -69 -147 L -30 -221 Z M 36 -242 L 79 -152 L 69 -147 L 30 -221 Z"/>
      <circle cx="-75" cy="-145" r="6"/>
      <circle cx="75" cy="-145" r="6"/>
      <rect x="-7" y="-263" width="14" height="12"/>
      <circle cx="0" cy="-280" r="19"/>
      <path d="M -36 -242 C -38 -220, -31 -200, -28 -180 C -30 -166, -34 -156, -33 -145 L -26 -3 L -8 -3 L 0 -136 L 8 -3 L 26 -3 L 33 -145 C 34 -156, 30 -166, 28 -180 C 31 -200, 38 -220, 36 -242 C 24 -250, 12 -251, 7 -253 L -7 -253 C -12 -251, -24 -250, -36 -242 Z"/>
    </g>
    <g id="trousers" fill="var(--indigo, #4338a8)" fill-opacity="0.35" stroke="var(--ink, #2b2a28)" stroke-width="1.8" stroke-linejoin="round">
      <path d="M -34 -84 L -30 -5 L -8 -5 L -1 -84 Z M 1 -84 L 8 -5 L 30 -5 L 34 -84 Z"/>
    </g>
    <g id="kameez" stroke="var(--ink, #2b2a28)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -36 -242 L -55 -205 L -45 -191 L -30 -219 C -31 -190, -35 -150, -45 -80 Q 0 -74, 45 -80 C 35 -150, 31 -190, 30 -219 L 45 -191 L 55 -205 L 36 -242 C 24 -250, 12 -251, 7 -253 L -7 -253 C -12 -251, -24 -250, -36 -242 Z" fill="var(--gold, #e0a93a)" fill-opacity="0.8" stroke-width="2"/>
      <path d="M -7 -253 L 0 -238 L 7 -253" fill="none" stroke-width="1.5"/>
    </g>
    <g id="dupatta" stroke="var(--ink, #2b2a28)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -22 -250 C -40 -248, -50 -226, -56 -196 C -60 -160, -62 -110, -64 -60 L -48 -58 C -46 -110, -44 -160, -40 -196 C -36 -220, -30 -238, -16 -248 Z" fill="var(--sage, #4a6f55)" fill-opacity="0.5" stroke-width="1.8"/>
      <path d="M -50 -190 C -52 -150, -54 -110, -56 -64" fill="none" stroke-width="1" opacity="0.5"/>
    </g>
    <g id="dupatta-torn" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -22 -250 C -40 -248, -50 -226, -56 -196 C -59 -170, -60 -150, -61 -128 L -57 -120 L -54 -130 L -50 -118 L -46 -128 L -44 -122 C -43 -150, -42 -175, -40 -196 C -36 -220, -30 -238, -16 -248 Z" fill="var(--sage, #4a6f55)" fill-opacity="0.5" stroke="var(--ink, #2b2a28)" stroke-width="1.8"/>
      <path d="M -58 -110 L -61 -100 C -65 -70, -71 -40, -75 -6 L -64 -4 C -59 -40, -53 -72, -50 -102 L -47 -110 L -52 -104 Z" fill="var(--sage, #4a6f55)" fill-opacity="0.3" stroke="var(--oxide, #a4442f)" stroke-width="1.8" stroke-dasharray="5 4"/>
      <g fill="var(--oxide, #a4442f)">
        <circle cx="-30" cy="-168" r="2.8"/><circle cx="-30" cy="-150" r="2.8"/><circle cx="-29" cy="-132" r="2.8"/><circle cx="-27" cy="-114" r="2.8"/>
      </g>
    </g>
  </defs>
  <rect width="900" height="520" fill="var(--paper, #f4f1ea)"/>
  <rect width="900" height="520" filter="url(#grain)"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- ground -->
    <path d="M40 341 L600 341" stroke="var(--faint, #6b6863)" stroke-width="1.2" opacity="0.5"/>

    <!-- the first body: 1.609 m, drawn at 170 px a metre -->
    <g filter="url(#rough)" transform="translate(140 340) scale(0.913)">
      <use xlink:href="#mannequin" href="#mannequin"/>
      <use xlink:href="#trousers" href="#trousers"/>
      <use xlink:href="#kameez" href="#kameez"/>
      <use xlink:href="#dupatta" href="#dupatta"/>
    </g>

    <!-- the second body: 1.753 m -->
    <g filter="url(#rough)" transform="translate(480 340) scale(0.993)">
      <use xlink:href="#mannequin" href="#mannequin"/>
      <use xlink:href="#trousers" href="#trousers"/>
      <use xlink:href="#kameez" href="#kameez"/>
      <use xlink:href="#dupatta-torn" href="#dupatta-torn"/>
    </g>

    <text x="140" y="26" font-size="13" letter-spacing="1.2" text-anchor="middle" fill="var(--ink, #2b2a28)">FIRST BODY · 1.609 M</text>
    <text x="140" y="44" font-size="12" font-style="italic" text-anchor="middle" fill="var(--faint, #6b6863)">draped from the flat pattern</text>
    <text x="480" y="16" font-size="13" letter-spacing="1.2" text-anchor="middle" fill="var(--ink, #2b2a28)">SECOND BODY · 1.753 M</text>
    <text x="480" y="33" font-size="12" font-style="italic" text-anchor="middle" fill="var(--faint, #6b6863)">carried over from the first</text>

    <!-- the transfer -->
    <g filter="url(#rough)" fill="none" stroke="var(--sage, #4a6f55)" stroke-width="2.2" stroke-linecap="round">
      <path d="M232 162 C 272 136, 338 136, 378 162 M370 158 L378 162 L373 154"/>
    </g>
    <text x="305" y="98" font-size="12" text-anchor="middle" fill="var(--ink, #2b2a28)">bound to the body's surface,</text>
    <text x="305" y="114" font-size="12" text-anchor="middle" fill="var(--ink, #2b2a28)">then moved with it</text>
    <text x="305" y="136" font-size="17" font-style="italic" text-anchor="middle" fill="var(--ink, #2b2a28)">1.2 s</text>

    <!-- what came out -->
    <path d="M604 222 L519 221" stroke="var(--faint, #6b6863)" stroke-width="1" fill="none"/>
    <text x="610" y="200" font-size="13" fill="var(--ink, #2b2a28)">kameez and trousers:</text>
    <text x="610" y="218" font-size="12" fill="var(--faint, #6b6863)">graded to the new body,</text>
    <text x="610" y="236" font-size="12" fill="var(--faint, #6b6863)">edges 6–7 % longer at the median,</text>
    <text x="610" y="254" font-size="12" fill="var(--faint, #6b6863)">22–30 % at the 95th percentile</text>

    <path d="M396 300 L410 292" stroke="var(--faint, #6b6863)" stroke-width="1" fill="none"/>
    <text x="392" y="288" font-size="12" text-anchor="end" fill="var(--oxide, #a4442f)">the dupatta's free end tore:</text>
    <text x="392" y="304" font-size="11.5" text-anchor="end" fill="var(--faint, #6b6863)">one edge in twenty at 4.9× or more,</text>
    <text x="392" y="320" font-size="11.5" text-anchor="end" fill="var(--faint, #6b6863)">96 points inside the body</text>

    <!-- time, on one axis: 0 to 7 minutes over 60..840 -->
    <text x="60" y="390" font-size="12.5" font-style="italic" fill="var(--faint, #6b6863)">Time to get the garment onto the second body</text>
    <text x="60" y="413" font-size="12" fill="var(--ink, #2b2a28)">draped again: about 6 minutes, 4–7 across runs</text>
    <text x="60" y="457" font-size="12" fill="var(--ink, #2b2a28)">carried over: 1.2 seconds</text>
    <g filter="url(#rough)" stroke-linecap="round">
      <rect x="60" y="419" width="668.6" height="14" rx="4" fill="var(--faint, #6b6863)" fill-opacity="0.3" stroke="var(--ink, #2b2a28)" stroke-width="1.4"/>
      <path d="M505.7 426 H840 M505.7 420 V432 M840 420 V432" stroke="var(--ink, #2b2a28)" stroke-width="1.2" fill="none"/>
      <rect x="60" y="463" width="3" height="14" fill="var(--sage, #4a6f55)" stroke="var(--sage, #4a6f55)" stroke-width="1"/>
      <path d="M60 494 H840 M60 494 v5 M171.4 494 v5 M282.9 494 v5 M394.3 494 v5 M505.7 494 v5 M617.1 494 v5 M728.6 494 v5 M840 494 v5" stroke="var(--faint, #6b6863)" stroke-width="1.2" fill="none"/>
    </g>
    <g font-size="11" text-anchor="middle" fill="var(--faint, #6b6863)">
      <text x="60" y="512">0</text><text x="171.4" y="512">1</text><text x="282.9" y="512">2</text><text x="394.3" y="512">3</text>
      <text x="505.7" y="512">4</text><text x="617.1" y="512">5</text><text x="728.6" y="512">6</text><text x="840" y="512">7 min</text>
    </g>
  </g>
</svg>
