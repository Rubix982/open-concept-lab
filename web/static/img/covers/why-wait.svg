<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A man sits on a bench at the start of a clear road that leads to a lit house on a hill. Across the sky, the sun is drawn three times, rising, high and setting, as the day passes while he sits.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.033" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="3.1"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="82"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="800" height="560" fill="#f4f1ea"/>
  <rect width="800" height="560" filter="url(#grain)"/>
  <!-- the day passing: the sun three times -->
  <path d="M110 230 C 250 40, 550 40, 690 230" fill="none" stroke="#2b2a28" stroke-width="1.4" stroke-dasharray="2 9" opacity="0.5"/>
  <ellipse cx="640" cy="330" rx="120" ry="80" fill="#f2c46d" opacity="0.2"/>
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="140" cy="186" r="20" fill="#f2c46d" fill-opacity="0.45" stroke="#2b2a28" stroke-width="2" opacity="0.6"/>
    <circle cx="400" cy="88" r="24" fill="#f2c46d" fill-opacity="0.75" stroke="#2b2a28" stroke-width="2.2" opacity="0.8"/>
    <circle cx="662" cy="190" r="20" fill="#e8836b" fill-opacity="0.6" stroke="#2b2a28" stroke-width="2"/>
    <!-- the hill and the road to it -->
    <path d="M40 440 C 260 432, 440 400, 560 350 C 610 330, 680 318, 760 322" stroke="#2b2a28" stroke-width="2" opacity="0.55"/>
    <path d="M236 486 C 360 466, 480 414, 600 352 M300 496 C 420 474, 530 420, 640 352" stroke="#2b2a28" stroke-width="2.2"/>
    <!-- the house he knows he is going to -->
    <path d="M610 352 L610 300 L640 276 L670 300 L670 352 Z" fill="#fffdf8" stroke="#2b2a28" stroke-width="2.4"/>
    <path d="M600 306 L640 272 L680 306" stroke="#e8836b" stroke-width="2.6"/>
    <rect x="632" y="316" width="16" height="16" fill="#f2c46d" stroke="#2b2a28" stroke-width="1.8"/>
    <!-- a bench, and a man still sitting on it -->
    <path d="M84 468 L196 468 M94 468 L94 498 M186 468 L186 498 M84 468 L84 424 M84 432 L116 432" stroke="#2b2a28" stroke-width="2.6"/>
    <circle cx="130" cy="404" r="12" fill="#4338a8" fill-opacity="0.2" stroke="#2b2a28" stroke-width="2.4"/>
    <path d="M130 416 L130 464 M130 428 L146 446 L156 446 M130 464 L162 464 L164 496" stroke="#2b2a28" stroke-width="2.4"/>
    <path d="M60 500 L760 500" stroke="#2b2a28" stroke-width="1.4" opacity="0.35"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2a28">
    <text x="400" y="536" font-size="20" font-style="italic" text-anchor="middle" opacity="0.85">kidher jana hai, pata hai</text>
  </g>
</svg>
