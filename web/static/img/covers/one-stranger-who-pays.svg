<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A wide crowd on the left; a road narrows from them to one small box. One figure on the road hands a gold coin to the box, a small house stands behind it, and an hourglass runs in the sky.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.033" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="3.1"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="22"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="800" height="560" fill="#f4f1ea"/>
  <rect width="800" height="560" filter="url(#grain)"/>
  <ellipse cx="560" cy="350" rx="150" ry="110" fill="#f2c46d" opacity="0.22"/>
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the road narrows: narrow the market, narrow the offer -->
    <path d="M40 170 C 260 190, 430 230, 500 322 M40 520 C 240 470, 400 430, 500 400" stroke="#2b2a28" stroke-width="2" opacity="0.55"/>
    <path d="M60 360 C 220 370, 380 378, 500 380" stroke="#2b2a28" stroke-width="1.6" stroke-dasharray="3 12" opacity="0.5"/>
    <!-- the crowd at the wide end -->
    <g stroke="#2b2a28" stroke-width="2" opacity="0.28">
      <circle cx="80" cy="262" r="12"/><path d="M80 274 L80 320 M80 288 L66 304 M80 288 L94 304 M80 320 L70 350 M80 320 L90 350"/>
      <circle cx="130" cy="330" r="12"/><path d="M130 342 L130 388 M130 356 L116 372 M130 356 L144 372 M130 388 L120 418 M130 388 L140 418"/>
      <circle cx="70" cy="410" r="12"/><path d="M70 422 L70 468 M70 436 L56 452 M70 436 L84 452 M70 468 L60 498 M70 468 L80 498"/>
      <circle cx="170" cy="280" r="12"/><path d="M170 292 L170 338 M170 306 L156 322 M170 306 L184 322 M170 338 L160 368 M170 338 L180 368"/>
      <circle cx="180" cy="420" r="12"/><path d="M180 432 L180 478 M180 446 L166 462 M180 446 L194 462 M180 478 L170 508 M180 478 L190 508"/>
    </g>
    <!-- the one who steps forward, coin in hand -->
    <circle cx="350" cy="300" r="15" fill="#4338a8" fill-opacity="0.18" stroke="#2b2a28" stroke-width="2.6"/>
    <path d="M350 315 L350 378 M350 334 L330 356 M350 334 L398 338 M350 378 L334 420 M350 378 L366 420" stroke="#2b2a28" stroke-width="2.6"/>
    <circle cx="420" cy="338" r="17" fill="#f2c46d" fill-opacity="0.95" stroke="#2b2a28" stroke-width="2.5"/>
    <path d="M420 330 L420 346" stroke="#2b2a28" stroke-width="1.8"/>
    <path d="M444 340 C 458 343, 470 343, 484 340" stroke="#2b2a28" stroke-width="2.2"/>
    <path d="M474 332 L486 340 L474 348" stroke="#2b2a28" stroke-width="2.2"/>
    <!-- the small, dull thing, at the narrow end -->
    <path d="M500 320 L590 320 L590 400 L500 400 Z" fill="#7fa98a" fill-opacity="0.45" stroke="#2b2a28" stroke-width="2.6"/>
    <path d="M500 320 L530 296 L620 296 L590 320 M620 296 L620 376 L590 400" stroke="#2b2a28" stroke-width="2.6"/>
    <!-- a home behind it: stability -->
    <path d="M650 400 L650 330 L700 290 L750 330 L750 400 Z" fill="#f4f1ea" stroke="#2b2a28" stroke-width="2.4"/>
    <path d="M688 400 L688 362 L712 362 L712 400" stroke="#2b2a28" stroke-width="2.2"/>
    <path d="M638 340 L700 288 L762 340" stroke="#e8836b" stroke-width="2.6"/>
    <!-- time, running -->
    <path d="M110 70 L170 70 M110 160 L170 160 M116 70 C 116 100, 140 108, 140 115 C 140 122, 116 130, 116 160 M164 70 C 164 100, 140 108, 140 115 C 140 122, 164 130, 164 160" stroke="#2b2a28" stroke-width="2.4"/>
    <path d="M124 92 L156 92 L140 110 Z" fill="#f2c46d" fill-opacity="0.9" stroke="none"/>
    <path d="M140 118 L140 146" stroke="#c99a3c" stroke-width="1.6" stroke-dasharray="2 4"/>
    <path d="M122 158 C 130 144, 150 144, 158 158 Z" fill="#f2c46d" fill-opacity="0.9" stroke="none"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2a28">
    <text x="470" y="110" font-size="20" font-style="italic" text-anchor="middle" opacity="0.85">narrow it, and stick to it</text>
  </g>
</svg>
