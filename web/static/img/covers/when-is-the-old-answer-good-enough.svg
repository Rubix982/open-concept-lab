<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 560" role="img" aria-label="Two mannequins standing in warm light. The shorter one on the left wears a kameez and trousers. A dashed arc carries the kameez over to the taller one on the right, where it appears as a dashed outline, arriving.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.033" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="82"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
    <g id="mannequin" fill="#fffdf8" stroke="#6b6863" stroke-width="2.2" stroke-linejoin="round">
      <path d="M -36 -242 L -79 -152 L -69 -147 L -30 -221 Z M 36 -242 L 79 -152 L 69 -147 L 30 -221 Z"/>
      <circle cx="-75" cy="-145" r="6"/>
      <circle cx="75" cy="-145" r="6"/>
      <rect x="-7" y="-263" width="14" height="12"/>
      <circle cx="0" cy="-280" r="19"/>
      <path d="M -36 -242 C -38 -220, -31 -200, -28 -180 C -30 -166, -34 -156, -33 -145 L -26 -3 L -8 -3 L 0 -136 L 8 -3 L 26 -3 L 33 -145 C 34 -156, 30 -166, 28 -180 C 31 -200, 38 -220, 36 -242 C 24 -250, 12 -251, 7 -253 L -7 -253 C -12 -251, -24 -250, -36 -242 Z"/>
    </g>
    <path id="kameez" d="M -36 -242 L -55 -205 L -45 -191 L -30 -219 C -31 -190, -35 -150, -45 -80 Q 0 -74, 45 -80 C 35 -150, 31 -190, 30 -219 L 45 -191 L 55 -205 L 36 -242 C 24 -250, 12 -251, 7 -253 L -7 -253 C -12 -251, -24 -250, -36 -242 Z"/>
  </defs>
  <rect width="800" height="560" fill="#f4f1ea"/>
  <rect width="800" height="560" filter="url(#grain)"/>
  <ellipse cx="405" cy="452" rx="330" ry="46" fill="#f2c46d" opacity="0.25"/>

  <g filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 451 L740 451" stroke="#2b2a28" stroke-width="1.6" opacity="0.45" fill="none"/>

    <g transform="translate(240 450) scale(1.0)">
      <use xlink:href="#mannequin" href="#mannequin"/>
      <path d="M -34 -84 L -30 -5 L -8 -5 L -1 -84 Z M 1 -84 L 8 -5 L 30 -5 L 34 -84 Z" fill="#4338a8" fill-opacity="0.32" stroke="#2b2a28" stroke-width="2"/>
      <use xlink:href="#kameez" href="#kameez" fill="#e0a93a" fill-opacity="0.85" stroke="#2b2a28" stroke-width="2.4"/>
      <path d="M -7 -253 L 0 -238 L 7 -253" fill="none" stroke="#2b2a28" stroke-width="1.6"/>
    </g>

    <g transform="translate(570 450) scale(1.1)">
      <use xlink:href="#mannequin" href="#mannequin"/>
      <use xlink:href="#kameez" href="#kameez" fill="#e0a93a" fill-opacity="0.22" stroke="#2b2a28" stroke-width="2" stroke-dasharray="7 6"/>
    </g>

    <path d="M292 168 C 340 62, 478 50, 530 138" fill="none" stroke="#4a6f55" stroke-width="2.6" stroke-dasharray="9 8"/>
    <path d="M517 132 L530 138 L530 124" fill="none" stroke="#4a6f55" stroke-width="2.6"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2a28">
    <text x="400" y="515" font-size="20" font-style="italic" text-anchor="middle" opacity="0.85">carried over, not made again</text>
  </g>
</svg>
