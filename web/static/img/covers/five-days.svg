<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A night sky of measured stars over five days. Dashed lines join some stars into constellations; one constellation is crossed out. The stars are real, the constellations were ours.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#2a2850"/><stop offset="1" stop-color="#161628"/></radialGradient>
    <g id="star"><path d="M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z"/></g>
  </defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <!-- faint field -->
  <g fill="#f4f1ea" opacity="0.45">
    <circle cx="60" cy="70" r="1.4"/><circle cx="130" cy="210" r="1.1"/><circle cx="250" cy="60" r="1.3"/><circle cx="330" cy="300" r="1"/><circle cx="420" cy="110" r="1.4"/><circle cx="520" cy="60" r="1.1"/><circle cx="610" cy="250" r="1.3"/><circle cx="700" cy="90" r="1"/><circle cx="740" cy="330" r="1.4"/><circle cx="90" cy="390" r="1.2"/><circle cx="200" cy="330" r="1"/><circle cx="470" cy="380" r="1.2"/><circle cx="660" cy="410" r="1"/><circle cx="560" cy="170" r="1"/><circle cx="300" cy="160" r="1.2"/><circle cx="38" cy="250" r="1"/>
  </g>
  <g filter="url(#rough)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- a constellation we drew, and kept -->
    <path d="M120 150 L210 110 L300 190 L270 270 L170 250 Z" stroke="#b1a9ff" stroke-width="2" stroke-dasharray="3 9"/>
    <!-- a constellation we drew, and struck out -->
    <path d="M460 140 L560 220 L640 150 L700 240" stroke="#e8836b" stroke-width="2" stroke-dasharray="3 9"/>
    <path d="M520 150 L690 250 M690 150 L520 250" stroke="#e8836b" stroke-width="2.6"/>
    <!-- a third, still open -->
    <path d="M380 330 L470 300 L540 360" stroke="#b1a9ff" stroke-width="2" stroke-dasharray="3 9" opacity="0.7"/>
    <!-- the day ruler -->
    <path d="M80 470 H720" stroke="#f4f1ea" stroke-width="2" opacity="0.6"/>
    <path d="M80 462 v16 M240 462 v16 M400 462 v16 M560 462 v16 M720 462 v16" stroke="#f4f1ea" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- the measured stars -->
  <g fill="#f2c46d">
    <use href="#star" x="120" y="150"/><use href="#star" x="210" y="110" transform="translate(210 110) scale(1.3) translate(-210 -110)"/><use href="#star" x="300" y="190"/><use href="#star" x="270" y="270"/><use href="#star" x="170" y="250"/>
    <use href="#star" x="460" y="140"/><use href="#star" x="560" y="220"/><use href="#star" x="640" y="150"/><use href="#star" x="700" y="240"/>
    <use href="#star" x="380" y="330"/><use href="#star" x="470" y="300"/><use href="#star" x="540" y="360"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f4f1ea">
    <g font-size="15" opacity="0.75"><text x="68" y="506">day 1</text><text x="228" y="506">2</text><text x="388" y="506">3</text><text x="548" y="506">4</text><text x="704" y="506">5</text></g>
    <text x="400" y="420" font-size="20" font-style="italic" text-anchor="middle" opacity="0.92">the stars are real; the constellations were ours</text>
  </g>
</svg>
