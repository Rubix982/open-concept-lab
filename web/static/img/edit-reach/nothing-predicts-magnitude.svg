<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Eight correlations between a subject's properties and the damage an edit does, each drawn as a point with a ninety-five percent interval. Every interval crosses zero and every point sits within 0.13 of it. A shaded band from minus 0.37 to plus 0.37 marks the region this study could not have seen, and every interval lies inside it.">
  <style type="text/css"><![CDATA[
    /* Own copy of the palette: an image element cannot inherit the page's
       custom properties. Fallbacks kept so the PDF converter renders it too. */
    :root {
        --paper: #f4f1ea;
        --ink: #2b2a28;
        --faint: #6b6863;
        --link: #4338a8;
        --oxide: #a4442f;
        --sage-deep: #4a6f55;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --paper: #1b1a18;
          --ink: #eeece6;
          --faint: #9a968e;
          --link: #b1a9ff;
          --oxide: #e3977f;
          --sage-deep: #93c9a5;
      }
      rect[filter*="grain"] { display: none; }
    }
  ]]></style>

  <defs>
    <!-- userSpaceOnUse: a percentage filter region is a share of the bounding
         box, so a thin rule with no height has nothing to draw into. -->
    <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="1000" height="500" fill="var(--paper, #f4f1ea)"/>
  <rect width="1000" height="500" filter="url(#grain)"/>

  <text x="40" y="40" font-family="Lato, sans-serif" font-size="15" font-weight="900" letter-spacing="0.9" fill="var(--ink, #2b2a28)">EIGHT WAYS OF ASKING, AND NONE OF THEM ANSWERS</text>
  <text x="40" y="64" font-family="Georgia, serif" font-size="13.5" font-style="italic" fill="var(--faint, #6b6863)">Spearman correlation against per-subject damage, 41 subjects, bootstrap 10,000, seed 1538.</text>

  <!-- scale: x = 620 + rho * 620, so -0.5 -> 310, 0 -> 620, +0.5 -> 930 -->

  <!-- the band this study could not see inside: |rho| <= 0.37 -->
  <rect x="391" y="96" width="458" height="300" fill="var(--faint, #6b6863)" opacity="0.09"/>
  <text x="620" y="116" font-family="Georgia, serif" font-size="12.5" font-style="italic" fill="var(--faint, #6b6863)" text-anchor="middle">41 subjects cannot see an effect inside this band</text>

  <!-- zero line -->
  <path d="M620 96 V396" stroke="var(--ink, #2b2a28)" stroke-width="1.4" opacity="0.55" fill="none"/>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--faint, #6b6863)" text-anchor="middle">
    <text x="391" y="416">-0.37</text>
    <text x="620" y="416">0</text>
    <text x="849" y="416">+0.37</text>
  </g>

  <!-- rows: label, rho, lo, hi -->
  <g font-family="Georgia, serif" font-size="12.5" fill="var(--ink, #2b2a28)">
    <text x="40" y="146">prominence</text>
    <text x="40" y="180">dependent count</text>
    <text x="40" y="214">total statements</text>
    <text x="40" y="248">headroom</text>
    <text x="40" y="282">prominence | dependent count</text>
    <text x="40" y="316">dependent count | prominence</text>
    <text x="40" y="350">prominence | both</text>
    <text x="40" y="384">dependent count | both</text>
  </g>

  <g filter="url(#rough)" stroke-linecap="round" fill="none">
    <!-- +0.005  (-0.315, +0.314) -->
    <path d="M425 142 H815" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- -0.053  (-0.366, +0.270) -->
    <path d="M393 176 H787" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- -0.055  (-0.370, +0.259) -->
    <path d="M391 210 H781" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- -0.130  (-0.399, +0.171) -->
    <path d="M373 244 H726" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- +0.059  (-0.228, +0.336) -->
    <path d="M479 278 H828" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- -0.079  (-0.355, +0.211) -->
    <path d="M400 312 H751" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- +0.038  (-0.266, +0.327) -->
    <path d="M455 346 H823" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
    <!-- -0.047  (-0.340, +0.264) -->
    <path d="M409 380 H784" stroke="var(--faint, #6b6863)" stroke-width="2.2" opacity="0.75"/>
  </g>

  <g fill="var(--link, #4338a8)">
    <circle cx="623" cy="142" r="5"/>
    <circle cx="587" cy="176" r="5"/>
    <circle cx="586" cy="210" r="5"/>
    <circle cx="539" cy="244" r="5"/>
    <circle cx="657" cy="278" r="5"/>
    <circle cx="571" cy="312" r="5"/>
    <circle cx="644" cy="346" r="5"/>
    <circle cx="591" cy="380" r="5"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="11.5" fill="var(--faint, #6b6863)">
    <text x="862" y="146">+0.005</text>
    <text x="862" y="180">-0.053</text>
    <text x="862" y="214">-0.055</text>
    <text x="862" y="248">-0.130</text>
    <text x="862" y="282">+0.059</text>
    <text x="862" y="316">-0.079</text>
    <text x="862" y="350">+0.038</text>
    <text x="862" y="384">-0.047</text>
  </g>

  <text x="40" y="452" font-family="Georgia, serif" font-size="14" fill="var(--ink, #2b2a28)">Every interval crosses zero, and every estimate sits deep inside the band — the largest is 0.130. So this rules</text>
  <text x="40" y="472" font-family="Georgia, serif" font-size="14" fill="var(--ink, #2b2a28)">out a relationship stronger than about 0.37 and nothing weaker: <tspan font-style="italic">no evidence of an effect, not evidence of no effect.</tspan></text>
</svg>
