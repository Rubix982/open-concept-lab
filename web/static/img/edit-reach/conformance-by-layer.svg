<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 326" width="930" height="326" role="img" aria-label="A grid of 6 reproducibility checks down and the sampled layers across, one panel per model: Llama-3.1-8B, GPT-J-6B, Llama-3.1-70B. Darker means a larger disagreement between two readings of the same quantity. The nonzero values run from 1.9e-09 to 2.7e-01, a span of about 8 orders of magnitude, and they do not grow or shrink consistently with depth. Checks that match exactly are drawn empty with a dot rather than as the palest shade.">
  <style type="text/css"><![CDATA[
    :root {
        --paper: #f4f1ea;
        --ink: #2b2a28;
        --faint: #6b6863;
        --link: #4338a8;
        --rule: #d9d3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --paper: #1b1a18;
          --ink: #eeece6;
          --faint: #9a968e;
          --link: #b1a9ff;
          --rule: #3a3833;
      }
    }
    text { font-family: Lato, "Helvetica Neue", sans-serif; }
    .model  { font-size: 14px; font-weight: 600; fill: var(--ink, #2b2a28); }
    .tick   { font-size: 11px; fill: var(--faint, #6b6863); }
    .rowlab { font-size: 11.5px; fill: var(--faint, #6b6863); }
    .mid    { text-anchor: middle; }
    .end    { text-anchor: end; }
    /* One hue, light to dark. Magnitudes have no polarity, so a diverging
       scale would invent a midpoint that the data does not have. */
    .cell   { fill: var(--link, #4338a8); }
    .zero   { fill: none; stroke: var(--rule, #d9d3c7); stroke-width: 1; }
    .zerodot{ fill: var(--faint, #6b6863); }
    .absent { fill: none; stroke: var(--rule, #d9d3c7); stroke-dasharray: 2 3; }
  ]]></style>

