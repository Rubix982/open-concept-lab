<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Three prompts drawn as strips. The edit prompt begins with Henry Mackenzie. A probe that begins with the same name shares every token the subject's last token can see under causal attention, so its key is identical and the coefficient is exactly 1.000. A probe beginning with a different person sees different text at that position, and the coefficient is 0.082.">
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.034" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="18"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="1000" height="560" fill="#f4f1ea"/>
  <rect width="1000" height="560" filter="url(#grain)"/>

  <g filter="url(#rough)" fill="none" stroke="#2b2a28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- the edit prompt -->
    <rect x="72" y="140" width="228" height="56" rx="8" fill="#4338a8" fill-opacity="0.18" stroke="#4338a8" stroke-width="2.8"/>
    <rect x="300" y="140" width="330" height="56" rx="8" fill="#fffdf8"/>
    <path d="M300 204 V216" stroke="#4338a8" stroke-width="3"/>
    <path d="M300 222 L292 206 L308 206 Z" fill="#4338a8" stroke="#4338a8"/>

    <!-- probe A: same opening -->
    <rect x="72" y="306" width="228" height="56" rx="8" fill="#4338a8" fill-opacity="0.18" stroke="#4338a8" stroke-width="2.8"/>
    <rect x="300" y="306" width="282" height="56" rx="8" fill="#fffdf8"/>
    <path d="M300 306 V362" stroke="#4338a8" stroke-width="2.6" opacity="0.8"/>

    <!-- what that token can see -->
    <path d="M84 268 H296" stroke="#4338a8" stroke-width="2" stroke-dasharray="5 7" opacity="0.75"/>
    <path d="M84 262 V274 M296 262 V274" stroke="#4338a8" stroke-width="2" opacity="0.75"/>

    <!-- probe B: a different person -->
    <rect x="72" y="430" width="158" height="56" rx="8" fill="#a4442f" fill-opacity="0.16" stroke="#a4442f" stroke-width="2.8"/>
    <rect x="230" y="430" width="300" height="56" rx="8" fill="#fffdf8"/>
    <path d="M230 430 V486" stroke="#a4442f" stroke-width="2.6" opacity="0.8"/>

    <!-- divider -->
    <path d="M72 398 H928" stroke-width="1.6" stroke-dasharray="4 10" opacity="0.3"/>
  </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" fill="#2b2a28">
    <text x="72" y="62" font-size="19" letter-spacing="1.6" fill="#8a5a3b">WHY ONE NUMBER IS EXACT AND THE OTHER IS NOT</text>
    <text x="72" y="86" font-size="13.5" font-style="italic" opacity="0.72">the coefficient is read at the subject's last token, and under causal attention that token sees only what precedes it</text>

    <text x="72" y="124" font-size="13" letter-spacing="1.1" fill="#4338a8">THE EDIT</text>
    <text x="186" y="174" font-size="15.5" text-anchor="middle" fill="#4338a8">Henry Mackenzie</text>
    <text x="465" y="174" font-size="15.5" text-anchor="middle" opacity="0.78">was born in the country of</text>
    <text x="660" y="174" font-size="15.5" fill="#a4442f">→ Chile</text>
    <text x="316" y="240" font-size="12.5" opacity="0.65">the key is read here</text>

    <text x="72" y="290" font-size="13" letter-spacing="1.1" fill="#4338a8">A PROBE THAT OPENS THE SAME WAY</text>
    <text x="186" y="340" font-size="15.5" text-anchor="middle" fill="#4338a8">Henry Mackenzie</text>
    <text x="441" y="340" font-size="15.5" text-anchor="middle" opacity="0.78">was born in the city of</text>
    <text x="220" y="254" font-size="12" text-anchor="middle" fill="#4338a8">everything that token can see — identical in both</text>

    <text x="640" y="332" font-size="30" fill="#4338a8">1.000</text>
    <text x="640" y="354" font-size="12.5" opacity="0.7">exact, by arithmetic. For any covariance,</text>
    <text x="640" y="371" font-size="12.5" opacity="0.7">at any layer, whatever it goes on to ask.</text>

    <text x="72" y="414" font-size="13" letter-spacing="1.1" fill="#a4442f">A PROBE THAT OPENS WITH SOMEONE ELSE</text>
    <text x="151" y="464" font-size="15.5" text-anchor="middle" fill="#a4442f">Karim Lala</text>
    <text x="380" y="464" font-size="15.5" text-anchor="middle" opacity="0.78">was born in the city of</text>
    <text x="640" y="456" font-size="30" fill="#a4442f">0.082</text>
    <text x="640" y="478" font-size="12.5" opacity="0.7">measured. A different token, with different</text>
    <text x="640" y="495" font-size="12.5" opacity="0.7">text behind it, has a different key.</text>

    <text x="72" y="524" font-size="11.5" opacity="0.5">1.000 held exactly across four models from 6B to 405B · [E-032]</text>
    <text x="72" y="542" font-size="11.5" opacity="0.5">The groups do not overlap: the highest different-subject reading, 0.153, sits below the lowest same-subject one, 0.483 · [E-018]</text>
  </g>
</svg>
