<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="An edit passes through two steps. The first, delivery, is how much of the edit vector arrives at a token, and the coefficient measures it. The second, effect, is how far the model's answer moves, and the coefficient does not measure it. At one fixed coefficient the measured movement still spans a factor of 2.96.">
  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.034" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="18"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="1000" height="420" fill="#f4f1ea"/>
  <rect width="1000" height="420" filter="url(#grain)"/>

  <g filter="url(#rough)" fill="none" stroke="#2b2a28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="72" y="166" width="186" height="84" rx="9" fill="#4338a8" fill-opacity="0.16" stroke="#4338a8" stroke-width="2.8"/>
    <rect x="396" y="166" width="186" height="84" rx="9" fill="#fffdf8"/>
    <rect x="720" y="166" width="186" height="84" rx="9" fill="#7fa98a" fill-opacity="0.24"/>

    <path d="M258 208 H388"/>
    <path d="M396 208 L378 200 L378 216 Z" fill="#2b2a28"/>
    <path d="M582 208 H712"/>
    <path d="M720 208 L702 200 L702 216 Z" fill="#2b2a28"/>

    <!-- what the coefficient covers -->
    <path d="M258 288 H582" stroke="#4338a8" stroke-width="2.4"/>
    <path d="M258 282 V294 M582 282 V294" stroke="#4338a8" stroke-width="2.4"/>

    <!-- and what it does not -->
    <path d="M598 288 H906" stroke="#a4442f" stroke-width="2.4" stroke-dasharray="6 8"/>
    <path d="M598 282 V294 M906 282 V294" stroke="#a4442f" stroke-width="2.4"/>

    <!-- the spread on the second step, at a fixed first step -->
    <path d="M922 168 V248" stroke="#a4442f" stroke-width="2.6"/>
    <path d="M916 168 H928 M916 248 H928" stroke="#a4442f" stroke-width="2.6"/>
  </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" fill="#2b2a28">
    <text x="72" y="62" font-size="19" letter-spacing="1.6" fill="#8a5a3b">DELIVERY IS NOT EFFECT</text>
    <text x="72" y="86" font-size="13.5" font-style="italic" opacity="0.72">every number in this project measures the first step. None of them measures the second.</text>

    <text x="165" y="200" font-size="16" text-anchor="middle" fill="#4338a8">the edit</text>
    <text x="165" y="226" font-size="12.5" text-anchor="middle" opacity="0.7">a rank-one update</text>

    <text x="489" y="194" font-size="16" text-anchor="middle">what arrives</text>
    <text x="489" y="214" font-size="12.5" text-anchor="middle" opacity="0.7">at one token, as a fraction</text>
    <text x="489" y="234" font-size="12.5" text-anchor="middle" opacity="0.7">of the update vector</text>

    <text x="813" y="194" font-size="16" text-anchor="middle">what the answer does</text>
    <text x="813" y="214" font-size="12.5" text-anchor="middle" opacity="0.7">how far the model's</text>
    <text x="813" y="234" font-size="12.5" text-anchor="middle" opacity="0.7">prediction actually moved</text>

    <text x="420" y="316" font-size="14" text-anchor="middle" fill="#4338a8">the coefficient measures this</text>
    <text x="420" y="336" font-size="12.5" text-anchor="middle" opacity="0.65">computable in one forward pass, before the edit is applied</text>

    <text x="752" y="316" font-size="14" text-anchor="middle" fill="#a4442f">and says nothing about this</text>
    <text x="752" y="336" font-size="12.5" text-anchor="middle" opacity="0.65">hold the first step fixed and the second still spans ×2.96</text>

    <text x="990" y="204" font-size="20" text-anchor="end" fill="#a4442f">×2.96</text>
    <text x="990" y="224" font-size="11.5" text-anchor="end" opacity="0.6">at a fixed</text>
    <text x="990" y="239" font-size="11.5" text-anchor="end" opacity="0.6">coefficient</text>

    <text x="72" y="384" font-size="11.5" opacity="0.5">[E-028d] · the coefficient is a property of a token, not a prompt: within one prompt, the subject and final positions differ by 35x</text>
  </g>
</svg>
