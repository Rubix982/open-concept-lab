<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 388" width="740" height="388" role="img" aria-label="Two heat map panels, six probe families down and two columns across — content and identity. Content is the real edit minus a different fact about the same person; identity is that control minus another person's edit. In the destruction panel the identity column is filled and the content column is nearly empty; in the destination panel it is the reverse. For example on repetition, destruction splits +0.0562 content against +0.3585 identity, while destination splits +0.4524 content against +0.0000 identity. Every cell carries its number.">
  <style type="text/css"><![CDATA[
    /* Diverging: two hues and a neutral midpoint, because these are signed
       differences. Both pairs pass all six dataviz checks on their own
       surface; the page's own ink tokens do not on the dark one. */
    :root {
        --paper: #f4f1ea;
        --ink: #2b2a28;
        --faint: #6b6863;
        --rule: #d9d3c7;
        --cool: #5b4fc4;
        --warm: #a4442f;
        --oncell: #2b2a28;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --paper: #1b1a18;
          --ink: #eeece6;
          --faint: #9a968e;
          --rule: #3a3833;
          --cool: #8078e0;
          --warm: #c9664a;
          --oncell: #eeece6;
      }
    }
    text { font-family: Lato, "Helvetica Neue", sans-serif; }
    .panel  { font-size: 14px; font-weight: 600; fill: var(--ink, #2b2a28); }
    .collab { font-size: 12px; fill: var(--faint, #6b6863); letter-spacing: 0.04em; text-transform: uppercase; }
    .rowlab { font-size: 12px; fill: var(--faint, #6b6863); }
    .tick   { font-size: 11px; fill: var(--faint, #6b6863); }
    .mid    { text-anchor: middle; }
    .end    { text-anchor: end; }
    /* The number is in every cell, so identity never rests on colour alone. */
    .val    { font-size: 11.5px; font-family: "IBM Plex Mono", ui-monospace, monospace; fill: var(--oncell, #2b2a28); }
    .cool   { fill: var(--cool, #5b4fc4); }
    .warm   { fill: var(--warm, #a4442f); }
  ]]></style>

