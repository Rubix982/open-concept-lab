<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500"
     width="1000" height="500" role="img"
     aria-label="Two panels on one shared scale from 0 to 1, three models in each.
     In the near field, where the question names the edited subject, the subject's
     own edit and a stranger's edit on the same relation sit far apart on every
     model: 0.9334 against 0.0842 on
     Llama-3.1-8B, an excess of +0.8436, and
     0.7985 against 0.1563 on GPT-J-6B. In the far field, where the question never
     names the subject, the two marks are one mark on every model:
     0.0543 against 0.0480 on
     Llama-3.1-8B, an excess of +0.0002.">
  <style><![CDATA[
    :root {
        --paper: #f4f1ea; --ink: #2b2a28; --faint: #6b6863; --rule: #d9d3c7;
        --own: #5b4fc4; --floor: #a4442f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --paper: #1b1a18; --ink: #eeece6; --faint: #9a968e; --rule: #3a3833;
          --own: #8078e0; --floor: #c9664a;
      }
    }
    text { font-family: Lato, "Helvetica Neue", sans-serif; }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .panel { font-size: 15px; font-weight: 600; fill: var(--ink, #2b2a28); }
    .sub   { font-size: 12px; fill: var(--faint, #6b6863); }
    .rowlab{ font-size: 12.5px; fill: var(--ink, #2b2a28); }
    .tick  { font-size: 11px; fill: var(--faint, #6b6863); }
    .grid  { stroke: var(--rule, #d9d3c7); stroke-width: 1; }
    .rail  { stroke: var(--rule, #d9d3c7); stroke-width: 1; }
    .span  { stroke: var(--ink, #2b2a28); stroke-width: 2; opacity: 0.55; }
    .ring  { fill: var(--paper, #f4f1ea); }
    .own   { fill: var(--own, #5b4fc4); }
    .floor { fill: var(--floor, #a4442f); }
    /* The excess is printed on every row, so the figure survives grayscale. */
    .exc   { font-size: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace;
              fill: var(--ink, #2b2a28); }
  ]]></style>

  <rect width="1000" height="500" fill="var(--paper, #f4f1ea)"/>
  <text x="150" y="48" class="panel">Near field</text>
  <text x="150" y="65" class="sub">the question names the edited subject</text>
  <text x="136" y="79" class="rowlab end">Llama-3.1-8B</text>
  <path d="M150 74 H850" class="rail"/>
  <path d="M208.9 74 H803.4" class="span"/>
  <circle cx="208.9" cy="74" r="6" class="ring"/>
  <circle cx="208.9" cy="74" r="4.5" class="floor"/>
  <circle cx="803.4" cy="74" r="6" class="ring"/>
  <circle cx="803.4" cy="74" r="4.5" class="own"/>
  <text x="864" y="79" class="exc">+0.8436</text>
  <text x="136" y="137" class="rowlab end">Llama-3.1-70B</text>
  <path d="M150 132 H850" class="rail"/>
  <path d="M171.5 132 H804.5" class="span"/>
  <circle cx="171.5" cy="132" r="6" class="ring"/>
  <circle cx="171.5" cy="132" r="4.5" class="floor"/>
  <circle cx="804.5" cy="132" r="6" class="ring"/>
  <circle cx="804.5" cy="132" r="4.5" class="own"/>
  <text x="864" y="137" class="exc">+0.9007</text>
  <text x="136" y="195" class="rowlab end">GPT-J-6B</text>
  <path d="M150 190 H850" class="rail"/>
  <path d="M259.4 190 H709.0" class="span"/>
  <circle cx="259.4" cy="190" r="6" class="ring"/>
  <circle cx="259.4" cy="190" r="4.5" class="floor"/>
  <circle cx="709.0" cy="190" r="6" class="ring"/>
  <circle cx="709.0" cy="190" r="4.5" class="own"/>
  <text x="864" y="195" class="exc">+0.6412</text>
  <text x="150" y="268" class="panel">Far field</text>
  <text x="150" y="285" class="sub">the question never names it</text>
  <text x="136" y="299" class="rowlab end">Llama-3.1-8B</text>
  <path d="M150 294 H850" class="rail"/>
  <path d="M183.6 294 H188.0" class="span"/>
  <circle cx="183.6" cy="294" r="6" class="ring"/>
  <circle cx="183.6" cy="294" r="4.5" class="floor"/>
  <circle cx="188.0" cy="294" r="6" class="ring"/>
  <circle cx="188.0" cy="294" r="4.5" class="own"/>
  <text x="864" y="299" class="exc">+0.0002</text>
  <text x="136" y="357" class="rowlab end">Llama-3.1-70B</text>
  <path d="M150 352 H850" class="rail"/>
  <path d="M158.3 352 H162.2" class="span"/>
  <circle cx="158.3" cy="352" r="6" class="ring"/>
  <circle cx="158.3" cy="352" r="4.5" class="floor"/>
  <circle cx="162.2" cy="352" r="6" class="ring"/>
  <circle cx="162.2" cy="352" r="4.5" class="own"/>
  <text x="864" y="357" class="exc">+0.0000</text>
  <text x="136" y="415" class="rowlab end">GPT-J-6B</text>
  <path d="M150 410 H850" class="rail"/>
  <path d="M237.8 410 H241.1" class="span"/>
  <circle cx="237.8" cy="410" r="6" class="ring"/>
  <circle cx="237.8" cy="410" r="4.5" class="floor"/>
  <circle cx="241.1" cy="410" r="6" class="ring"/>
  <circle cx="241.1" cy="410" r="4.5" class="own"/>
  <text x="864" y="415" class="exc">-0.0000</text>
  <path d="M150.0 32 V444" class="grid"/>
  <text x="150.0" y="464" class="tick mid">0.00</text>
  <path d="M325.0 32 V444" class="grid"/>
  <text x="325.0" y="464" class="tick mid">0.25</text>
  <path d="M500.0 32 V444" class="grid"/>
  <text x="500.0" y="464" class="tick mid">0.50</text>
  <path d="M675.0 32 V444" class="grid"/>
  <text x="675.0" y="464" class="tick mid">0.75</text>
  <path d="M850.0 32 V444" class="grid"/>
  <text x="850.0" y="464" class="tick mid">1.00</text>
  <text x="500" y="486" class="sub mid">coefficient — the fraction of the update the token receives</text>
  <text x="864" y="48" class="sub">excess</text>
  <circle cx="150" cy="22" r="4.5" class="own"/>
  <text x="161" y="26" class="sub">the subject's own edit</text>
  <circle cx="330" cy="22" r="4.5" class="floor"/>
  <text x="341" y="26" class="sub">a stranger's, same relation</text>
</svg>
