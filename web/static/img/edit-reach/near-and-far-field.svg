<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="One shared scale from 0 to 1 showing the coefficient under two conditions. In the near field, where the question names the edited subject, the subject's own edit reads 0.9334 while a stranger's edit on the same relation reads 0.0506 — an excess of plus 0.8439. In the far field, where the question never names the subject, the two read 0.0543 and 0.0481, an excess of plus 0.0002, so close that the two marks sit almost on top of each other.">
  <style type="text/css"><![CDATA[
    /* The page has a light and a dark theme. An image element cannot inherit
       the page's custom properties, because it is a separate document; its own
       stylesheet is honoured though, media queries included. So the figure
       carries its own copy of the palette and follows the reader's theme. */
    :root {
        --paper: #f4f1ea;
        --paper-raised: #fffdf8;
        --ink: #2b2a28;
        --link: #4338a8;
        --oxide: #a4442f;
        --umber: #8a5a3b;
        --sage: #7fa98a;
        --sage-deep: #4a6f55;
        --gold: #f2c46d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --paper: #1b1a18;
          --paper-raised: #24231f;
          --ink: #eeece6;
          --link: #b1a9ff;
          --oxide: #e3977f;
          --umber: #c9a07e;
          --sage: #7dbb92;
          --sage-deep: #93c9a5;
          --gold: #d9a94e;
      }
      /* The grain is a warm tint baked into a colour matrix. On dark paper it
         reads as brown noise, so it comes off rather than being re-tuned. */
      rect[filter*="grain"] { display: none; }
    }
  ]]></style>

  <defs>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.034" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="18"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="1000" height="560" fill="var(--paper)"/>
  <rect width="1000" height="560" filter="url(#grain)"/>

  <!-- rules and marks -->
  <g filter="url(#rough)" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">

    <!-- shared scale -->
    <path d="M120 470 H920" stroke-width="2" opacity="0.55"/>
    <g stroke-width="1.6" opacity="0.45">
      <path d="M120 470 V480"/><path d="M320 470 V480"/><path d="M520 470 V480"/>
      <path d="M720 470 V480"/><path d="M920 470 V480"/>
    </g>
    <g stroke-width="1.2" stroke-dasharray="3 9" opacity="0.22">
      <path d="M320 150 V470"/><path d="M520 150 V470"/><path d="M720 150 V470"/>
    </g>

    <!-- near field row -->
    <path d="M120 205 H920" stroke-width="1.2" opacity="0.18"/>
    <path d="M160.5 205 H866.7" stroke="var(--link)" stroke-width="2.4" opacity="0.4"/>
    <circle cx="160.5" cy="205" r="9" fill="var(--paper)" stroke="var(--oxide)" stroke-width="3"/>
    <circle cx="866.7" cy="205" r="9" fill="var(--link)" stroke="var(--link)" stroke-width="2.4"/>

    <!-- far field row -->
    <path d="M120 365 H920" stroke-width="1.2" opacity="0.18"/>
    <circle cx="158.5" cy="365" r="9" fill="var(--paper)" stroke="var(--oxide)" stroke-width="3"/>
    <circle cx="163.4" cy="365" r="11.5" fill="var(--paper)" stroke="none"/>
    <circle cx="163.4" cy="365" r="9" fill="var(--link)" stroke="var(--link)" stroke-width="2.4"/>

    <!-- the callout on the far pair -->
    <path d="M161 383 Q161 420 250 420" stroke="var(--ink)" stroke-width="1.6" opacity="0.5"/>

    <!-- divider -->
    <path d="M120 285 H920" stroke-width="1.6" stroke-dasharray="4 10" opacity="0.35"/>
  </g>

  <!-- type -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" fill="var(--ink)">
    <text x="120" y="62" font-size="19" letter-spacing="1.6" fill="var(--umber)">THE SAME CONTROL, APPLIED TWICE</text>
    <text x="120" y="86" font-size="13.5" font-style="italic" opacity="0.72">how much of an edit reaches the queried token — the subject's own edit, against a stranger's edit on the same relation</text>

    <!-- legend -->
    <g font-size="13.5">
      <circle cx="128" cy="118" r="7" fill="var(--link)" stroke="var(--link)" stroke-width="2"/>
      <text x="144" y="123">the subject's own edit</text>
      <circle cx="340" cy="118" r="7" fill="var(--paper)" stroke="var(--oxide)" stroke-width="2.6"/>
      <text x="356" y="123">a stranger's edit, same relation</text>
    </g>

    <!-- near field -->
    <text x="120" y="172" font-size="16.5" letter-spacing="1.1" fill="var(--link)">NEAR FIELD</text>
    <text x="246" y="172" font-size="13" font-style="italic" opacity="0.7">the question names the edited subject · n = 639</text>
    <text x="866.7" y="186" font-size="14" text-anchor="middle" fill="var(--link)">0.9334</text>
    <text x="160.5" y="186" font-size="14" text-anchor="middle" fill="var(--oxide)">0.0506</text>
    <text x="513" y="241" font-size="15" text-anchor="middle">excess <tspan font-size="17">+0.8439</tspan></text>
    <text x="513" y="261" font-size="12" text-anchor="middle" opacity="0.6">95% CI (+0.8379, +0.8500)</text>

    <!-- far field -->
    <text x="120" y="332" font-size="16.5" letter-spacing="1.1" fill="var(--link)">FAR FIELD</text>
    <text x="236" y="332" font-size="13" font-style="italic" opacity="0.7">the question never names it — where multi-hop propagation lives · n = 900</text>
    <text x="262" y="426" font-size="15">0.0543 and 0.0481 — excess <tspan font-size="17">+0.0002</tspan></text>
    <text x="262" y="446" font-size="12" opacity="0.6">95% CI (+0.0001, +0.0004). At this scale the two marks are one mark.</text>

    <!-- scale -->
    <g font-size="12.5" text-anchor="middle" opacity="0.6">
      <text x="120" y="498">0</text><text x="320" y="498">0.25</text><text x="520" y="498">0.50</text>
      <text x="720" y="498">0.75</text><text x="920" y="498">1.00</text>
    </g>
    <text x="520" y="522" font-size="12.5" text-anchor="middle" opacity="0.6">fraction of the edit arriving at the queried token</text>
    <text x="520" y="546" font-size="11.5" text-anchor="middle" opacity="0.5">Llama-3.1-8B, layer 5 · MQuAKE-CF-3k, 513 single-edit two-hop instances · [E-004]</text>
  </g>
</svg>
