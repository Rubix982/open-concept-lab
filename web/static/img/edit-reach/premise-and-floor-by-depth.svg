  <circle cx="171.6" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="267.2" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="458.3" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="745.1" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="159.6" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="285.1" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="494.2" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="745.1" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="159.6" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="293.5" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="477.5" cy="77.1" r="4.5" class="pindot"/>
  <circle cx="745.1" cy="77.1" r="4.5" class="pindot"/>
  <text x="826" y="81.1" class="pinlab">anchor &#183; 1.000</text>
  <text x="826" y="98.1" class="pinsub">all 12 readings</text>
  <path d="M171.6 322.0 L267.2 355.7 L458.3 326.2 L745.1 272.2" class="line s1"/>
  <circle cx="171.6" cy="322.0" r="5.5" class="ring"/>
  <circle cx="171.6" cy="322.0" r="4" class="dot s1"/>
  <circle cx="267.2" cy="355.7" r="5.5" class="ring"/>
  <circle cx="267.2" cy="355.7" r="4" class="dot s1"/>
  <circle cx="458.3" cy="326.2" r="5.5" class="ring"/>
  <circle cx="458.3" cy="326.2" r="4" class="dot s1"/>
