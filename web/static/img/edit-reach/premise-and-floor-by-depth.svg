  <circle cx="745.1" cy="272.2" r="4" class="dot s1"/>
  <text x="745.1" y="260.2" class="val mid">0.388</text>
  <path d="M159.6 383.6 L285.1 370.2 L494.2 314.4 L745.1 289.4" class="line s2"/>
  <circle cx="159.6" cy="383.6" r="5.5" class="ring"/>
  <circle cx="159.6" cy="383.6" r="4" class="dot s2"/>
  <circle cx="285.1" cy="370.2" r="5.5" class="ring"/>
  <circle cx="285.1" cy="370.2" r="4" class="dot s2"/>
  <circle cx="494.2" cy="314.4" r="5.5" class="ring"/>
  <circle cx="494.2" cy="314.4" r="4" class="dot s2"/>
  <text x="494.2" y="302.4" class="val mid">0.256</text>
  <circle cx="745.1" cy="289.4" r="5.5" class="ring"/>
  <circle cx="745.1" cy="289.4" r="4" class="dot s2"/>
  <path d="M159.6 386.2 L293.5 351.3 L477.5 381.3 L745.1 344.6" class="line s3"/>
  <circle cx="159.6" cy="386.2" r="5.5" class="ring"/>
  <circle cx="159.6" cy="386.2" r="4" class="dot s3"/>
  <text x="159.6" y="374.2" class="val mid">0.031</text>
  <circle cx="293.5" cy="351.3" r="5.5" class="ring"/>
  <circle cx="293.5" cy="351.3" r="4" class="dot s3"/>
  <text x="293.5" y="339.3" class="val mid">0.140</text>
  <circle cx="477.5" cy="381.3" r="5.5" class="ring"/>
  <circle cx="477.5" cy="381.3" r="4" class="dot s3"/>
  <circle cx="745.1" cy="344.6" r="5.5" class="ring"/>
  <circle cx="745.1" cy="344.6" r="4" class="dot s3"/>
  <path d="M816 268.2 H822" class="leader s1"/>
  <text x="826.0" y="272.2" class="dlab s1">GPT-J-6B</text>
  <path d="M816 287.2 H822" class="leader s2"/>
  <text x="826.0" y="291.2" class="dlab s2">Llama-3.1-8B</text>
  <path d="M816 340.6 H822" class="leader s3"/>
