  <path d="M76 204.7 H812" class="grid"/>
  <text x="64" y="208.7" class="tick end">0.6</text>
  <path d="M76 140.9 H812" class="grid"/>
  <text x="64" y="144.9" class="tick end">0.8</text>
  <path d="M76 77.1 H812" class="grid"/>
  <text x="64" y="81.1" class="tick end">1.0</text>
