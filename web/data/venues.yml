#   platform: where entries are submitted and scored

semeval-2027:
  name: SemEval shared tasks
  series: SemEval
  kind: competition
  year: 2027
  deadline: "2027-01-10"
  due: evaluation runs 10–31 January 2027; each task may close earlier
  when: System papers due February 2027; workshop in summer 2027
  where: Online, then a workshop at an ACL conference
  archival: "yes"
  platform: Codabench, for most tasks
  url: https://semeval.github.io/
  verified: true
  asks: >
    A set of separate tasks, each a fixed problem with its own data and
    leaderboard. Confirmed for 2027 so far: reasoning-oriented retrieval (Task 1)
    and semantic change across time periods (Task 3).
  note: >
    Dates from the task calls on the ACL portal. Teams write a system paper that
    goes into the SemEval proceedings. No 2027 task on interpretability or
    editing was found; SemEval 2025 ran one on unlearning.

