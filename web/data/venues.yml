mib-leaderboard:
  name: MIB leaderboard
  series: Mechanistic Interpretability Benchmark
  kind: competition
  year: 2027
  due: open any time; the leaderboard stays up
  when: Ongoing. It was the BlackboxNLP 2025 shared task
  where: Online
  archival: "no"
  platform: Hugging Face Spaces
  url: https://huggingface.co/spaces/mib-bench/leaderboard
  paper: https://arxiv.org/abs/2511.18409
  verified: true
  asks: >
    Two fixed problems in mechanistic interpretability itself: find the circuit
    a model uses for a task (GPT-2 Small and Qwen-2.5-0.5B on indirect object
    identification, Qwen on multiple choice), and find where a causal variable
    lives. Scored on a private test set by how faithful the circuit is across
    sizes.
  note: >
    The one standing competition in this list that is interpretability. In the
    2025 round, three teams entered eight methods, and ensembles of existing
    methods did best.

