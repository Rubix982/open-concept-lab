    Posts about work published at a top venue fairly recently: reviewing it and
    what came of it, new angles on existing ideas, reproducibility, and the
    social side of recent results. At most two posts per author.
  note: >
    Posts may not promote the authors' own or their lab's past papers, so this
    is a place for writing about somebody else's result, not one's own.

