# Interactive pages. Each entry becomes a card on /built with a live preview.
#
#   from:  path relative to the repository root — copied into static/demos/<name>/
#          by `npm run sync:demos`, then served from this site.
#   url:   an absolute URL instead, for a page deployed elsewhere (Netlify,
#          GitHub Pages). Use one of `from` or `url`, not both.
#   topic: groups the cards on /built.
#   ratio: preview aspect ratio; drop to 4/3 for a page with a tall sidebar.
#   image: a still to show instead of the live page (relative to the copied
#          folder), for pages heavy enough to slow the list down.
#   in:    another entry's name — this card is a page inside the folder that
#          entry copies (no `from` of its own); `page` names the file.
#   page:  a file in the folder other than index.html.
#   added: the date the card first appeared (YYYY-MM-DD), for "Recently added".

