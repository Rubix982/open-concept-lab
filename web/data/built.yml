  - name: miniatures
    added: 2026-10-04
    title: Routing for a Shared Prompt Cache
    from: systems/miniatures/site
    page: cache-router.html
    topic: Systems in Miniature
    what: >
      Eight GPUs serve chat requests that share long prompts. Round
      robin keeps re-reading the same prompts; sending each prompt to
      the GPU that already has it cuts the wait for the first token from
      about half a second to 30 ms, until the most popular app overloads
      one GPU and a load cap spreads it.
    ratio: 1.6
    image: posters/cache-router.jpg

  - name: mini-batching
    added: 2026-10-04
    title: Continuous Batching
    in: miniatures
    page: batching.html
    topic: Systems in Miniature
    what: >
      One GPU writing many replies at once. Waiting for the slowest
      reply in each batch leaves seats empty half the time someone is
      queuing; swapping finished replies out at every step cuts the wait
      for the first word from 16 s to under half a second.
    ratio: 1.6
    image: posters/batching.jpg

  - name: mini-disagg
    added: 2026-10-04
    title: Splitting Prompt Reading from Writing
    in: miniatures
    page: disagg.html
    topic: Systems in Miniature
    what: >
      Reading a long prompt freezes every other reply on the same GPU.
      The average gap between words looks fine while only 1% of replies
      stay on time; giving reading and writing their own GPUs brings
      that to 100%, but only if the split fits the traffic.
    ratio: 1.6
    image: posters/disagg.jpg

  - name: mini-straggler
    added: 2026-10-04
    title: The One Slow GPU
    in: miniatures
    page: straggler.html
    topic: Systems in Miniature
    what: >
      Sixteen thousand GPUs train in lockstep, so every step waits for
      the slowest, and something fails every three hours. Two weeks of
      training, with the work each failure throws away, and how often to
      save it.
    ratio: 1.6
    image: posters/straggler.jpg

  - name: mini-double-charge
    added: 2026-10-04
    title: The Agent That Charged Twice
    in: miniatures
    page: double-charge.html
    topic: Systems in Miniature
    what: >
      An AI agent pays, the reply is lost, and it tries again. Without
      an idempotency key 64 of 500 customers are charged twice; checking
      the key the naive way still lets 32 through; claiming it
      atomically, none.
    ratio: 1.6
    image: posters/double-charge.jpg

  - name: mini-herd
    added: 2026-10-04
    title: A Hundred Agents, One Rate Limit
    in: miniatures
    page: herd.html
    topic: Systems in Miniature
    what: >
      A fleet of agents shares one API budget. Retrying straight away
      fires thousands of calls into an outage; backoff with jitter calms
      the startup but oversleeps afterwards; a shared budget with a
      breaker sends 16.
    ratio: 1.6
    image: posters/herd.jpg

