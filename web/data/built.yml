# Interactive pages. Each entry becomes a card on /built with a live preview.
#
#   from:  path relative to the repository root — copied into static/demos/<name>/
#          by `npm run sync:demos`, then served from this site.
#   url:   an absolute URL instead, for a page deployed elsewhere (Netlify,
#          GitHub Pages). Use one of `from` or `url`, not both.
#   topic: groups the cards on /built.
#   ratio: preview aspect ratio; drop to 4/3 for a page with a tall sidebar.
#   image: a still to show instead of the live page (relative to the copied
#          folder), for pages heavy enough to slow the list down.

built:
  - name: belief-revision
    title: The Belief Problem
    from: mind/belief-revision.html
    topic: Mind
    what: >
      What it takes to give up a belief, and why removing one is harder than
      adding one. Walks expansion and contraction over the same belief set.
    ratio: 1.6

  - name: researcher-stream
    title: The Researcher's Stream
    from: mind/researcher-stream.html
    topic: Mind
    what: >
      How a line of inquiry actually moves — branching, parking, and coming
      back — rather than the tidy version that appears in a paper.
    ratio: 1.6

  - name: one-crate
    title: One Crate
    from: economics/mango-supply-chain/one-crate.html
    topic: Economics
    what: >
      A supply chain told through its data problems. Four stops —
      measurement, Simpson's paradox, variance, the bullwhip effect — each
      reproducible from a seeded synthetic dataset.
    ratio: 1.6

  - name: claim-graph
    title: Claim Knowledge Graph Explorer
    from: ai/responsible-ai/knowledge-graph/graph.html
    topic: AI
    what: >
      111 papers, 736 typed edges. Nodes are extracted claims rather than
      papers, so you can ask which claim supported or contradicted which.
    ratio: 1.5

  - name: model-microscope
    title: Model Microscope
    from: ai/model-microscope/site
    topic: AI
    what: >
      GPT-2 opened up three ways on eighteen prepared prompts: what it would
      say if it stopped at each layer, which words it looks back at, and —
      by causal tracing, the method behind ROME — where a fact is actually
      stored. Includes the cases where it fails: a negated fact, a sum, and
      a CEO who changed after its training.
    ratio: 1.5
    image: poster.jpg

  - name: the-pitt-decoded
    title: The Pitt, Decoded
    from: medicine/the-pitt-resus-bay.html
    topic: Medicine
    what: >
      Emergency-medicine vocabulary ordered on one ruler — how fast each
      failure kills — from the airway outward to the department. Six animated
      panels, an interactive bench for turning a prior and a likelihood ratio
      into a posterior, and sources that mark what was checked against a paper
      and what was not.
    ratio: 1.6

  - name: apob
    title: ApoB and the Cardiometabolic Cascade
    from: medicine/apob-cardiometabolic.html
    topic: Medicine
    what: >
      Why the particle count matters more than the cholesterol number, traced
      through the cascade it sits in.
    ratio: 1.6

  - name: spine-crack
    title: Spine Cracking — What Actually Happens
    from: medicine/spine-crack.html
    topic: Medicine
    what: >
      The mechanics behind the sound, and which of the common explanations
      survive contact with the evidence.
    ratio: 1.6

  - name: datascalar-race
    title: DataScalar Race
    from: hpc/datascalar-sim
    topic: HPC
    what: >
      A 1997 bet that arithmetic would become free and moving data would not.
      Races a traditional machine against DataScalar, where every chip runs
      the same program and the chip that owns the data broadcasts it, then
      shows the move cost at which that wasted compute starts saving energy.
    ratio: 1.6

  - name: difference-engine
    title: Difference Engine
    from: projects/difference-engine
    topic: Computing history
    what: >
      Babbage's No. 2 design in 3D. Two hundred parts assemble themselves from
      every direction, then a turn of the crank tabulates a polynomial by
      addition alone: half the columns add, the carries ripple up, and every
      printed row is checked against the polynomial itself. Run Euler's
      n² + n + 41 past n = 40 to see where its primes stop.
    ratio: 1.5
    image: poster.jpg

  - name: little-builder
    title: The Little Builder
    from: projects/brick-stage/out/little-builder
    topic: Brick Stage
    what: >
      A small robot assembles itself, builds a shelter rated for one, then
      builds a friend. Every model in the story is checked as really buildable
      with LEGO bricks, and each one can be downloaded as an LDraw file.
    ratio: 1.6
    image: poster.jpg

  - name: test-chamber
    title: Test Chamber
    from: projects/brick-stage/out/test-chamber
    topic: Brick Stage
    what: >
      An instruction video in the style of a puzzle-game tutorial: the chamber
      assembles itself panel by panel, a button, door and signal line are
      installed, and a pictogram subject solves the test with a cube built from
      real bricks.
    ratio: 1.6
    image: poster.jpg

  - name: rated-for-two
    title: Rated for Two
    from: projects/brick-stage/out/rated-for-two
    topic: Brick Stage
    what: >
      The robots from The Little Builder, at sunset. One builds a flower and
      offers it; a brick heart assembles as night falls. Speech bubbles, joints,
      particles and a generated chord pad — and every model still checked as
      really buildable.
    ratio: 1.6
    image: poster.jpg

  - name: microduck
    title: Microduck, in Bricks
    from: projects/brick-stage/out/microduck
    topic: Brick Stage
    what: >
      Pollen Robotics' open-source Microduck robot, sampled from its own CAD
      into 670 LEGO plates and built the way an instruction booklet builds it:
      in sections, every plate arriving along the path it really goes in, the
      head made on its own and set on the neck. Prompted by the Microduck LEGO
      booklet on Hugging Face.
    ratio: 1.6
    image: poster.jpg

  - name: spot-the-cow
    title: Spot the Cow
    from: projects/brick-stage/out/spot-the-cow
    topic: Brick Stage
    what: >
      Keenan Crane's Spot (CC0), a textured 3D model downloaded and turned into
      543 LEGO plates in one command — texture colours matched to real LEGO
      colours, every part checked as made by LEGO in that colour.
    ratio: 1.6
    image: poster.jpg

  - name: a-drawn-duck
    title: A Drawn Duck
    from: projects/brick-stage/out/a-drawn-duck
    topic: Brick Stage
    what: >
      A cartoon duck drawn by hand, made 3D by an open image-to-3D model on
      Hugging Face (InstantMesh), then turned into 364 checked LEGO plates —
      with the lighting baked into its colours grouped out so it stays yellow.
    ratio: 1.6
    image: poster.jpg

  - name: an-avocado
    title: An Avocado
    from: projects/brick-stage/out/an-avocado
    topic: Brick Stage
    what: >
      The Khronos glTF sample avocado (CC0), from download to a checked brick
      model, story, booklet and poster with one command.
    ratio: 1.6
    image: poster.jpg

  - name: datascalar-machine
    title: Tiny DataScalar Machine
    from: projects/brick-check/out/datascalar-machine
    topic: Brick Stage
    what: >
      The first brick-check model: four chips, their memory slices and a
      shared bus in 96 parts, with step-by-step instructions you can play.
      Every part's size checked against the LDraw library; collisions,
      connections, build order and balance checked on a computer.
    ratio: 1.6
    image: poster.jpg

  # Hosted elsewhere, so nothing is copied — `url:` embeds it from where it
  # already lives and the card notes the host.
  - name: the-shelf
    title: The Shelf
    url: https://rubix982.github.io/the-shelf/
    topic: Archive
    what: >
      A ledger of what I grew up with, kept for my kids: games, films,
      television, music, books, YouTube channels and the early internet —
      167 entries, from PTV dramas and Ufone ads to Need for Speed and
      Columbo. Boots like a console, browses like a shelf, and records why
      each thing mattered rather than holding the files. Every entry is
      marked preserved, at risk, or gone, and one with no surviving copy
      shows up as a gap on the shelf rather than a book on it.
    ratio: 1.5
