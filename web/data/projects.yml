# Projects. The prose comes from each project's own plan.md, so the site
# follows the work rather than being updated separately.
#
#   plan: path to plan.md, relative to the repository root. The loader reads
#         the "## Objective" paragraph, the "## Current Phase" line, and the
#         "_Last updated:_" date.
#   tone: which status dot to use — draft | provisional | standing.
#         Presentation only; nothing in plan.md encodes this.
#   what: optional override, if the objective paragraph reads badly out of
#         context. Prefer fixing the wording in plan.md instead.
#   kind: research | practice. Research projects get the /research page and
#         the home page's Research section; practice (opz) has /labs.
#   repo: optional link to the code, when it lives in its own repository.
#         Without it, the link points at the plan's folder in this one.
#   writeup: optional path, relative to web/, of the page that is the
#         project's overall write-up. /research lists these; the notebook
#         holds the experiments behind them.

projects:
  - name: edit-slice
    plan: ai/edit-slice/plan.md
    notebook: /notebook/edit-slice/
    tone: draft
    kind: research
    writeup: notebook/edit-slice/review.md

  - name: edit-reach
    plan: ai/edit-reach/plan.md
    notebook: /notebook/edit-reach/
    tone: draft
    kind: research
    writeup: notebook/edit-reach/paper.md

  - name: rome-neighbors
    plan: ai/rome-neighbors/plan.md
    notebook: /notebook/rome-neighbors/
    tone: provisional
    kind: research

  - name: claim-graph
    plan: ai/responsible-ai/knowledge-graph/plan.md
    notebook: /notebook/claim-graph/
    tone: standing
    kind: research

  - name: opz
    plan: projects/opz/plan.md
    notebook: /notebook/opz/
    tone: draft
    kind: practice
    repo: https://github.com/Rubix982/opz

  - name: scooping
    plan: projects/scooping/plan.md
    notebook: /notebook/scooping/
    tone: provisional
    kind: research
    repo: https://github.com/Rubix982/scooping
    writeup: notebook/scooping/index.md
