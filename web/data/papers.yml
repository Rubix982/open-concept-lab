  url: https://arxiv.org/abs/2507.08427
  status: read
  relevance: high
  field: Evaluating edits
  area: Ripple effects and multi-hop
  verified: true
  projects: [edit-slice]
  gives_me: "The nearest neighbour to our benchmark finding, and a different flaw: theirs is that RippleEdits' questions need external-KG knowledge the model may not hold. Read in full for R-018 — the body never mentions surface overlap or the edited subject appearing in the prompt, and none of their three repaired variants removes it. Their In-Prompt variant injects MORE context, so a benchmark fixed for their problem still fails a coefficient screen."

