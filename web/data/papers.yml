kim2025bilinear:
  title: Bilinear representation mitigates reversal curse and enables consistent model editing
  authors: Kim, D.-K., Kim, M., Kwon, J., Yang, N., Cha, M.
  year: 2025
  venue: ICLR 2026
  url: https://arxiv.org/abs/2509.21993
  status: to-read
  relevance: high
  field: Knowledge editing
  area: Editing methods
  verified: true
  projects: [rome-neighbors, edit-slice]
  gives_me: >
    The structured-geometry predictor rome-neighbors adopts. Also bears on
    edit-slice: "reversal curse" is argument order under another name, so this
    is the closest published work to that half of the distinction. Read before
    E-009.

jeong2025steam:
  title: "STEAM: A Semantic-Level Knowledge Editing Framework for Large Language Models"
  authors: Jeong, G., Sun, J., Lee, S., Kim, H.
  year: 2025
  venue: Findings of EMNLP 2025
  url: https://arxiv.org/abs/2510.10398
  status: to-read
  relevance: high
  field: Knowledge editing
  area: Editing methods
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Latent-space alignment for editing. Note the correction: this is an
    editing *method*, not an alignment-based *predictor* of propagation, so
    the "alignment arm" of the predictor comparison may not have a paper
    behind it yet. Check before building E-009 around it.

nishi2024shattering:
  title: "Representation Shattering in Transformers: A Synthetic Study with Knowledge Editing"
  authors: Nishi, K., Ramesh, R., Okawa, M., Khona, M., Tanaka, H., Lubana, E. S.
  year: 2024
  venue: ICML 2025
  url: https://arxiv.org/abs/2410.17194
  status: to-read
  relevance: medium
  field: Knowledge editing
  area: Limits of editing
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Distance to representation shattering, which is adjacent to but not the
    same as distance to propagation. Synthetic setting, so transfer to a real
    decoder-only LM is an open question rather than an assumption.

huang2026ripple:
  title: Revisiting Ripple Effects in Knowledge Editing through Pressure-Aware Joint Neighborhood Optimization
  authors: Huang, H., Liu, S., Wu, O., Gao, D.
  year: 2026
  venue: arXiv preprint
  url: https://arxiv.org/abs/2606.01610
  status: to-read
  relevance: medium
  field: Evaluating edits
  area: Ripple effects and multi-hop
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    The closest multi-probe comparison. Key-space coupling is one of three
    structural probes in it (§3.2), alongside pre-trained entanglement and
    local neighborhood sensitivity — so it is a predictor set, not a single
    predictor. Needed for positioning.

slaq2025alignment:
  title: The Curious Case of Factual (Mis)Alignment between LLMs' Short- and Long-Form Answers
  authors: Obaid ul Islam, S., Lauscher, A., Glavaš, G.
  year: 2025
  venue: arXiv preprint
  url: https://arxiv.org/abs/2510.11218
  status: to-read
  relevance: high
  field: Evaluating edits
  area: Consistency and measurement
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    The nearest existing method — mechanistic similarity predicting alignment
    at up to 78%. But the construct is short-form versus long-form answer
    agreement, not factual consistency in general, which makes it easier to
    differentiate from than the one-line note suggested. Still blocking, since
    it has to be cited either way.

huang2024ravel:
  title: "RAVEL: Evaluating Interpretability Methods on Disentangling Language Model Representations"
  authors: Huang, J., Wu, Z., Potts, C., Geva, M., Geiger, A.
  year: 2024
  venue: ACL
  url: https://aclanthology.org/2024.acl-long.470/
  status: to-read
  relevance: medium
  field: Model internals
  area: Representations and tools
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Attribute disentanglement, possibly a cleaner hop-separated dataset than
    RippleEdits. Worth checking before committing to data.

holtzman2021surface:
  title: "Surface Form Competition: Why the Highest Probability Answer Isn't Always Right"
  authors: Holtzman, A., West, P., Shwartz, V., Choi, Y., Zettlemoyer, L.
  year: 2021
  venue: EMNLP
  url: https://arxiv.org/abs/2104.08315
  status: read
  relevance: high
  field: Evaluating edits
  area: Consistency and measurement
  verified: true
  projects: [edit-slice]
  gives_me: >
    Different surface forms of one concept compete for finite probability mass, so
    ranking answers by string probability is systematically distorted; Domain
    Conditional PMI is the correction. This is E-011's phenomenon, and our
    placeholder-lift control is essentially their PMI against a neutral prompt. Cited
    to disclaim novelty, not to support it.

elazar2021pararel:
  title: Measuring and Improving Consistency in Pretrained Language Models
  authors: Elazar, Y., Kassner, N., Ravfogel, S., Ravichander, A., Hovy, E., Schütze, H., Goldberg, Y.
  year: 2021
  venue: TACL
  url: https://arxiv.org/abs/2102.01017
  status: read
  relevance: high
  field: Evaluating edits
  area: Consistency and measurement
  verified: true
  projects: [edit-slice]
  gives_me: >
    328 hand-curated paraphrase patterns over 38 relations, including "X born-in Y".
    CounterFact derives from ParaRel entries and keeps one prompt per record, so the
    template set exists upstream and was collapsed. Closes R-008.

knowledgespectrum2025:
  title: Diagnosing Model Editing via Knowledge Spectrum
  authors: Pan, T.-H., Chen, C.-C., Huang, H.-H., Chen, H.-H.
  year: 2025
  venue: arXiv preprint
  url: https://arxiv.org/abs/2509.17482
  status: read
  relevance: high
  field: Evaluating edits
  area: Consistency and measurement
  verified: true
  projects: [edit-slice]
  gives_me: >
    Crosses pre-edit knowledge status (Known/Unknown by generation probing), entity
    popularity and question type against edit success, on Llama-3.1-8B — our exact
    model. Finds Unknown facts edit more successfully than Known. This is the
    possession-x-editability experiment, already run; it closed that direction for us
    at the WHY gate. Does not examine grounds, premises, or entailment consequences.

# --- added 2026-10-03 by [R-011]; every field below checked against the paper's own
# --- record (arXiv abstract page or ACL Anthology), not against a search snippet.

ravfogel2026geometric:
  title: Geometric Factual Recall in Transformers
  authors: Ravfogel, S., Yehudai, G., Bruna, J., Bietti, A.
  year: 2026
  venue: arXiv 2605.12426
  url: https://arxiv.org/abs/2605.12426
  status: skimmed
  relevance: high
  field: Model internals
  area: Where facts are stored
  verified: true
  projects: [edit-slice]
  gives_me: "A theoretical account our measurements contradict, which is more useful than the candidate explanation we first took it for. Its own limitations put TYPED ATTRIBUTES outside the setting, and its per-relation block structure predicts perturbation local to the edited relation — the opposite of E-033. See [R-012]."

he2026romelimits:
  title: On the Limitations of Rank-One Model Editing in Answering Multi-hop Questions
  authors: He, Z., Chen, B., Xiong, T., Sun, Z., Zhu, M., Chen, X.
  year: 2026
  venue: arXiv 2601.04600
  url: https://arxiv.org/abs/2601.04600
  status: skimmed
  relevance: high
  field: Knowledge editing
  area: Limits of editing
  verified: true
  projects: [edit-slice]
  gives_me: "Has E-028's depth phenomenon AND E-019/E-020's cosine decay (0.80 at layer 5 to 0.50 at 25), both published first. What it lacks is a working control: it reads the effect as depth on the warrant that edit success is stable, which E-028a shows cannot measure edit strength. See [R-012]."

youssef2026tracing:
  title: Tracing and Reversing Edits in LLMs
  authors: Youssef, P., Zhao, Z., Seifert, C., Schlotterer, J.
  year: 2026
  venue: ICLR
  url: https://arxiv.org/abs/2505.20819
  status: to-read
  relevance: medium
  field: Knowledge editing
  area: Limits of editing
  verified: true
  projects: [edit-slice]
  gives_me: Infers the edited object from the modified weights alone, with no access to the edit prompt. The inverse of our question — we ask what an edit reaches, they ask what it reveals — and it suggests the update carries more recoverable structure than we have used.

zhang2026actionable:
  title: "Locate, Steer, and Improve: A Practical Survey of Actionable Mechanistic Interpretability in Large Language Models"
  authors: Zhang, H., Zhang, Z., Nie, E., Wang, M., Su, Z., Wang, Y., et al.
  year: 2026
  venue: Findings of ACL
  url: https://aclanthology.org/2026.findings-acl.502/
  status: to-read
  relevance: medium
  field: Model internals
  area: Representations and tools
  verified: true
  projects: [edit-slice, rome-neighbors]
  gives_me: Current map of the field, organised as locate / steer / improve. Use it to check which of our open threads someone has already named, rather than as a source to cite.

