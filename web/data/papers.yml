# Reading list. One entry per paper; the key is the citation id you use in
# writing: <Cite id="meng2022rome" />.
#
#   status:    read | skimmed | to-read
#   relevance: high | medium | low        (to my current work, not in general)
#   verified:  true when the title, authors, year and venue have been checked
#              against the paper's own record (arXiv or the ACL Anthology).
#              false means the entry came from a secondhand note and must not
#              be cited yet. Independent of `status` — a citation can be
#              trustworthy for a paper I have not read.
#   projects:  which of my projects it bears on
#   gives_me:  the one thing I go back to it for

meng2022rome:
  title: Locating and Editing Factual Associations in GPT
  authors: Meng, K., Bau, D., Andonian, A., Belinkov, Y.
  year: 2022
  venue: NeurIPS
  url: https://arxiv.org/abs/2202.05262
  status: read
  relevance: high
  verified: true
  projects: [rome-neighbors, edit-slice]
  gives_me: Causal tracing, and the rank-one edit that both my projects use as the edit primitive.

meng2023memit:
  title: Mass-Editing Memory in a Transformer
  authors: Meng, K., Sharma, A. S., Andonian, A., Belinkov, Y., Bau, D.
  year: 2023
  venue: ICLR
  url: https://arxiv.org/abs/2210.07229
  status: read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: Editing many facts at once — the breadth axis, if orphaning turns out to scale with edit count.

cohen2024ripple:
  title: Evaluating the Ripple Effects of Knowledge Editing in Language Models
  authors: Cohen, R., Biran, E., Yoran, O., Globerson, A., Geva, M.
  year: 2024
  venue: TACL
  url: https://arxiv.org/abs/2307.12976
  status: read
  relevance: high
  verified: true
  projects: [edit-slice, rome-neighbors]
  gives_me: Six evaluation criteria, and the definition of Logical Generalization that narrowed my claim to justification order.

zhong2023mquake:
  title: "MQuAKE: Assessing Knowledge Editing in Language Models via Multi-Hop Questions"
  authors: Zhong, Z., Wu, Z., Manning, C. D., Potts, C., Chen, D.
  year: 2023
  venue: EMNLP
  url: https://arxiv.org/abs/2305.14795
  status: read
  relevance: high
  verified: true
  projects: [rome-neighbors]
  gives_me: Multi-hop questions after an edit — the closest existing thing to hop resolution.

geva2021ffn:
  title: Transformer Feed-Forward Layers Are Key-Value Memories
  authors: Geva, M., Schuster, R., Berant, J., Levy, O.
  year: 2021
  venue: EMNLP
  url: https://arxiv.org/abs/2012.14913
  status: read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: Why editing an MLP can change a fact at all.

geva2022promoting:
  title: Transformer Feed-Forward Layers Build Predictions by Promoting Concepts in the Vocabulary Space
  authors: Geva, M., Caciularu, A., Wang, K. R., Goldberg, Y.
  year: 2022
  venue: EMNLP
  url: https://arxiv.org/abs/2203.14680
  status: read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: The vocabulary-space reading of what an FFN update does.

dai2022knowledgeneurons:
  title: Knowledge Neurons in Pretrained Transformers
  authors: Dai, D., Dong, L., Hao, Y., Sui, Z., Chang, B., Wei, F.
  year: 2022
  venue: ACL
  url: https://arxiv.org/abs/2104.08696
  status: read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: The earlier localisation story that ROME's causal tracing supersedes.

hase2023localization:
  title: Does Localization Inform Editing? Surprising Differences in Causality-Based Localization vs. Knowledge Editing
  authors: Hase, P., Bansal, M., Kim, B., Ghandeharioun, A.
  year: 2023
  venue: NeurIPS
  url: https://arxiv.org/abs/2301.04213
  status: read
  relevance: high
  verified: true
  projects: [rome-neighbors]
  gives_me: Localisation does not imply editability. The first thing a hostile reviewer will raise, so it is pre-empted in the design.

mitchell2022mend:
  title: Fast Model Editing at Scale
  authors: Mitchell, E., Lin, C., Bosselut, A., Finn, C., Manning, C. D.
  year: 2022
  venue: ICLR
  url: https://arxiv.org/abs/2110.11309
  status: read
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: The hypernetwork-editor contrast to weight-level editing.

mitchell2022serac:
  title: Memory-Based Model Editing at Scale
  authors: Mitchell, E., Lin, C., Bosselut, A., Manning, C. D., Finn, C.
  year: 2022
  venue: ICML
  url: https://arxiv.org/abs/2206.06520
  status: skimmed
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: Side-memory editing — no weights touched, so no orphaning by construction.

hartvigsen2023grace:
  title: "Aging with GRACE: Lifelong Model Editing with Discrete Key-Value Adaptors"
  authors: Hartvigsen, T., Sankaranarayanan, S., Palangi, H., Kim, Y., Ghassemi, M.
  year: 2023
  venue: NeurIPS
  url: https://arxiv.org/abs/2211.11031
  status: read
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: Retrieval-based editing over a stream of edits.

zhu2020modifying:
  title: Modifying Memories in Transformer Models
  authors: Zhu, C., Rawat, A. S., Zaheer, M., Bhojanapalli, S., Li, D., Yu, F., Kumar, S.
  year: 2020
  venue: arXiv preprint
  url: https://arxiv.org/abs/2012.00363
  status: skimmed
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: The earliest statement of "edit one fact and leave the rest alone" as a task.

yao2023survey:
  title: "Editing Large Language Models: Problems, Methods, and Opportunities"
  authors: Yao, Y., Wang, P., Tian, B., Cheng, S., Li, Z., Deng, S., Chen, H., Zhang, N.
  year: 2023
  venue: EMNLP
  url: https://arxiv.org/abs/2305.13172
  status: read
  relevance: medium
  verified: true
  projects: [edit-slice, rome-neighbors]
  gives_me: The field map, and the place to check whether a gap is really a gap.

todd2024functionvectors:
  title: Function Vectors in Large Language Models
  authors: Todd, E., Li, M. L., Sharma, A. S., Mueller, A., Wallace, B. C., Bau, D.
  year: 2024
  venue: ICLR
  url: https://arxiv.org/abs/2310.15213
  status: read
  relevance: high
  verified: true
  projects: [rome-neighbors]
  gives_me: Relations as vectors — a structured basis that NNsight can reach directly.

marks2024geometryoftruth:
  title: "The Geometry of Truth: Emergent Linear Structure in Large Language Model Representations of True/False Datasets"
  authors: Marks, S., Tegmark, M.
  year: 2024
  venue: COLM
  url: https://arxiv.org/abs/2310.06824
  status: read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: A worked example of reading structure off representation geometry.

fiottokaufman2025nnsight:
  title: "NNsight and NDIF: Democratizing Access to Open-Weight Foundation Model Internals"
  authors: Fiotto-Kaufman, J., Loftus, A. R., Todd, E., et al.
  year: 2025
  venue: ICLR
  url: https://arxiv.org/abs/2407.14561
  status: read
  relevance: high
  verified: true
  projects: [rome-neighbors, edit-slice]
  gives_me: The tool everything runs on — deferred execution over model internals.

# ---------------------------------------------------------------------------
# Resolved 2026-09-10 against the arXiv API. Titles, authors, dates and venue
# fields were read off each paper's own record, so the citations are safe to
# use — but `status` still says to-read, because a checked citation is not the
# same as having read the thing.
# ---------------------------------------------------------------------------

kim2025bilinear:
  title: Bilinear representation mitigates reversal curse and enables consistent model editing
  authors: Kim, D.-K., Kim, M., Kwon, J., Yang, N., Cha, M.
  year: 2025
  venue: ICLR 2026
  url: https://arxiv.org/abs/2509.21993
  status: to-read
  relevance: high
  verified: true
  projects: [rome-neighbors, edit-slice]
  gives_me: >
    The structured-geometry predictor rome-neighbors adopts. Also bears on
    edit-slice: "reversal curse" is argument order under another name, so this
    is the closest published work to that half of the distinction. Read before
    E-009.

jeong2025steam:
  title: "STEAM: A Semantic-Level Knowledge Editing Framework for Large Language Models"
  authors: Jeong, G., Sun, J., Lee, S., Kim, H.
  year: 2025
  venue: Findings of EMNLP 2025
  url: https://arxiv.org/abs/2510.10398
  status: to-read
  relevance: high
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Latent-space alignment for editing. Note the correction: this is an
    editing *method*, not an alignment-based *predictor* of propagation, so
    the "alignment arm" of the predictor comparison may not have a paper
    behind it yet. Check before building E-009 around it.

nishi2024shattering:
  title: "Representation Shattering in Transformers: A Synthetic Study with Knowledge Editing"
  authors: Nishi, K., Ramesh, R., Okawa, M., Khona, M., Tanaka, H., Lubana, E. S.
  year: 2024
  venue: ICML 2025
  url: https://arxiv.org/abs/2410.17194
  status: to-read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Distance to representation shattering, which is adjacent to but not the
    same as distance to propagation. Synthetic setting, so transfer to a real
    decoder-only LM is an open question rather than an assumption.

huang2026ripple:
  title: Revisiting Ripple Effects in Knowledge Editing through Pressure-Aware Joint Neighborhood Optimization
  authors: Huang, H., Liu, S., Wu, O., Gao, D.
  year: 2026
  venue: arXiv preprint
  url: https://arxiv.org/abs/2606.01610
  status: to-read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    The closest multi-probe comparison. Key-space coupling is one of three
    structural probes in it (§3.2), alongside pre-trained entanglement and
    local neighborhood sensitivity — so it is a predictor set, not a single
    predictor. Needed for positioning.

slaq2025alignment:
  title: The Curious Case of Factual (Mis)Alignment between LLMs' Short- and Long-Form Answers
  authors: Obaid ul Islam, S., Lauscher, A., Glavaš, G.
  year: 2025
  venue: arXiv preprint
  url: https://arxiv.org/abs/2510.11218
  status: to-read
  relevance: high
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    The nearest existing method — mechanistic similarity predicting alignment
    at up to 78%. But the construct is short-form versus long-form answer
    agreement, not factual consistency in general, which makes it easier to
    differentiate from than the one-line note suggested. Still blocking, since
    it has to be cited either way.

huang2024ravel:
  title: "RAVEL: Evaluating Interpretability Methods on Disentangling Language Model Representations"
  authors: Huang, J., Wu, Z., Potts, C., Geva, M., Geiger, A.
  year: 2024
  venue: ACL
  url: https://aclanthology.org/2024.acl-long.470/
  status: to-read
  relevance: medium
  verified: true
  projects: [rome-neighbors]
  gives_me: >
    Attribute disentanglement, possibly a cleaner hop-separated dataset than
    RippleEdits. Worth checking before committing to data.

holtzman2021surface:
  title: "Surface Form Competition: Why the Highest Probability Answer Isn't Always Right"
  authors: Holtzman, A., West, P., Shwartz, V., Choi, Y., Zettlemoyer, L.
  year: 2021
  venue: EMNLP
  url: https://arxiv.org/abs/2104.08315
  status: read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: >
    Different surface forms of one concept compete for finite probability mass, so
    ranking answers by string probability is systematically distorted; Domain
    Conditional PMI is the correction. This is E-011's phenomenon, and our
    placeholder-lift control is essentially their PMI against a neutral prompt. Cited
    to disclaim novelty, not to support it.

elazar2021pararel:
  title: Measuring and Improving Consistency in Pretrained Language Models
  authors: Elazar, Y., Kassner, N., Ravfogel, S., Ravichander, A., Hovy, E., Schütze, H., Goldberg, Y.
  year: 2021
  venue: TACL
  url: https://arxiv.org/abs/2102.01017
  status: read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: >
    328 hand-curated paraphrase patterns over 38 relations, including "X born-in Y".
    CounterFact derives from ParaRel entries and keeps one prompt per record, so the
    template set exists upstream and was collapsed. Closes R-008.

knowledgespectrum2025:
  title: Diagnosing Model Editing via Knowledge Spectrum
  authors: (preprint, authors not recorded here)
  year: 2025
  venue: arXiv preprint
  url: https://arxiv.org/abs/2509.17482
  status: read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: >
    Crosses pre-edit knowledge status (Known/Unknown by generation probing), entity
    popularity and question type against edit success, on Llama-3.1-8B — our exact
    model. Finds Unknown facts edit more successfully than Known. This is the
    possession-x-editability experiment, already run; it closed that direction for us
    at the WHY gate. Does not examine grounds, premises, or entailment consequences.

# --- added 2026-10-03 by [R-011]; every field below checked against the paper's own
# --- record (arXiv abstract page or ACL Anthology), not against a search snippet.

ravfogel2026geometric:
  title: Geometric Factual Recall in Transformers
  authors: Ravfogel, S., Yehudai, G., Bruna, J., Bietti, A.
  year: 2026
  venue: arXiv 2605.12426
  url: https://arxiv.org/abs/2605.12426
  status: skimmed
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: "A theoretical account our measurements contradict, which is more useful than the candidate explanation we first took it for. Its own limitations put TYPED ATTRIBUTES outside the setting, and its per-relation block structure predicts perturbation local to the edited relation — the opposite of E-033. See [R-012]."

he2026romelimits:
  title: On the Limitations of Rank-One Model Editing in Answering Multi-hop Questions
  authors: He, Z., Chen, B., Xiong, T., Sun, Z., Zhu, M., Chen, X.
  year: 2026
  venue: arXiv 2601.04600
  url: https://arxiv.org/abs/2601.04600
  status: skimmed
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: "Has E-028's depth phenomenon AND E-019/E-020's cosine decay (0.80 at layer 5 to 0.50 at 25), both published first. What it lacks is a working control: it reads the effect as depth on the warrant that edit success is stable, which E-028a shows cannot measure edit strength. See [R-012]."

youssef2026tracing:
  title: Tracing and Reversing Edits in LLMs
  authors: Youssef, P., Zhao, Z., Seifert, C., Schlotterer, J.
  year: 2026
  venue: ICLR
  url: https://arxiv.org/abs/2505.20819
  status: to-read
  relevance: medium
  verified: true
  projects: [edit-slice]
  gives_me: Infers the edited object from the modified weights alone, with no access to the edit prompt. The inverse of our question — we ask what an edit reaches, they ask what it reveals — and it suggests the update carries more recoverable structure than we have used.

zhang2026actionable:
  title: "Locate, Steer, and Improve: A Practical Survey of Actionable Mechanistic Interpretability in Large Language Models"
  authors: Zhang, H., Zhang, Z., Nie, E., Wang, M., Su, Z., Wang, Y., et al.
  year: 2026
  venue: Findings of ACL
  url: https://aclanthology.org/2026.findings-acl.502/
  status: to-read
  relevance: medium
  verified: true
  projects: [edit-slice, rome-neighbors]
  gives_me: Current map of the field, organised as locate / steer / improve. Use it to check which of our open threads someone has already named, rather than as a source to cite.

# --- added 2026-10-03 by [R-011]. These seven were cited in the project's CLAUDE.md
# --- from day one under an explicit "unverified, verify before use" warning, and had
# --- never been checked. All seven resolve. Two descriptions needed correcting.

luo2026knowledgesmith:
  title: "KnowledgeSmith: Uncovering Knowledge Updating in LLMs with Model Editing and Unlearning"
  authors: Luo, Y., Zhou, Z., Chen, H., Qiu, K., Savvides, M., Li, S., Wang, J.
  year: 2026
  venue: ICLR
  url: https://arxiv.org/abs/2510.02392
  status: to-read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: Casts editing and unlearning as one constrained optimisation and reports a consistency-capacity trade-off across graph levels and data scales. The reason not to re-derive propagation-versus-structure from scratch.

rinberg2025ripplebench:
  title: "RippleBench: Capturing Ripple Effects Using Existing Knowledge Repositories"
  authors: Rinberg, R., Bhalla, U., Shilov, I., Calmon, F. P., Gandikota, R.
  year: 2025
  venue: arXiv 2512.04144
  url: https://arxiv.org/abs/2512.04144
  status: to-read
  relevance: high
  verified: true
  projects: [edit-slice]
  gives_me: "Distance-stratified propagation curves for eight UNLEARNING methods, with distance from WikiRAG semantic neighbours. Its cross-model result is the close parallel to ours: delta curves nearly identical across four models, read as ripple being a property of the method rather than the base model. NOTE: distance is semantic retrieval, not a pluggable graph metric — see [R-011]."

chaudhury2026forgetting:
  title: "Forgetting is Not Erasure: Recovering Latent Knowledge via Transport Keys"
  authors: Chaudhury, A.
  year: 2026
  venue: arXiv 2606.02860
  url: https://arxiv.org/abs/2606.02860
  status: to-read
  relevance: medium
  verified: true
  projects: [edit-slice]
  gives_me: "Apparent forgetting as interface drift rather than erasure, recovered by stitching with transport keys. If it carried to LMs, our damage would be accessibility loss rather than destruction. NOTE: the evidence is split CIFAR-100 and a compact ViT — vision, not language — see [R-011]."

kwon2026engram:
  title: "AI Engram: In Search of Memory Traces in Artificial Intelligence"
  authors: Kwon, J., Kim, D.-K., Kim, J., Kim, Y., Kook, W., Cha, M.
  year: 2026
  venue: ICML (oral)
  url: https://arxiv.org/abs/2606.14997
  status: to-read
  relevance: medium
  verified: true
  projects: [edit-slice]
  gives_me: A closed-form estimator isolating memory traces, composable and erasable by linear arithmetic. The strongest current claim that edits are linear objects — which our type-matched displacement result bears on directly.

schessl2026pathdependence:
  title: "Forgetting Is Not a Fix: Path Dependence in Sequential Engram Editing"
  authors: Schessl, F. M.
  year: 2026
  venue: arXiv 2607.24805
  url: https://arxiv.org/abs/2607.24805
  status: to-read
  relevance: medium
  verified: true
  projects: [edit-slice]
  gives_me: Falsifies the commutative-manifold hypothesis of kwon2026engram for sequential editing — cut order matters, and erased knowledge partially returns under later unrelated cuts. A worked example of attacking a single-edit result with the sequential case, which is the shape of attack our own work invites.

kruthof2026editpropbench:
  title: "EditPropBench: Measuring Factual Edit Propagation in Scientific Manuscripts"
  authors: Kruthof, G.
  year: 2026
  venue: arXiv 2605.02083
  url: https://arxiv.org/abs/2605.02083
  status: to-read
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: Dependency-labelled cascades with sentence-level labels for required updates versus text that should not move — the structure we want, applied to manuscripts and LLM editors rather than weights.

bairi2023codeplan:
  title: "CodePlan: Repository-level Coding using LLMs and Planning"
  authors: Bairi, R., Sonwane, A., Kanade, A., Vageesh D C, Iyer, A., Parthasarathy, S., Rajamani, S., Ashok, B., Shet, S.
  year: 2023
  venue: arXiv 2309.12499 (cs.SE)
  url: https://arxiv.org/abs/2309.12499
  status: skimmed
  relevance: low
  verified: true
  projects: [edit-slice]
  gives_me: "Incremental dependency analysis driving repository-level change, with the compiler as oracle. The reason claim 2 is 'exists in software engineering, unused in editing' rather than open. NOTE: CLAUDE.md cites a Proc. ACM Softw. Eng. 1 (FSE) 2024 venue that the arXiv record does not confirm."
