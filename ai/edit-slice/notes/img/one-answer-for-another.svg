<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="The model's top eight completions of 'By profession, Maurice de Vlaminck is a', before and after one edit to his birth country. Before: painter 70.9 percent, then French 4.5 percent and six others under 1.1 percent. After: poet 48.3 percent, then writer 6.1 percent, Chile 5.4 percent, sailor 4.8 percent and four more. Painter is no longer in the top eight; it has fallen to nineteenth place at 0.4 percent.">
