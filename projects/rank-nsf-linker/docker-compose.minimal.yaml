# Minimal deployment (see README, "Minimal deployment"): Postgres and Qdrant restored from a golden
# dataset, the Go server (SERVE_ONLY: serves, never fetches or rebuilds), a small query embedder
# (embedder-lite: the same model on ONNX, ~220 MB, identical vectors), and the web app. No fetcher,
# full embedder, Elasticsearch or logging service. Search by meaning works: the stored vectors were
# computed on a development machine; here only visitors' queries are embedded.
# Fits a 4 GB VM; 8 GB is comfortable.
# Exposure (DEPLOY.md): nothing is published to the internet. The Cloudflare tunnel (profile
# "tunnel") connects out to Cloudflare and reaches the web app over this compose network; the web
# app and Qdrant listen on 127.0.0.1 only, for checks on the machine itself.
#   docker compose -f docker-compose.minimal.yaml --env-file .env.deploy --profile tunnel up -d
name: advisor-atlas

services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: rank-nsf-linker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # not published outside this network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  go-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedder:
        condition: service_started
    volumes:
      - ./backup:/app/backup:ro # scholarships, curated lists
      - ./data/scholarships:/app/data/scholarships:ro # DAAD feed (optional)
    environment:
      SERVE_ONLY: 1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_NAME: rank-nsf-linker
      DB_HOST: postgres
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rank-nsf-linker
      EMBEDDER_SERVICE_URL: http://embedder:8000
      QDRANT_REST_URL: http://qdrant:6333
    command: ["./server/go-server"]

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # this machine only: for restoring the golden snapshots
    deploy:
      resources:
        limits:
          memory: 2G

  embedder:
    build:
      context: ./embedder-lite
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile # VITE_MAPBOX_TOKEN from web/.env is built in
    restart: unless-stopped
    depends_on:
      - go-server
    volumes:
      - ./web/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro # /api -> go-server
    ports:
      - "127.0.0.1:8088:80" # this machine only (checks); visitors come through the tunnel

  # Cloudflare Tunnel: an outbound connection to Cloudflare, which serves the site (HTTPS, DDoS
  # protection, caching) without any open port here. In Cloudflare: Zero Trust > Networks > Tunnels,
  # public hostname -> http://web:80. The token goes in .env.deploy (TUNNEL_TOKEN).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # from .env.deploy; cloudflared refuses to start without one
    depends_on:
      - web

volumes:
  pg_data:
  qdrant_data:
