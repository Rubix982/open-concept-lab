# Abuse limits, per visitor. Behind the Cloudflare tunnel every request arrives from the cloudflared
# container, so the visitor's address is taken from CF-Connecting-IP, trusted only from Docker's
# private networks (the internet can't reach nginx directly; see DEPLOY.md).
# Every API call: 20 a second, bursts of 60. Searches (each embeds a query and reads many rows):
# 3 a second, bursts of 15. Over the limit: 429.
# ($request_uri, the path as sent: by the time limits apply, /api/ has been rewritten away from $uri)
map $request_uri $search_limit_key {
    ~^/api/explorer/(landscape|faculty|grants) $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $search_limit_key zone=search:10m rate=3r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self' data: blob:;
        script-src 'self' 'unsafe-eval' 'unsafe-inline';
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://api.mapbox.com https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https: http: 
            https://*.basemaps.cartocdn.com 
            https://tile.openstreetmap.org 
            https://*.openstreetmap.org
            https://api.mapbox.com;
        connect-src 'self' https: http: ws: wss:
            https://*.basemaps.cartocdn.com 
            https://tile.openstreetmap.org 
            https://*.openstreetmap.org
            https://api.mapbox.com;
    " always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the service-worker kill switch must never be cached, or an old
    # version keeps loading.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/(sw|dev-sw)\.js$ {
        add_header Cache-Control "no-cache" always;
    }

    # Proxy /api to go-server. Resolved per request (Docker's DNS, cached 10 s): a fixed address went
    # stale whenever go-server was recreated, and every request answered 502 until nginx restarted.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req zone=search burst=15 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://go-server:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /ls to logging-service. Resolved per request (Docker's DNS), so nginx still starts when
    # there is no logging service (the minimal deployment); /ls/ then answers 502.
    location /ls/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $logging http://logging-service:5257;
        rewrite ^/ls/(.*)$ /$1 break;
        proxy_pass $logging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
