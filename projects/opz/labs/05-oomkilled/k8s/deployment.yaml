apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report
  template:
    metadata:
      labels:
        app: report
    spec:
      containers:
        - name: report
          image: opz-lab05-report:1.0
          imagePullPolicy: Never   # loaded into kind, not pulled
          env:
            - name: CACHE_ENTRIES
              value: "25"
          ports:
            - containerPort: 8080
          # Copied from another service's manifest.
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: report
spec:
  selector:
    app: report
  ports:
    - port: 8080
      targetPort: 8080
