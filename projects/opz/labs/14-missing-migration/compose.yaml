name: opz-lab14

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: FAKE_lab14_db_password   # FAKE, lab only
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 1s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: opz-lab14-app:${APP_VERSION:-v1}
    ports:
      - "${APP_PORT:-8014}:8080"
    environment:
      DATABASE_URL: postgresql://shop:FAKE_lab14_db_password@db:5432/shop
    stop_signal: SIGINT        # Python turns SIGINT into a clean exit, even as PID 1
    stop_grace_period: 3s
    depends_on:
      db:
        condition: service_healthy

  # Not started by `up`. Run it with: docker compose run --rm migrate [up-to-version]
  migrate:
    image: postgres:16-alpine
    profiles: ["tools"]
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: shop
      PGPASSWORD: FAKE_lab14_db_password
      PGDATABASE: shop
    volumes:
      - ./migrations:/migrations:ro
      - ./tools/migrate.sh:/migrate.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
