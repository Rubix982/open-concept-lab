events {
    worker_connections 1024;
}

http {
    # Who is calling: their API key (customers send X-API-Key).
    log_format main '$remote_addr key=$http_x_api_key "$request" $status ${request_time}s';
    access_log /var/log/nginx/access.log main;

    upstream api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
