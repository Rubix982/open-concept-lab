name: opz-lab09

services:
  app:
    build: app
    container_name: opz-lab09-app
    ports:
      - "8009:8009"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: opz-lab09-redis
    # Published so we can poke at it with redis-cli while developing.
    ports:
      - "6309:6379"
    # Docker's redis image already turns protected-mode off, so with no password
    # it answers anyone who can reach the port.
    command: ["redis-server", "--appendonly", "no"]
