apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: opz-lab18-notes:1.0
          imagePullPolicy: Never   # loaded into kind, not pulled
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data     # "the database lives on the volume"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notes
spec:
  selector:
    app: notes
  ports:
    - port: 8080
      targetPort: 8080
