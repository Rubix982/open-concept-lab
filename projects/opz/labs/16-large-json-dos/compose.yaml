name: ${LAB16_PROJECT:-opz-lab16}

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${LAB16_PORT:-8016}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: app
    image: opz-lab16-app
    # A hard ceiling so this lab can never eat your Mac's memory.
    mem_limit: 256m
    memswap_limit: 256m
    restart: always
