<style>

  body.chamber .cap { top: auto; bottom: 13vh; left: 5vw; display: flex; flex-direction: column-reverse; }
  body.chamber .cap .t { font-weight: 800; font-style: italic; color: #fff; letter-spacing: -.01em;
    text-shadow: 0 1px 1px rgba(0,0,0,.35), 0 2px 18px rgba(0,0,0,.38); -webkit-text-stroke: 1.2px rgba(70,70,70,.45); }
  body.chamber .cap .k { color: rgba(255,255,255,.95); font-weight: 600; font-size: clamp(14px, 2vw, 26px); letter-spacing: .32em;
    margin: 4px 0 0 4vw; text-shadow: 0 1px 1px rgba(0,0,0,.4), 0 2px 12px rgba(0,0,0,.4); }
  body.chamber .cap .k::before { display: none; }

  /* callouts: a label on a leader line, pinned to something on stage */
  #leaders { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  .callout { position: fixed; pointer-events: none; background: rgba(255,255,255,.94); color: #1d1d1b; border-left: 3px solid var(--accent);
    padding: 6px 12px; font-size: clamp(13px, 1.4vw, 18px); border-radius: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.12); white-space: nowrap; }

  .ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(820px, calc(100vw - 32px));
    display: flex; gap: 10px; align-items: center; background: var(--bar); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(8px); transition: opacity .25s; }
  body.clean .ui, body.clean .badge { opacity: 0; pointer-events: none; }
  .ui button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  .ui button:focus-visible, .ui input:focus-visible, .badge a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .track { position: relative; flex: 1; display: flex; align-items: center; }
  .track input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .ticks { position: absolute; left: 7px; right: 7px; top: -9px; height: 8px; pointer-events: none; }
  .ticks i { position: absolute; top: 0; width: 2px; height: 8px; background: var(--muted); opacity: .55; border-radius: 1px; }
  .ui .time { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); min-width: 92px; text-align: right; }
  .chapter { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 12px; color: var(--muted);
    background: var(--bar); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; transition: opacity .25s; white-space: nowrap; }
  body.clean .chapter { opacity: 0 !important; }
  body.render .hint, body.render .chapter, body.render .badge, body.render .ui, body.render .steps { display: none !important; }
  .badge { position: fixed; right: 16px; top: 14px; max-width: min(420px, calc(100vw - 32px)); font-size: 12px; color: #6f6e68;
    background: rgba(255,255,255,.82); border: 1px solid #dcdad3; border-radius: 14px; padding: 4px 10px; transition: opacity .25s; }
  .badge b { color: #2f7d4f; } .badge b.bad, .badge .bad { color: var(--bad); } .badge b.warn { color: #a86a00; }
  .badge details { display: inline; } .badge summary { cursor: pointer; list-style: none; display: inline; }
  .badge .list { margin-top: 6px; line-height: 1.6; }
  .badge a { color: var(--accent); }
  .badge .honest { margin-top: 8px; padding-top: 8px; border-top: 1px solid #dcdad3; line-height: 1.5; max-width: 400px; }
  .bubble { position: fixed; pointer-events: none; background: #fff; color: #1d1d1b; border-radius: 16px; padding: 8px 14px;
    font-size: clamp(14px, 1.6vw, 20px); box-shadow: 0 3px 14px rgba(0,0,0,.16); white-space: nowrap; transform-origin: 50% 100%; }

  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; pointer-events: none; z-index: 3; }
  #barTop { top: 0; } #barBot { bottom: 0; }

    padding: 10px 14px 12px; color: #1d1d1b; display: none; min-width: 150px; max-width: min(520px, calc(100vw - 36px)); }
  body.instr .steps { display: block; }
  .steps .n { font: 800 44px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; margin-top: 6px; }
  .steps .n small { font-size: 14px; font-weight: 500; color: #4f5b66; margin-left: 6px; }
  .steps .icons { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .steps .icon { display: flex; flex-direction: column; align-items: center; font: 600 13px "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .steps .icon img { width: 58px; height: 58px; }
  .ui button.on { background: var(--accent); color: #fff; border-color: transparent; }
  .subtitle { position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%); max-width: min(900px, 86vw); text-align: center;
    font: 500 clamp(16px, 2.1vw, 28px)/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; background: rgba(0,0,0,.62);
    padding: .25em .7em; border-radius: 6px; pointer-events: none; opacity: 0; z-index: 4; }
  body.render.nosubs .subtitle { display: none; }
  .help { font-size: 11px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 720px) { .help { display: none; } .cap { top: 5vh; } }
</style>

<body>
<div class="cap"><div class="k" id="capK"></div><div class="t" id="capT"></div></div>
<svg id="leaders"></svg>
<div class="card" id="card"><div class="k" id="cardK"></div><div class="t" id="cardT"></div><div class="s" id="cardS"></div><div class="rule"></div></div>
<div class="bar" id="barTop"></div><div class="bar" id="barBot"></div><div id="fade"></div>
<div class="badge" id="badge"></div>
<div class="chapter" id="chapter"></div>
<div class="subtitle" id="subtitle"></div>
<div class="steps" id="steps"><div class="icons" id="stepIcons"></div><div class="n" id="stepN"></div></div>
<div class="ui">
  <button id="play" aria-label="Play or pause">❚❚</button>
  <div class="track"><div class="ticks" id="ticks"></div><input id="scrub" type="range" min="0" step="1" aria-label="Timeline"></div>
  <span class="time" id="time"></span>
  <button id="instrBtn" aria-label="Step-by-step instructions">Steps</button>
  <button id="mute" aria-label="Sound on or off">🔇</button>
  <span class="help">space · [ ] chapters · I steps · M sound · H hide</span>
</div>

<script>// The timeline: everything on stage as a pure function of time. The player
// draws from it, the build uses it to check the stage for collisions, and the
// tests exercise it directly. No three.js in here — positions are in story
// units (studs across, plates up, studs deep).
(function (root) {
  const PLATE = 0.4;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const settle = (p) => easeOut(p) + Math.sin(p * Math.PI) * 0.06 * (1 - p);
  const lerp = (a, b, p) => a + (b - a) * p;
  const lerpAngle = (a, b, p) => a + ((((b - a + Math.PI * 3) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * p;

  // Where an actor stands: { x, y, z } in story units, plus lift (plates) from
  // hopping or walking, and the move in progress if any.
  // `actors` lets an attached sub-assembly ride along with its host.
  function actorPos(a, t, actors) {
    if (a.attached && actors && t >= a.attached.t) {
      const h = actors[a.attached.to], hp = actorPos(h, t, actors), hc = actorCentre(h), sc = actorCentre(a);
      const r = (actorTurn(h, t, actors) * Math.PI) / 180, cs = Math.cos(r), sn = Math.sin(r);
      const dx = a.attached.offset[0] + sc[0] - hc[0], dz = a.attached.offset[2] + sc[1] - hc[1];
      return { x: hp.x + hc[0] + dx * cs - dz * sn - sc[0], y: hp.y + a.attached.offset[1], z: hp.z + hc[1] + dx * sn + dz * cs - sc[1], lift: hp.lift, active: null };
    }
    let pos = a.moves[0].to.slice(), lift = 0, active = null;
    for (const m of a.moves.slice(1)) {
      if (t < m.t) break;
      const p = clamp01((t - m.t) / m.dur);
      if (p < 1) {
        const e = m.arc ? p : easeInOut(p);                      // throws travel at an even pace
        lift = Math.abs(Math.sin(p * Math.PI * m.steps)) * m.hop + (m.arc ? 4 * m.arc * p * (1 - p) : 0);
        active = { move: m, p, from: pos.slice() };
        pos = pos.map((v, i) => lerp(v, m.to[i], e));
      } else pos = m.to.slice();
    }
    return { x: pos[0], y: pos[1], z: pos[2], lift, active };
  }

  // Total tumble so far from moves with `spin`, as [x, y, z] degrees.
  function actorSpin(a, t) {
    const out = [0, 0, 0];
    for (const m of a.moves || []) {
      if (!m.spin || t < m.t) continue;
      const p = clamp01((t - m.t) / m.dur);
      for (let i = 0; i < 3; i++) out[i] += m.spin[i] * p;
    }
    return out;
  }
  // A minifig's expression at time t.
  function faceAt(a, t) { let e = "smile"; for (const f of a.faces || []) if (f.t <= t) e = f.expr; return e; }
  // Who holds a prop at time t (null when nobody does).
  function holderAt(a, t) { let h = null; for (const e of a.held || []) if (e.t <= t) h = e.by ? e : null; return h; }

  // Sum of turn() calls so far, in degrees.
  function actorTurn(a, t, actors) {
    let deg = a.attached && actors && t >= a.attached.t ? actorTurn(actors[a.attached.to], t, actors) : 0;
    for (const k of a.turns || []) {
      if (t < k.t) break;
      const p = easeInOut(clamp01((t - k.t) / k.dur));
      deg += k.deg * p;
      if (p < 1) break;
    }
    return deg;
  }

  // Figures face the way they walk (radians, three.js y-rotation), and swing
  // their legs while they do.
  function figurePose(a, t) {
    let heading = ((a.face || 0) * Math.PI) / 180, pos = a.moves[0].to, swing = 0;
    for (const m of a.moves.slice(1)) {
      if (t < m.t) break;
      const dx = m.to[0] - pos[0], dz = m.to[2] - pos[2];
      if (Math.hypot(dx, dz) > 0.01) {
        heading = lerpAngle(heading, Math.atan2(dx, -dz), easeInOut(clamp01((t - m.t) / Math.min(450, m.dur * 0.35))));
        const p = clamp01((t - m.t) / m.dur);
        if (p < 1) swing = Math.sin(p * Math.PI * m.steps) * 0.6 * Math.sin(p * Math.PI);
      }
      pos = m.to;
    }
    return { heading: heading + (actorTurn(a, t) * Math.PI) / 180, swing };
  }

  // A brick part: k is how far it still has to fly in (1 → 0), out how far it
  // has flown away again (0 → 1).
  function partState(p, t) {
    if (t < p.t0) return { visible: false, k: 1, out: 0, settled: false };
    const k = 1 - settle(clamp01((t - p.t0) / p.dur));
    const out = p.out && t >= p.out.t0 ? easeIn(clamp01((t - p.out.t0) / p.out.dur)) : 0;
    return { visible: out < 1, k, out, settled: t >= p.t0 + p.dur && out === 0 };
  }

  // A prop's on/off level (0..1), easing between states.
  function propLevel(p, t) {
    let v = 0;
    for (const e of p.events || []) {
      if (t < e.t) break;
      v += ((e.on ? 1 : 0) - v) * easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
    }
    return v;
  }

  // A joint's angle in degrees: each pose() eases from where the joint was.
  function jointAngle(a, joint, t) {
    let deg = 0;
    for (const p of a.poses || []) {
      if (p.joint !== joint || t < p.t) continue;
      deg += (p.deg - deg) * easeInOut(clamp01((t - p.t) / Math.max(1, p.dur)));
    }
    return deg;
  }

  // On/off events (letterbox, fades) as a level 0..1.
  function level(events, t) {
    let v = 0;
    for (const e of events || []) {
      if (t < e.t) break;
      v += ((e.on ? 1 : 0) - v) * easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
    }
    return v;
  }

  // The light, as weights over the three moods (they sum to 1).
  function moodWeights(story, t) {
    let w = { day: 1, morning: 0, midday: 0, overcast: 0, sunset: 0, amber: 0, dusk: 0, night: 0 };
    for (const m of story.moods || []) {
      if (t < m.t) break;
      const p = easeInOut(clamp01((t - m.t) / Math.max(1, m.dur)));
      w = Object.fromEntries(Object.entries(w).map(([k, v]) => [k, v * (1 - p) + (k === m.name ? p : 0)]));
    }
    return w;
  }

  // A light's settings at time t: each lightTo() eases every setting it names
  // from wherever it was. Colours ease too (as RGB).
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  function lightState(L, t) {
    const st = {};
    for (const k of L.keys) {
      if (t < k.t) break;
      const p = easeInOut(clamp01((t - k.t) / Math.max(1, k.dur)));
      for (const [key, v] of Object.entries(k)) {
        if (key === "t" || key === "dur" || v === undefined) continue;
        const to = key === "color" ? hexRgb(v) : v, from = st[key];
        if (from === undefined || typeof to === "boolean") { st[key] = Array.isArray(to) ? to.slice() : to; continue; }
        st[key] = Array.isArray(to) ? to.map((x, i) => lerp(from[i] ?? x, x, p)) : lerp(from, to, p);
      }
    }
    return st;
  }
  // A model's lamp: how bright (0..1) and in what colour.
  function lampAt(a, t) {
    let v = 0, color = "#ffd36b", intensity = 1;
    for (const e of a.lamps || []) {
      if (t < e.t) break;
      v += ((e.on ? 1 : 0) - v) * easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
      if (e.on) { color = e.color; intensity = e.intensity; }
    }
    return { level: v, color, intensity };
  }

  // Which bubbles are on screen.
  function bubblesAt(story, t) { return (story.bubbles || []).filter((b) => t >= b.t && t <= b.t + b.dur); }

  // A highlight's glow (0..1): pulses twice over its duration.
  function glow(a, t) {
    let g = 0;
    for (const h of a.highlights || []) {
      if (t < h.t || t > h.t + h.dur) continue;
      const p = (t - h.t) / h.dur;
      g = Math.max(g, Math.sin(p * Math.PI) * (0.6 + 0.4 * Math.cos(p * Math.PI * 4)));
    }
    return g;
  }

  // ---- camera --------------------------------------------------------------
  // A shot looks at a fixed point (`at`) or follows an actor (`follow`), and
  // each keyframe eases from wherever the camera was at that moment.
  function shotTarget(story, shot, t) {
    if (shot.follow) {
      const a = story.actors[shot.follow];
      const p = actorPos(a, t, story.actors), o = shot.offset || [0, 6, 0], c = actorCentre(a);
      return [p.x + c[0] + o[0], p.y + o[1], p.z + c[1] + o[2]];
    }
    return shot.at;
  }
  function actorCentre(a) {
    if (!a.parts || !a.parts.length) return [0, 0];
    const xs = a.parts.flatMap((p) => [p.x, p.x + p.w]), zs = a.parts.flatMap((p) => [p.z, p.z + p.d]);
    return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...zs) + Math.max(...zs)) / 2];
  }
  function cameraState(story, t, upto = story.camera.length) {
    const cams = story.camera;
    let i = -1;
    for (let j = 0; j < upto; j++) if (cams[j].t <= t) i = j;
    if (i < 0) i = 0;
    const to = cams[i].shot, at = shotTarget(story, to, t);
    const target = { az: to.az, el: to.el, dist: to.dist, x: at[0], y: at[1], z: at[2] };
    if (i === 0 && cams[0].t >= t) return target;
    const from = i === 0 ? target : cameraState(story, cams[i].t, i);
    const e = easeInOut(clamp01((t - cams[i].t) / Math.max(1, cams[i].dur)));
    const out = {};
    for (const k of Object.keys(target)) out[k] = lerp(from[k], target[k], e);
    return out;
  }

  // ---- chapters and sound ------------------------------------------------
  function chapters(story) {
    return story.captions.filter((c) => c.text).map((c) => ({ t: c.t, label: c.kicker ? `${c.kicker} · ${c.text}` : c.text }));
  }

  // Every sound the story makes, in time order: { t, kind, size }.
  function soundEvents(story) {
    const ev = [];
    for (const a of Object.values(story.actors)) {
      for (const p of a.parts || []) {
        ev.push({ t: p.t0 + p.dur * 0.82, kind: "click", size: p.w * p.d * p.h });
        if (p.out) ev.push({ t: p.out.t0, kind: "whoosh", size: 1 });
      }
      if (a.kind === "figure" || a.kind === "minifig") {
        ev.push({ t: a.t0 + a.appear * 0.7, kind: "thud", size: 1 });
        for (const m of a.moves.slice(1)) for (let s = 1; s <= m.steps; s++) ev.push({ t: m.t + (m.dur * s) / (m.steps + 1), kind: "step", size: 1 });
      }
    }
    for (const p of Object.values(story.props || {})) {
      ev.push({ t: p.t0 + p.dur * 0.6, kind: "install", size: 1 });
      for (const e of p.events) ev.push({ t: e.t, kind: `${p.kind}-${e.on ? "on" : "off"}`, size: 1 });
    }
    for (const b of story.bubbles || []) ev.push({ t: b.t, kind: "say", size: b.text.length });
    for (const e of story.emitters || []) ev.push({ t: e.t, kind: `emit-${e.kind}`, size: e.count });
    // music: one chord per bar while a piece is playing
    const BAR = 2400, music = story.music || [];
    music.forEach((m, i) => {
      if (!m.name) return;
      const end = i + 1 < music.length ? music[i + 1].t : story.duration;
      for (let k = 0, t = m.t; t < end; k++, t += BAR) ev.push({ t, kind: "chord", size: k, piece: m.name });
    });
    for (const c of story.sfx || []) ev.push({ t: c.t, kind: `sfx-${c.name}`, size: c.gain });
    // ambience: a bed per stretch, and a clock tick every second
    const amb = story.ambience || [];
    amb.forEach((c, i) => {
      if (!c.name) return;
      const end = i + 1 < amb.length ? amb[i + 1].t : story.duration;
      ev.push({ t: c.t, kind: "room-bed", size: (end - c.t) / 1000 });
      for (let t = c.t + 400; t < end; t += 1000) ev.push({ t, kind: "clock", size: 1 });
    });

<script type="module">
import * as THREE from "three";
// Brick drawing, shared by the player and the printable booklet (the build
// inlines this file into both). Plain parts are rounded boxes with studs;
// slopes and round parts use their real LDraw geometry, turned into the scene
// frame: LDU / 20, y and z flipped, rotated the way the LDraw export rotates it.
function brickKit({ THREE, RoundedBoxGeometry, toCreasedNormals, meshes, PLATE }) {
  const toScene = (x, yPlates, z) => new THREE.Vector3(x, yPlates * PLATE, -z);
  const geoCache = new Map(), meshGeoCache = new Map();
  const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.18, 24);
  function bodyGeo(w, h, d) {
    const k = `${w}x${h}x${d}`;
    if (!geoCache.has(k)) geoCache.set(k, new RoundedBoxGeometry(w - 0.03, h * PLATE - 0.02, d - 0.03, 3, 0.05));
    return geoCache.get(k);
  }
  function meshGeo(p) {
    const key = `${p.part}@${p.rot}`;
    if (meshGeoCache.has(key)) return meshGeoCache.get(key);
    const m = meshes[p.part], [cx, cz] = m.center, phi = THREE.MathUtils.degToRad(-p.rot), cs = Math.cos(phi), sn = Math.sin(phi);
    const pos = new Float32Array(m.tri.length);
    for (let i = 0; i < m.tri.length; i += 3) {
      const lx = (m.tri[i] - cx) / 20, ly = -m.tri[i + 1] / 20 + (p.h * PLATE) / 2, lz = -(m.tri[i + 2] - cz) / 20;
      pos[i] = lx * cs + lz * sn; pos[i + 1] = ly; pos[i + 2] = -lx * sn + lz * cs;
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo = toCreasedNormals(geo, Math.PI / 6);
    meshGeoCache.set(key, geo);
    return geo;
  }
  // `covered` (optional): skip studs hidden under another part, for big models
  function brick(p, mat, covered) {
    const g = new THREE.Group();
    g.userData.home = toScene(p.x + p.w / 2, p.y + p.h / 2, p.z + p.d / 2);
    if (p.mesh && meshes?.[p.part]) {
      const m = new THREE.Mesh(meshGeo(p), mat); m.castShadow = m.receiveShadow = true; g.add(m);
      return g;
    }
    const body = new THREE.Mesh(bodyGeo(p.w, p.h, p.d), mat);
    body.castShadow = body.receiveShadow = true; g.add(body);
    if (p.kind !== "tile") for (let i = 0; i < p.w; i++) for (let k = 0; k < p.d; k++) {
      if (covered && covered(p.x + i, p.y + p.h, p.z + k)) continue;
      const s = new THREE.Mesh(studGeo, mat); s.castShadow = true;
      s.position.set(-p.w / 2 + 0.5 + i, p.h * PLATE / 2 + 0.09, p.d / 2 - 0.5 - k);
      g.add(s);
    }
    return g;
  }
  return { brick, toScene, bodyGeo, meshGeo };
}

// Minifigure-style characters, drawn from simple shapes and rigged for
// animation: legs swing from the hips, arms from the shoulders, C-shaped
// hands twist at the wrist, the head turns on its neck, and the body can lean.
// Faces are drawn on a texture, so expressions can change. These are
// characters, not checked LEGO models. Inlined into the player by the build.
function minifigKit(THREE, colors) {
  const SKIN = "#f2cd37";
  const col = (c, fallback) => (c == null ? fallback : typeof c === "string" ? c : colors[c]?.[2] || fallback);
  const mat = (c, opts = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.32, ...opts });

  // ---- faces: eyes, brows and a mouth per expression
  function faceTexture(expr, extra) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = SKIN; g.fillRect(0, 0, 512, 256);
    const cx = 256, ey = 108, dx = 34;
    g.fillStyle = "#1b1b1b"; g.strokeStyle = "#1b1b1b"; g.lineCap = "round"; g.lineWidth = 9;
    const eye = (x, h = 22) => { g.beginPath(); g.ellipse(x, ey, 11, h / 2, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.arc(x + 3, ey - 4, 3.5, 0, Math.PI * 2); g.fill(); g.fillStyle = "#1b1b1b"; };
    const brow = (x, tilt, lift = 0) => { g.beginPath(); g.moveTo(x - 16, ey - 32 - lift + tilt); g.lineTo(x + 16, ey - 32 - lift - tilt); g.stroke(); };
    const mouth = (kind) => {
      g.beginPath();
      if (kind === "smile") g.arc(cx, 150, 34, 0.15 * Math.PI, 0.85 * Math.PI);
      else if (kind === "grin") { g.arc(cx, 146, 40, 0.05 * Math.PI, 0.95 * Math.PI); g.closePath(); g.fillStyle = "#fff"; g.fill(); g.fillStyle = "#1b1b1b"; }
      else if (kind === "sad") g.arc(cx, 196, 30, 1.2 * Math.PI, 1.8 * Math.PI);
      else if (kind === "o") { g.ellipse(cx, 168, 13, 17, 0, 0, Math.PI * 2); g.fill(); return; }
      else if (kind === "smirk") { g.moveTo(cx - 26, 172); g.quadraticCurveTo(cx + 10, 180, cx + 30, 160); }
      else if (kind === "wavy") { g.moveTo(cx - 30, 172); g.quadraticCurveTo(cx - 15, 160, cx, 172); g.quadraticCurveTo(cx + 15, 184, cx + 30, 170); }
      else { g.moveTo(cx - 26, 172); g.lineTo(cx + 26, 172); }
      g.stroke();
    };
    const E = {
      smile: () => { eye(cx - dx); eye(cx + dx); mouth("smile"); },
      grin: () => { eye(cx - dx); eye(cx + dx); brow(cx - dx, -2, 4); brow(cx + dx, 2, 4); mouth("grin"); },
      neutral: () => { eye(cx - dx); eye(cx + dx); mouth("line"); },
      sad: () => { eye(cx - dx, 16); eye(cx + dx, 16); brow(cx - dx, -7); brow(cx + dx, 7); mouth("sad"); },

  // ---- hats and hair, sitting on the head's top (y = 0 there)
  function hat(kind, color, tilt = 0) {

  // ---- the figure: origin at the feet, facing +z

    // legs swing from the hip line

    const torso = new THREE.Mesh(tg, [torsoMat, torsoMat, torsoMat, torsoMat, front, torsoMat]); torso.position.y = 0.78; torso.castShadow = true; upper.add(torso);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.16, 16), skin); neck.position.y = 1.63; upper.add(neck);
    // head: turns on the neck; the face is drawn on the front of the cylinder

    const hatSocket = new THREE.Group(); hatSocket.position.y = 1.05; head.add(hatSocket);

    if (look.beard) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), mat("#f4f4f4")); b.position.set(0, 0.12, 0.42); b.scale.set(1, 0.9, 0.55); head.add(b); }
    // arms swing from the shoulders; hands are C-shaped clips that twist
    const sockets = {};
    const arms = [[-1, "r"], [1, "l"]].map(([s, side]) => {
      const sh = new THREE.Group(); sh.position.set(s * 0.86, 1.36, 0); upper.add(sh);
      const tilt = new THREE.Group(); tilt.rotation.z = s * 0.14; sh.add(tilt);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 1.2, 16), torsoMat); arm.position.y = -0.55; arm.castShadow = true; tilt.add(arm);
      const wrist = new THREE.Group(); wrist.position.set(0, -1.2, 0.12); tilt.add(wrist);
      const hand = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.085, 10, 20, Math.PI * 1.55), skin);

      setFace(expr) { if (this._expr === expr) return; this._expr = expr; faceMat.map = faceTexture(expr, look.extra); faceMat.needsUpdate = true; },

// ---------- bricks (materials are per actor, so one actor can glow alone)
const KIT = brickKit({ THREE, RoundedBoxGeometry, toCreasedNormals, meshes: S.meshes || {}, PLATE });
const brick = KIT.brick;
const failing = new Map();       // actor id -> Set of part indices a model check flagged
for (const r of Object.values(S.reports)) if (!r.ok && r.actor) failing.set(r.actor, new Set(r.errors.map((e) => e.part).filter((i) => i != null)));

  const group = new THREE.Group(); scene.add(group);

  let covered = null;

    for (const p of a.parts) for (let x = p.x; x < p.x + p.w; x++) for (let z = p.z; z < p.z + p.d; z++) occ.add(`${x},${p.y},${z}`);

  const ys = a.parts.flatMap((p) => [p.y, p.y + p.h]);

    jg.position.copy(at); group.add(jg);

});
function evalBricks(t) {
  for (const { a, meshes, group, pivot, mats, joints } of actors) {
    for (const j of joints) {
      const r = THREE.MathUtils.degToRad(TL.jointAngle(a, j.name, t));
      j.jg.rotation.set(j.axis === "x" ? -r : 0, j.axis === "y" ? r : 0, j.axis === "z" ? r : 0);
    }
    const holder = TL.holderAt(a, t), flight = (a.moves || []).find((m) => m.fromHand && t >= m.t && t < m.t + m.dur + 1e9 && !(a.moves.some((n) => n.t > m.t && t >= n.t)));
    const spin = TL.actorSpin(a, t).map((d) => THREE.MathUtils.degToRad(d));
    if (holder) {
      // riding in a minifig's hand: follow the hand's world transform
      const sock = MF.get(holder.by)?.rig.sockets[holder.hand];
      if (sock) {
        sock.updateWorldMatrix(true, false);
        group.position.setFromMatrixPosition(sock.matrixWorld);
        const off = new THREE.Vector3(holder.offset[0], holder.offset[1] * PLATE, -holder.offset[2]);
        if (holder.upright !== false) {
          // hangs level from the hand, turning only with the figure
          const yaw = MF.get(holder.by).rig.root.rotation.y;
          group.position.add(off.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw));
          group.rotation.set(0, yaw, 0);
        } else {
          const q = new THREE.Quaternion().setFromRotationMatrix(sock.matrixWorld);
          group.position.add(off.applyQuaternion(q)); group.quaternion.copy(q);
        }
      }
    } else if (flight && t < flight.t + flight.dur) {
      // just dropped: fly from where the hand was to where it lands
      const from = handPosAt(a, flight.t), p = TL.clamp01((t - flight.t) / flight.dur);
      const to = toScene(flight.to[0], flight.to[1], flight.to[2]).add(pivot);
      group.position.lerpVectors(from, to, p); group.position.y += 4 * (flight.arc || 0) * p * (1 - p) * PLATE;
      group.rotation.set(spin[0], THREE.MathUtils.degToRad(TL.actorTurn(a, t, S.actors)) + spin[1], spin[2]);
    } else {
      const pos = TL.actorPos(a, t, S.actors);
      group.position.copy(toScene(pos.x, pos.y + pos.lift, pos.z)).add(pivot);
      group.rotation.set(spin[0], THREE.MathUtils.degToRad(TL.actorTurn(a, t, S.actors)) + spin[1], spin[2]);
    }
    const g = TL.glow(a, t);
    for (const m of mats) { m.emissive.set(a.highlights?.[0]?.color || "#ff8a2a"); m.emissiveIntensity = 0.32 * g; }
    a.parts.forEach((p, i) => {
      const mesh = meshes[i], st = TL.partState(p, t);
      mesh.visible = st.visible;
      if (!st.visible) return;
      const f = p.from, o = p.out ? p.out.to : [0, 0, 0], h = mesh.userData.home;
      const jo = mesh.userData.joint;
      mesh.position.set(h.x - pivot.x - jo.x + f[0] * st.k + o[0] * st.out, h.y - pivot.y - jo.y + f[1] * st.k + o[1] * st.out, h.z - pivot.z - jo.z - f[2] * st.k - o[2] * st.out);
      const r = Math.max(st.k, st.out);
      mesh.rotation.set(p.spin[0] * r, p.spin[1] * r, p.spin[2] * r);
    });
  }
}

// ---------- instruction mode: the build as booklet steps
// A step is a run of parts in one actor (the model's `steps`). With I on,
// playback stops at the end of each step and shows the parts it needs; the
// new parts get a yellow outline and earlier ones go pale, as in the booklet.
const STEPS = [];
for (const act of actors) {
  let cur = null;
  act.a.parts.forEach((p, i) => {
    if (p.stepStart || !cur) { cur = { act, from: i, to: i + 1, t0: p.t0, tEnd: p.t0 + p.dur }; STEPS.push(cur); }
    else { cur.to = i + 1; cur.tEnd = Math.max(cur.tEnd, p.t0 + p.dur); }

}
STEPS.sort((a, b) => a.tEnd - b.tEnd);
STEPS.forEach((st, i) => { st.n = STEPS.filter((o, j) => j <= i && o.act === st.act).length; st.of = STEPS.filter((o) => o.act === st.act).length; });
let instr = false, stepShown = null;
// the outline is a slightly larger copy drawn back-face only: a silhouette
const yellow = new THREE.MeshBasicMaterial({ color: 0xf2c200, side: THREE.BackSide });
const paleCache = new Map();

  if (!paleCache.has(mat)) { const m = mat.clone(); m.color = mat.color.clone().lerp(new THREE.Color(0xffffff), 0.5); m.emissiveIntensity = 0; paleCache.set(mat, m); }
  return paleCache.get(mat);
}
function setLook(mesh, look) {
  if (mesh.userData.look === look) return;
  mesh.userData.look = look;
  for (const c of mesh.children) if (c.isMesh) { c.userData.base ||= c.material; c.material = look === "pale" ? pale(c.userData.base) : c.userData.base; }

    const size = b.getSize(new THREE.Vector3()), pad = 0.16;
    mesh.userData.outline = new THREE.Mesh(body.geometry, yellow);
    mesh.userData.outline.scale.set((size.x + pad) / size.x, (size.y + pad) / size.y, (size.z + pad) / size.z);
    mesh.add(mesh.userData.outline);
  }
  if (mesh.userData.outline) mesh.userData.outline.visible = look === "new";
}
// part icons for the callout, rendered once each
const iconRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
iconRenderer.setSize(116, 116); iconRenderer.outputColorSpace = THREE.SRGBColorSpace;
const iconScene = new THREE.Scene();
iconScene.add(new THREE.HemisphereLight(0xffffff, 0x9a9590, 1.6));
const iconSun = new THREE.DirectionalLight(0xffffff, 2); iconSun.position.set(-3, 6, 4); iconScene.add(iconSun);
const iconCache = new Map();
function icon(p) {
  const key = `${p.part}|${p.color}`;
  if (iconCache.has(key)) return iconCache.get(key);
  const q = { ...p, x: 0, y: 0, z: 0, rot: 0, w: p.rot === 90 || p.rot === 270 ? p.d : p.w, d: p.rot === 90 || p.rot === 270 ? p.w : p.d };

  const c = g.userData.home; g.position.set(-c.x, -c.y, -c.z); iconScene.add(g);

// The step being built now (or, between builds, the last one finished).
function currentStep(t) {

  if (now) return now;
  let done = null; for (const st of STEPS) if (st.tEnd < t) done = st;

let t = 0, playing = true, last = performance.now();
$("scrub").max = S.duration;
$("ticks").innerHTML = CH.map((c) => `<i style="left:${(c.t / S.duration) * 100}%" title="${c.label}"></i>`).join("");
function setPlaying(p) { playing = p; $("play").textContent = p ? "❚❚" : "▶"; last = performance.now(); }
function jump(dir) {
  const now = t + (dir > 0 ? 1 : -400);
  const c = dir > 0 ? CH.find((c) => c.t > now) : [...CH].reverse().find((c) => c.t < now);
  t = c ? c.t : dir > 0 ? S.duration : 0;
}
$("play").onclick = () => { if (t >= S.duration) t = 0; setPlaying(!playing); };
$("scrub").oninput = () => { t = +$("scrub").value; setPlaying(false); };
$("mute").onclick = () => setMuted(!muted);
$("instrBtn").onclick = () => setInstr(!instr);
function stepJump(dir) {
  const ends = STEPS.map((s) => s.tEnd);
  const target = dir > 0 ? ends.find((e) => e > t + 1) : [...ends].reverse().find((e) => e < t - 1);
  if (target !== undefined) { t = target; setPlaying(false); }
}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); $("play").click(); }
  else if (k === "arrowright") instr ? stepJump(1) : (t = Math.min(S.duration, t + 2000));
  else if (k === "arrowleft") instr ? stepJump(-1) : (t = Math.max(0, t - 2000));
  else if (k === "i") setInstr(!instr);
  else if (k === "]") jump(1);
  else if (k === "[") jump(-1);
  else if (k === "home" || k === "r") { t = 0; setPlaying(true); }
  else if (k === "m") setMuted(!muted);
  else if (k === "h") document.body.classList.toggle("clean");
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
});

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

function frame(now) {
  const before = t;
  if (playing) {
    const next = t + (now - last);
    const stop = instr ? STEPS.find((s) => s.tEnd > t + 1 && s.tEnd <= next) : null;   // pause at each step's end
    t = stop ? stop.tEnd : next;
    if (stop) setPlaying(false);
    if (t >= S.duration) { t = S.duration; setPlaying(false); }
  }
  last = now;
  if (playing) playSounds(before, t);
  draw(t);
  if (!RENDER) requestAnimationFrame(frame);
}
// Everything on screen at time t, drawn once. The live loop calls it every
// frame; render.mjs calls it directly through window.__renderAt.
function draw(at) {
  t = at;
  evalMood(t); evalMinifigs(t); evalBricks(t); evalLamps(t); evalLights(t); evalSteps(t); evalRoom(t); for (const v of propViews) v(t); evalFigures(t); evalParticles(t); evalCamera(t); evalOverlay(t);
  renderer.render(scene, camera);
  evalCallouts(t); evalBubbles(t); evalBars(t); evalSubtitle(t);
  const ch = [...CH].reverse().find((c) => c.t <= t);
  $("chapter").textContent = ch ? ch.label : S.meta.title; $("chapter").style.opacity = ch || t < 1000 ? 1 : 0;
  $("scrub").value = t; $("time").textContent = `${fmt(t)} / ${fmt(S.duration)}`;
  window.__t = t;                     // the dev server reads this to reopen at the same moment
}
// Render mode (?render): no live loop, no controls; render.mjs steps through
// time itself and photographs each frame, captions and all.
const RENDER = new URLSearchParams(location.search).has("render");
window.__renderAt = (ms) => { draw(ms); return ms; };
window.__duration = S.duration;
window.__narration = S.narration || [];
const qs = new URLSearchParams(location.search);
if (qs.has("t")) { t = +qs.get("t"); setPlaying(qs.has("play")); }
if (qs.has("clean") || RENDER) document.body.classList.add("clean");
if (RENDER) { document.body.classList.add("render"); playing = false; if (!qs.has("subs")) document.body.classList.add("nosubs"); }
if (qs.has("steps")) setInstr(true);
requestAnimationFrame(frame);
</script>
</body>
