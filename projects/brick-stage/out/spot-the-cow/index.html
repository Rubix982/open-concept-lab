  /* callouts: a label on a leader line, pinned to something on stage */

  .chapter { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 12px; color: var(--muted);

  .badge { position: fixed; right: 16px; top: 14px; max-width: min(420px, calc(100vw - 32px)); font-size: 12px; color: #6f6e68;

  .badge details { display: inline; } .badge summary { cursor: pointer; list-style: none; display: inline; }

<script>// The timeline: everything on stage as a pure function of time. The player
// draws from it, the build uses it to check the stage for collisions, and the
// tests exercise it directly. No three.js in here — positions are in story
// units (studs across, plates up, studs deep).
(function (root) {
  const PLATE = 0.4;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeIn = (p) => p * p;
  const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const settle = (p) => easeOut(p) + Math.sin(p * Math.PI) * 0.06 * (1 - p);
  const lerp = (a, b, p) => a + (b - a) * p;
  const lerpAngle = (a, b, p) => a + ((((b - a + Math.PI * 3) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * p;

  // Where an actor stands: { x, y, z } in story units, plus lift (plates) from
  // hopping or walking, and the move in progress if any.
  // `actors` lets an attached sub-assembly ride along with its host.
  function actorPos(a, t, actors) {
    if (a.attached && actors && t >= a.attached.t) {
      const h = actors[a.attached.to], hp = actorPos(h, t, actors), hc = actorCentre(h), sc = actorCentre(a);
      const r = (actorTurn(h, t, actors) * Math.PI) / 180, cs = Math.cos(r), sn = Math.sin(r);
      const dx = a.attached.offset[0] + sc[0] - hc[0], dz = a.attached.offset[2] + sc[1] - hc[1];
      return { x: hp.x + hc[0] + dx * cs - dz * sn - sc[0], y: hp.y + a.attached.offset[1], z: hp.z + hc[1] + dx * sn + dz * cs - sc[1], lift: hp.lift, active: null };
    }
    let pos = a.moves[0].to.slice(), lift = 0, active = null;
    for (const m of a.moves.slice(1)) {
      if (t < m.t) break;
      const p = clamp01((t - m.t) / m.dur);
      if (p < 1) {
        const e = easeInOut(p);
        lift = Math.abs(Math.sin(p * Math.PI * m.steps)) * m.hop;
        active = { move: m, p, from: pos.slice() };
        pos = pos.map((v, i) => lerp(v, m.to[i], e));
      } else pos = m.to.slice();
    }
    return { x: pos[0], y: pos[1], z: pos[2], lift, active };
  }

  // Sum of turn() calls so far, in degrees.
  function actorTurn(a, t, actors) {
    let deg = a.attached && actors && t >= a.attached.t ? actorTurn(actors[a.attached.to], t, actors) : 0;
    for (const k of a.turns || []) {
      if (t < k.t) break;
      const p = easeInOut(clamp01((t - k.t) / k.dur));
      deg += k.deg * p;
      if (p < 1) break;
    }
    return deg;
  }

  // Figures face the way they walk (radians, three.js y-rotation), and swing
  // their legs while they do.
  function figurePose(a, t) {
    let heading = ((a.face || 0) * Math.PI) / 180, pos = a.moves[0].to, swing = 0;
    for (const m of a.moves.slice(1)) {
      if (t < m.t) break;
      const dx = m.to[0] - pos[0], dz = m.to[2] - pos[2];
      if (Math.hypot(dx, dz) > 0.01) {
        heading = lerpAngle(heading, Math.atan2(dx, -dz), easeInOut(clamp01((t - m.t) / Math.min(450, m.dur * 0.35))));
        const p = clamp01((t - m.t) / m.dur);
        if (p < 1) swing = Math.sin(p * Math.PI * m.steps) * 0.6 * Math.sin(p * Math.PI);
      }
      pos = m.to;
    }
    return { heading: heading + (actorTurn(a, t) * Math.PI) / 180, swing };
  }

  // A brick part: k is how far it still has to fly in (1 → 0), out how far it
  // has flown away again (0 → 1).
  function partState(p, t) {
    if (t < p.t0) return { visible: false, k: 1, out: 0, settled: false };
    const k = 1 - settle(clamp01((t - p.t0) / p.dur));
    const out = p.out && t >= p.out.t0 ? easeIn(clamp01((t - p.out.t0) / p.out.dur)) : 0;
    return { visible: out < 1, k, out, settled: t >= p.t0 + p.dur && out === 0 };
  }

  // A prop's on/off level (0..1), easing between states.
  function propLevel(p, t) {
    let v = 0;
    for (const e of p.events || []) {
      if (t < e.t) break;
      v += ((e.on ? 1 : 0) - v) * easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
    }
    return v;
  }

  // A joint's angle in degrees: each pose() eases from where the joint was.
  function jointAngle(a, joint, t) {
    let deg = 0;
    for (const p of a.poses || []) {
      if (p.joint !== joint || t < p.t) continue;
      deg += (p.deg - deg) * easeInOut(clamp01((t - p.t) / Math.max(1, p.dur)));
    }
    return deg;
  }

  // On/off events (letterbox, fades) as a level 0..1.
  function level(events, t) {
    let v = 0;
    for (const e of events || []) {
      if (t < e.t) break;
      v += ((e.on ? 1 : 0) - v) * easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
    }
    return v;
  }

  // The light, as weights over the three moods (they sum to 1).
  function moodWeights(story, t) {
    let w = { day: 1, sunset: 0, night: 0 };
    for (const m of story.moods || []) {
      if (t < m.t) break;
      const p = easeInOut(clamp01((t - m.t) / Math.max(1, m.dur)));
      w = Object.fromEntries(Object.entries(w).map(([k, v]) => [k, v * (1 - p) + (k === m.name ? p : 0)]));
    }
    return w;
  }

  // Which bubbles are on screen.
  function bubblesAt(story, t) { return (story.bubbles || []).filter((b) => t >= b.t && t <= b.t + b.dur); }

  // A highlight's glow (0..1): pulses twice over its duration.
  function glow(a, t) {
    let g = 0;
    for (const h of a.highlights || []) {
      if (t < h.t || t > h.t + h.dur) continue;
      const p = (t - h.t) / h.dur;
      g = Math.max(g, Math.sin(p * Math.PI) * (0.6 + 0.4 * Math.cos(p * Math.PI * 4)));
    }
    return g;
  }

  // ---- camera --------------------------------------------------------------
  // A shot looks at a fixed point (`at`) or follows an actor (`follow`), and
  // each keyframe eases from wherever the camera was at that moment.
  function shotTarget(story, shot, t) {
    if (shot.follow) {
      const a = story.actors[shot.follow];
      const p = actorPos(a, t, story.actors), o = shot.offset || [0, 6, 0], c = actorCentre(a);
      return [p.x + c[0] + o[0], p.y + o[1], p.z + c[1] + o[2]];
    }
    return shot.at;
  }
  function actorCentre(a) {
    if (!a.parts || !a.parts.length) return [0, 0];
    const xs = a.parts.flatMap((p) => [p.x, p.x + p.w]), zs = a.parts.flatMap((p) => [p.z, p.z + p.d]);
    return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...zs) + Math.max(...zs)) / 2];
  }
  function cameraState(story, t, upto = story.camera.length) {
    const cams = story.camera;
    let i = -1;
    for (let j = 0; j < upto; j++) if (cams[j].t <= t) i = j;
    if (i < 0) i = 0;
    const to = cams[i].shot, at = shotTarget(story, to, t);
    const target = { az: to.az, el: to.el, dist: to.dist, x: at[0], y: at[1], z: at[2] };
    if (i === 0 && cams[0].t >= t) return target;
    const from = i === 0 ? target : cameraState(story, cams[i].t, i);
    const e = easeInOut(clamp01((t - cams[i].t) / Math.max(1, cams[i].dur)));
    const out = {};
    for (const k of Object.keys(target)) out[k] = lerp(from[k], target[k], e);
    return out;
  }

  // ---- chapters and sound ------------------------------------------------
  function chapters(story) {
    return story.captions.filter((c) => c.text).map((c) => ({ t: c.t, label: c.kicker ? `${c.kicker} · ${c.text}` : c.text }));
  }

  // Every sound the story makes, in time order: { t, kind, size }.
  function soundEvents(story) {
    const ev = [];
    for (const a of Object.values(story.actors)) {
      for (const p of a.parts || []) {
        ev.push({ t: p.t0 + p.dur * 0.82, kind: "click", size: p.w * p.d * p.h });
        if (p.out) ev.push({ t: p.out.t0, kind: "whoosh", size: 1 });
      }
      if (a.kind === "figure") {
        ev.push({ t: a.t0 + a.appear * 0.7, kind: "thud", size: 1 });
        for (const m of a.moves.slice(1)) for (let s = 1; s <= m.steps; s++) ev.push({ t: m.t + (m.dur * s) / (m.steps + 1), kind: "step", size: 1 });
      }
    }
    for (const p of Object.values(story.props || {})) {
      ev.push({ t: p.t0 + p.dur * 0.6, kind: "install", size: 1 });
      for (const e of p.events) ev.push({ t: e.t, kind: `${p.kind}-${e.on ? "on" : "off"}`, size: 1 });
    }
    for (const b of story.bubbles || []) ev.push({ t: b.t, kind: "say", size: b.text.length });
    for (const e of story.emitters || []) ev.push({ t: e.t, kind: `emit-${e.kind}`, size: e.count });
    // music: one chord per bar while a piece is playing
    const BAR = 2400, music = story.music || [];
    music.forEach((m, i) => {
      if (!m.name) return;
      const end = i + 1 < music.length ? music[i + 1].t : story.duration;
      for (let k = 0, t = m.t; t < end; k++, t += BAR) ev.push({ t, kind: "chord", size: k, piece: m.name });
    });
    if (story.room) {
      const n = 26;      // the floor wave, as a patter rather than one click per panel
      for (let i = 0; i < n; i++) ev.push({ t: story.room.t0 + (story.room.dur * 0.8 * i) / n + 200, kind: "panel", size: 1 });
    }
    return ev.sort((a, b) => a.t - b.t);
  }

  // ---- stage check -------------------------------------------------------
  // Boxes for everything solid on stage at time t (story units), for the
  // collision check. Brick parts count once they have landed.
  function solidBoxes(story, t) {
    const boxes = [];
    for (const [id, a] of Object.entries(story.actors)) {
      const pos = actorPos(a, t, story.actors), y0 = pos.y + pos.lift;
      if (a.kind === "figure") {
        if (t < a.t0 + a.appear) continue;
        boxes.push({ id, min: [pos.x - 0.7, y0, pos.z - 0.7], max: [pos.x + 0.7, y0 + 14, pos.z + 0.7] });
        continue;
      }
      const deg = actorTurn(a, t, story.actors), c = actorCentre(a), r = (deg * Math.PI) / 180, cs = Math.cos(r), sn = Math.sin(r);
      for (const p of a.parts) {
        if (!partState(p, t).settled) continue;
        const xs = [], zs = [];
        for (const [x, z] of [[p.x, p.z], [p.x + p.w, p.z], [p.x, p.z + p.d], [p.x + p.w, p.z + p.d]]) {
          const dx = x - c[0], dz = z - c[1];
          xs.push(c[0] + dx * cs - dz * sn); zs.push(c[1] + dx * sn + dz * cs);   // same sense as turn() on screen
        }
        boxes.push({ id, min: [pos.x + Math.min(...xs), y0 + p.y, pos.z + Math.min(...zs)], max: [pos.x + Math.max(...xs), y0 + p.y + p.h, pos.z + Math.max(...zs)] });
      }
    }
    return boxes;
  }
  // Moments when two different actors overlap. Reports the first moment of
  // each overlapping pair.
  function stageCollisions(story, { step = 100, slack = 0.15 } = {}) {
    const seen = new Map();
    for (let t = 0; t <= story.duration; t += step) {
      const b = solidBoxes(story, t);
      for (let i = 0; i < b.length; i++) for (let j = i + 1; j < b.length; j++) {
        if (b[i].id === b[j].id) continue;
        const hit = [0, 1, 2].every((q) => b[i].min[q] < b[j].max[q] - slack && b[j].min[q] < b[i].max[q] - slack);
        const key = [b[i].id, b[j].id].sort().join(" & ");
        if (hit && !seen.has(key)) seen.set(key, t);
      }
    }
    return [...seen].map(([pair, t]) => ({ pair, t }));
  }

  const api = { PLATE, clamp01, easeOut, easeIn, easeInOut, settle, actorPos, actorTurn, figurePose, partState, propLevel, glow, actorCentre, cameraState, chapters, soundEvents, solidBoxes, stageCollisions, jointAngle, level, moodWeights, bubblesAt };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.TL = api;

// frame: LDU / 20, y and z flipped, rotated the way the LDraw export rotates it.
function brickKit({ THREE, RoundedBoxGeometry, toCreasedNormals, meshes, PLATE }) {
  const toScene = (x, yPlates, z) => new THREE.Vector3(x, yPlates * PLATE, -z);
  const geoCache = new Map(), meshGeoCache = new Map();
  const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.18, 24);
  function bodyGeo(w, h, d) {
    const k = `${w}x${h}x${d}`;
    if (!geoCache.has(k)) geoCache.set(k, new RoundedBoxGeometry(w - 0.03, h * PLATE - 0.02, d - 0.03, 3, 0.05));
    return geoCache.get(k);
  }
  function meshGeo(p) {
    const key = `${p.part}@${p.rot}`;
    if (meshGeoCache.has(key)) return meshGeoCache.get(key);
    const m = meshes[p.part], [cx, cz] = m.center, phi = THREE.MathUtils.degToRad(-p.rot), cs = Math.cos(phi), sn = Math.sin(phi);
    const pos = new Float32Array(m.tri.length);
    for (let i = 0; i < m.tri.length; i += 3) {

      pos[i] = lx * cs + lz * sn; pos[i + 1] = ly; pos[i + 2] = -lx * sn + lz * cs;
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo = toCreasedNormals(geo, Math.PI / 6);
    meshGeoCache.set(key, geo);
    return geo;
  }

  function brick(p, mat, covered) {
    const g = new THREE.Group();
    g.userData.home = toScene(p.x + p.w / 2, p.y + p.h / 2, p.z + p.d / 2);

      g.add(s);
    }

  }

const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 3 });
heartGeo.center();
const sparkGeo = new THREE.OctahedronGeometry(0.22), confGeo = new THREE.PlaneGeometry(0.34, 0.2);
const CONF = [0xe8711c, 0x1e5aa8, 0xfac80a, 0x58ab41, 0xd6453b, 0xffffff];
const particles = (S.emitters || []).flatMap((e) => {
  const r = rngf(e.seed);
  return Array.from({ length: e.count }, () => {
    const mat = e.kind === "hearts" ? new THREE.MeshStandardMaterial({ color: r() < 0.7 ? 0xe2384f : 0xff8fa8, roughness: 0.35, emissive: 0x5a0010, emissiveIntensity: 0.4 })
      : e.kind === "sparkles" ? new THREE.MeshBasicMaterial({ color: 0xffe27a })
      : new THREE.MeshStandardMaterial({ color: CONF[Math.floor(r() * CONF.length)], side: THREE.DoubleSide, roughness: 0.6 });
    const m = new THREE.Mesh(e.kind === "hearts" ? heartGeo : e.kind === "sparkles" ? sparkGeo : confGeo, mat);
    m.visible = false; m.castShadow = e.kind !== "sparkles"; scene.add(m);
    const a = r() * Math.PI * 2, rad = 0.4 + r() * 1.8;
    return { e, m, delay: r() * e.dur * 0.4, life: e.dur * (0.55 + r() * 0.4), dx: Math.cos(a) * rad, dz: Math.sin(a) * rad,
      rise: 1.6 + r() * 1.8, sway: 0.25 + r() * 0.5, ph: r() * 6.28, size: e.kind === "hearts" ? 0.55 + r() * 0.5 : 0.8 + r() * 0.6, spin: (r() - 0.5) * 6 };
  });
});
function anchorTop(on, at, offset, t) {
  if (!on) return toScene(...at);
  const a = S.actors[on], pos = TL.actorPos(a, t, S.actors), [cx, cz] = TL.actorCentre(a);
  const top = a.parts ? Math.max(...a.parts.map((p) => p.y + p.h)) : 14;
  return toScene(pos.x + cx + offset[0], pos.y + pos.lift + top + offset[1], pos.z + cz + offset[2]);
}
function evalParticles(t) {
  for (const q of particles) {
    const tau = t - q.e.t - q.delay;
    if (tau < 0 || tau > q.life) { q.m.visible = false; continue; }
    const p = tau / q.life, s = tau / 1000, o = anchorTop(q.e.on, q.e.at, q.e.offset, t);
    q.m.visible = true;
    if (q.e.kind === "confetti") q.m.position.set(o.x + q.dx * 2.2 + Math.sin(s * 3 + q.ph) * 0.6, o.y + 7 - s * 2.6, o.z + q.dz * 2.2);
    else q.m.position.set(o.x + q.dx + Math.sin(s * 2.4 + q.ph) * q.sway, o.y + 0.4 + s * q.rise, o.z + q.dz + Math.cos(s * 2 + q.ph) * q.sway * 0.5);
    q.m.scale.setScalar(q.size * Math.sin(Math.PI * Math.min(1, p * 1.6)) ** 0.7 * (1 - Math.max(0, p - 0.7) / 0.3 * 0.6));
    q.m.rotation.set(q.e.kind === "confetti" ? s * q.spin : 0, s * q.spin * 0.5 + q.ph, q.e.kind === "confetti" ? s * q.spin * 0.7 : Math.sin(s * 3 + q.ph) * 0.25);
  }
}

// ---------- speech bubbles, letterbox, fades
const bubbleEls = (S.bubbles || []).map((b) => {
  const el = document.createElement("div"); el.className = "bubble"; el.textContent = b.text; el.style.opacity = 0; document.body.appendChild(el);
  return { b, el };
});
function evalBubbles(t) {
  for (const { b, el } of bubbleEls) {
    const on = t >= b.t && t <= b.t + b.dur;
    if (!on) { el.style.opacity = 0; continue; }
    const pop = TL.clamp01((t - b.t) / 220), out = TL.clamp01((b.t + b.dur - t) / 250);
    const v = anchorTop(b.actor, null, [0, 3, 0], t).project(camera);
    el.style.opacity = Math.min(pop, out);
    el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth - el.offsetWidth / 2}px`;
    const barPx = TL.level(S.letterboxes, t) * 0.11 * innerHeight;
    el.style.top = `${Math.max(barPx + 10, (-v.y * 0.5 + 0.5) * innerHeight - el.offsetHeight - 12)}px`;
    el.style.transform = `scale(${0.85 + 0.15 * TL.settle(pop)})`;
  }
}
let fadeColor = "#000";
let subShown = null;
function evalSubtitle(t) {
  const line = (S.narration || []).find((n) => t >= n.t && t < n.t + n.dur);
  if (line !== subShown) { subShown = line; $("subtitle").textContent = line ? line.text : ""; }
  $("subtitle").style.opacity = line ? Math.min(TL.clamp01((t - line.t) / 200), TL.clamp01((line.t + line.dur - t) / 200)) : 0;
}
function evalBars(t) {
  const lb = TL.level(S.letterboxes, t);
  $("barTop").style.height = $("barBot").style.height = `${lb * 11}vh`;
  const cap = document.querySelector(".cap");
  if (R) cap.style.bottom = `${13 + lb * 11}vh`; else cap.style.top = `${7 + lb * 11}vh`;
  const f = TL.level(S.fades, t);
  const last = [...(S.fades || [])].reverse().find((e) => e.t <= t && e.on);
  if (last && last.color !== fadeColor) { fadeColor = last.color; $("fade").style.background = fadeColor; }
  $("fade").style.opacity = f;
}

// ---------- camera
function evalCamera(t) {
  const c = TL.cameraState(S, t);
  const az = THREE.MathUtils.degToRad(c.az + (S.meta.drift || 0) * t / 1000), el = THREE.MathUtils.degToRad(c.el);
  const target = toScene(c.x, c.y, c.z);
  camera.position.set(target.x + c.dist * Math.cos(el) * Math.sin(az), target.y + c.dist * Math.sin(el), target.z + c.dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(target);
}

// ---------- captions, cards, callouts
let shownCap = -1;
function evalOverlay(t) {
  let ci = -1; S.captions.forEach((c, i) => { if (c.t <= t) ci = i; });
  if (ci !== shownCap) {
    shownCap = ci;
    $("capK").textContent = ci >= 0 ? S.captions[ci].kicker : "";
    $("capT").textContent = ci >= 0 ? S.captions[ci].text : "";
  }
  document.querySelector(".cap").style.opacity = ci >= 0 ? clamp01((t - S.captions[ci].t) / 350) : 0;
  const card = S.cards.find((c) => t >= c.t && t < c.t + c.dur);
  if (card) {
    $("cardK").textContent = card.kicker; $("cardT").textContent = card.title; $("cardS").textContent = card.sub || "";
    const fadeOut = clamp01((card.t + card.dur - t) / 450);
    $("card").style.opacity = card.t === 0 ? fadeOut : Math.min(clamp01((t - card.t) / 450), fadeOut);
  } else $("card").style.opacity = 0;
}
const calloutEls = (S.callouts || []).map((c) => {
  const el = document.createElement("div"); el.className = "callout"; el.textContent = c.text; document.body.appendChild(el);
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("stroke", "#e8711c"); line.setAttribute("stroke-width", "2"); $("leaders").appendChild(line);
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot.setAttribute("r", "4"); dot.setAttribute("fill", "#e8711c"); $("leaders").appendChild(dot);
  return { c, el, line, dot };
});
function anchorOf(c, t) {
  if (!c.on) return toScene(...c.at);
  const a = S.actors[c.on], pos = TL.actorPos(a, t, S.actors), [cx, cz] = TL.actorCentre(a);
  let top = 14;                       // figures are about 14 plates tall
  if (a.parts) top = Math.max(...a.parts.map((p) => p.y + p.h));
  return toScene(pos.x + cx + c.offset[0], pos.y + pos.lift + top + c.offset[1], pos.z + cz + c.offset[2]);
}
function evalCallouts(t) {
  for (const { c, el, line, dot } of calloutEls) {
    const a = Math.min(clamp01((t - c.t) / 300), clamp01((c.t + c.dur - t) / 300));
    const on = t >= c.t && t <= c.t + c.dur;
    el.style.opacity = on ? a : 0; line.style.opacity = dot.style.opacity = on ? a : 0;
    if (!on) continue;
    const v = anchorOf(c, t).project(camera);
    const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
    const lx = x + 70, ly = y - 70;
    el.style.left = `${lx}px`; el.style.top = `${ly - el.offsetHeight}px`;
    line.setAttribute("x1", x); line.setAttribute("y1", y); line.setAttribute("x2", lx); line.setAttribute("y2", ly);
    dot.setAttribute("cx", x); dot.setAttribute("cy", y);
  }
}

// ---------- sound: synthesised, scheduled from the timeline as playback crosses it
const SOUNDS = TL.soundEvents(S);
let audio = null, muted = true;
function tone(freq, dur, type = "sine", gain = 0.15, slide = 0) {
  const o = audio.createOscillator(), g = audio.createGain(), now = audio.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), now + dur);
  g.gain.setValueAtTime(gain, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(audio.destination); o.start(now); o.stop(now + dur + 0.02);
}
function noise(dur, gain = 0.1, from = 800, to = 200) {
  const buf = audio.createBuffer(1, Math.ceil(audio.sampleRate * dur), audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  src.buffer = buf; f.type = "bandpass"; f.frequency.setValueAtTime(from, now); f.frequency.exponentialRampToValueAtTime(to, now + dur);
  g.gain.setValueAtTime(gain, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(f).connect(g).connect(audio.destination); src.start(now);
}
function pad(freq, dur, gain = 0.03) {
  const now = audio.currentTime;
  for (const [type, det] of [["sine", 0], ["triangle", 4]]) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, now); o.detune.setValueAtTime(det, now);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(gain, now + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g).connect(audio.destination); o.start(now); o.stop(now + dur + 0.05);
  }
}
const PIECES = {
  romance: [[261.6, 329.6, 392, 493.9], [220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [196, 246.9, 293.7, 349.2]],
  wonder: [[261.6, 392, 587.3], [293.7, 440, 659.3], [349.2, 523.3, 784], [329.6, 493.9, 739.99]],
};
const VOICE = {
  chord: (e) => { const ch = PIECES[e.piece][e.size % 4]; ch.forEach((f, i) => pad(f, 2.9, i === 0 ? 0.035 : 0.022)); },
  say: () => { tone(660, 0.07, "sine", 0.06); setTimeout(() => audio && tone(880, 0.08, "sine", 0.05), 70); },
  "emit-hearts": () => [1046, 1318, 1568].forEach((f, i) => setTimeout(() => audio && tone(f, 0.25, "sine", 0.05), i * 90)),
  "emit-sparkles": () => [1568, 2093, 2637].forEach((f, i) => setTimeout(() => audio && tone(f, 0.18, "triangle", 0.035), i * 60)),
  "emit-confetti": () => noise(0.4, 0.06, 3000, 900),
  click: (e) => { tone(2400 / Math.sqrt(1 + e.size * 0.15), 0.045, "triangle", 0.12); tone(180, 0.05, "sine", 0.08); },
  panel: () => tone(900 + Math.random() * 400, 0.03, "square", 0.025),
  step: () => tone(120, 0.06, "sine", 0.06, 0.6),
  thud: () => tone(90, 0.18, "sine", 0.2, 0.5),
  whoosh: () => noise(0.25, 0.05, 2000, 400),
  install: () => { tone(520, 0.08, "triangle", 0.07); tone(780, 0.1, "triangle", 0.05); },
  "button-on": () => tone(150, 0.16, "square", 0.08, 0.5),
  "button-off": () => tone(220, 0.08, "square", 0.05, 1.4),
  "signal-on": () => tone(440, 0.5, "sine", 0.07, 2),
  "signal-off": () => tone(660, 0.3, "sine", 0.05, 0.4),
  "door-on": () => noise(0.7, 0.08, 300, 1200),
  "door-off": () => noise(0.7, 0.08, 1200, 300),
};
function playSounds(from, to) {
  if (muted || !audio || to <= from || to - from > 250) return;    // skip jumps and scrubs
  let n = 0;
  for (const e of SOUNDS) if (e.t > from && e.t <= to && n++ < 6) VOICE[e.kind]?.(e);
}
function setMuted(m) {
  muted = m; $("mute").textContent = m ? "🔇" : "🔊";
  if (!m && !audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (!m && audio.state === "suspended") audio.resume();

// ---------- the badge: model checks and the stage check
const reps = Object.entries(S.reports), allOk = reps.every(([, r]) => r.ok), stage = S.stage || [];
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}.${Math.floor(ms / 100) % 10}`;
$("badge").innerHTML = `<details${allOk ? "" : " open"}><summary><b class="${allOk ? "" : "bad"}">${allOk ? "✓" : "✗"}</b> ${reps.length} models · ${allOk ? "all buildable" : "not all buildable"}${
  stage.length ? ` · <b class="warn">⚠</b> ${stage.length} stage overlap${stage.length > 1 ? "s" : ""}` : ""}</summary><div class="list">${
  reps.map(([n, r]) => {
    const f = r.physical, file = n.replace(/[^a-z0-9-]+/gi, "_");
    const size = f ? ` · ${(f.widthMm / 10).toFixed(1)} × ${(f.depthMm / 10).toFixed(1)} × ${(f.heightMm / 10).toFixed(1)} cm, ~${f.grams} g` : "";
    return `${r.ok ? "✓" : '<span class="bad">✗</span>'} ${n} · ${r.stats?.parts ?? "?"} parts${size} · <a href="models/${file}.ldr" download>.ldr</a> <a href="models/${file}.csv" download>parts</a>${
      r.ok ? "" : `<br>${r.errors.slice(0, 4).map((e) => `<span class="bad">&nbsp;&nbsp;${e.msg}</span>`).join("<br>")}`}${
      r.available === false ? `<br><b class="warn">&nbsp;&nbsp;⚠ not made by LEGO:</b> ${r.missing.join(", ")}` : ""}`;
  }).join("<br>")}${
  stage.map((s) => `<br><b class="warn">⚠</b> ${s.pair} overlap at <a href="#" data-t="${s.t}">${fmt(s.t)}</a>`).join("")}
  <div class="honest"><b>Checked on a computer:</b> no overlaps, every stud connection, each part has a real way in (down, up or slid in), one solid piece, balance, ${
    reps.every(([, r]) => r.available !== false) ? "and every part is a real LEGO part in a colour LEGO has made (Rebrickable)" : "and part/colour availability (some fail, above)"}.
  <b>Not tested:</b> nobody has built these with real bricks. How firmly parts hold, tolerances, and whether the real thing stands are unknown; joints that swing are artistic licence; sizes are exact, weights estimated.</div></div></details>`;
$("badge").addEventListener("click", (e) => { const a = e.target.closest("[data-t]"); if (a) { e.preventDefault(); t = +a.dataset.t; setPlaying(false); } });

// ---------- playback, chapters, keys
const CH = TL.chapters(S);
let t = 0, playing = true, last = performance.now();
$("scrub").max = S.duration;
$("ticks").innerHTML = CH.map((c) => `<i style="left:${(c.t / S.duration) * 100}%" title="${c.label}"></i>`).join("");
function setPlaying(p) { playing = p; $("play").textContent = p ? "❚❚" : "▶"; last = performance.now(); }
function jump(dir) {
  const now = t + (dir > 0 ? 1 : -400);
  const c = dir > 0 ? CH.find((c) => c.t > now) : [...CH].reverse().find((c) => c.t < now);
  t = c ? c.t : dir > 0 ? S.duration : 0;
}
$("play").onclick = () => { if (t >= S.duration) t = 0; setPlaying(!playing); };
$("scrub").oninput = () => { t = +$("scrub").value; setPlaying(false); };
$("mute").onclick = () => setMuted(!muted);
$("instrBtn").onclick = () => setInstr(!instr);
function stepJump(dir) {
  const ends = STEPS.map((s) => s.tEnd);
  const target = dir > 0 ? ends.find((e) => e > t + 1) : [...ends].reverse().find((e) => e < t - 1);
  if (target !== undefined) { t = target; setPlaying(false); }
}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); $("play").click(); }
  else if (k === "arrowright") instr ? stepJump(1) : (t = Math.min(S.duration, t + 2000));
  else if (k === "arrowleft") instr ? stepJump(-1) : (t = Math.max(0, t - 2000));
  else if (k === "i") setInstr(!instr);
  else if (k === "]") jump(1);
  else if (k === "[") jump(-1);
  else if (k === "home" || k === "r") { t = 0; setPlaying(true); }
  else if (k === "m") setMuted(!muted);
  else if (k === "h") document.body.classList.toggle("clean");
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
});

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

function frame(now) {
  const before = t;
  if (playing) {
    const next = t + (now - last);
    const stop = instr ? STEPS.find((s) => s.tEnd > t + 1 && s.tEnd <= next) : null;   // pause at each step's end
    t = stop ? stop.tEnd : next;
    if (stop) setPlaying(false);
    if (t >= S.duration) { t = S.duration; setPlaying(false); }
  }
  last = now;
  if (playing) playSounds(before, t);
  draw(t);
  if (!RENDER) requestAnimationFrame(frame);
}
// Everything on screen at time t, drawn once. The live loop calls it every
// frame; render.mjs calls it directly through window.__renderAt.
function draw(at) {
  t = at;
  evalMood(t); evalBricks(t); evalSteps(t); evalRoom(t); for (const v of propViews) v(t); evalFigures(t); evalParticles(t); evalCamera(t); evalOverlay(t);
  renderer.render(scene, camera);
  evalCallouts(t); evalBubbles(t); evalBars(t); evalSubtitle(t);
  const ch = [...CH].reverse().find((c) => c.t <= t);
  $("chapter").textContent = ch ? ch.label : S.meta.title; $("chapter").style.opacity = ch || t < 1000 ? 1 : 0;
  $("scrub").value = t; $("time").textContent = `${fmt(t)} / ${fmt(S.duration)}`;
  window.__t = t;                     // the dev server reads this to reopen at the same moment
}
// Render mode (?render): no live loop, no controls; render.mjs steps through
// time itself and photographs each frame, captions and all.
const RENDER = new URLSearchParams(location.search).has("render");
window.__renderAt = (ms) => { draw(ms); return ms; };
window.__duration = S.duration;
window.__narration = S.narration || [];
const qs = new URLSearchParams(location.search);
if (qs.has("t")) { t = +qs.get("t"); setPlaying(qs.has("play")); }
if (qs.has("clean") || RENDER) document.body.classList.add("clean");
if (RENDER) { document.body.classList.add("render"); playing = false; if (!qs.has("subs")) document.body.classList.add("nosubs"); }
if (qs.has("steps")) setInstr(true);
requestAnimationFrame(frame);
</script>
