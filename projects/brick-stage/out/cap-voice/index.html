    geo = toCreasedNormals(geo, Math.PI / 6);
    meshGeoCache.set(key, geo);
    return geo;
  }
  // `covered` (optional): skip studs hidden under another part, for big models
  function brick(p, mat, covered) {
    const g = new THREE.Group();
    g.userData.home = toScene(p.x + p.w / 2, p.y + p.h / 2, p.z + p.d / 2);
    if (p.mesh && meshes?.[p.part]) {
      const m = new THREE.Mesh(meshGeo(p), mat); m.castShadow = m.receiveShadow = true; g.add(m);
      return g;
    }
    const body = new THREE.Mesh(bodyGeo(p.w, p.h, p.d), mat);
    body.castShadow = body.receiveShadow = true; g.add(body);
    if (p.kind !== "tile") for (let i = 0; i < p.w; i++) for (let k = 0; k < p.d; k++) {
      if (covered && covered(p.x + i, p.y + p.h, p.z + k)) continue;
      const s = new THREE.Mesh(studGeo, mat); s.castShadow = true;
      s.position.set(-p.w / 2 + 0.5 + i, p.h * PLATE / 2 + 0.09, p.d / 2 - 0.5 - k);
      g.add(s);
    }
    return g;
  }
  return { brick, toScene, bodyGeo, meshGeo };
}

<script>
// The blueprint player: draws an explainer timeline (from script.mjs) as a
// pure function of time on a 1920×1080 canvas — navy paper, thin bright line

// render.mjs can turn it into an MP4 with sound and captions:
//   __renderAt(ms), __duration, __renderAudio(from, to), __narration

(function () {
"use strict";

// ---- theme

const ADV = 0.6; // mono advance as a fraction of font size (IBM Plex Mono)

let THREE = null;

<script>
// ---- plugin: morph.js
// Morph: one checked brick model rebuilds itself into another, on camera.
// A stage of kind "morph" holds a chain of models (props.models); props.morph
// runs 0 → models.length − 1. Parts are matched model to model (same part,
// nearest first, colour may change); matched parts lift, fly an arc and
// settle in their new home, staggered left to right; parts the next model
// doesn't need lift off and shrink away; new parts drop in.

(function () {
  "use strict";

  function match(a, b, ha, hb) {

    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // the sound of a morph: a burst of plastic clicks under a soft whoosh
  BP.voice("morph", (s, e, at) => {

<script>
// ---- plugin: presenter.js
// The presenter stage: one LEGO minifigure (lib/minifig.js) on a 4×4 plate,
// lit like the brick stages, framed in its own rect. Gesture strengths (0..1,
// tweened by actions/presenter.mjs) become joint angles here, as a pure

// presenter after the stage it points at (it then sees that frame's camera).

  const { clamp, EASE, TL } = BP;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(o.w, o.h, false); renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const rim = new THREE.DirectionalLight(0x9fb8ff, 1.1); rim.position.set(8, 8, -14); scene.add(rim);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.35 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.001; shadow.receiveShadow = true; scene.add(shadow);

    plate.position.copy(plate.userData.home); scene.add(plate);

        // talk: the free hand gestures a little
        lX += talk * (18 + 14 * Math.sin(t / 290));
        rX += talk * (1 - Math.max(w, pointRight ? 0 : pt0, th)) * (10 + 8 * Math.sin(t / 340 + 1));
        if (pointRight) lX -= talk * pt0 * (18 + 14 * Math.sin(t / 290)); // the pointing hand holds still
        for (const arm of rig.arms) {
          const right = arm.side === "r";
          arm.sh.rotation.x = -(right ? rX : lX) * D2R;
          arm.sh.rotation.z = (right ? -rZ : lZ) * D2R;
          arm.wrist.rotation.y = (right ? wristR : 0) * D2R;
        }
        // head and upper body
        rig.head.rotation.x = (nd * Math.sin(t / 150) * 16 + talk * Math.sin(t / 135) * 4 - th * 6) * D2R;
        rig.head.rotation.z = (sh * 9 + th * 8) * D2R;
        rig.head.rotation.y = pt ? (pointRight ? 0.45 : -0.45) * EASE.inout(pt0) : 0;
        rig.upper.rotation.x = (-sh * 5 + talk * Math.sin(t / 420) * 1.5) * D2R;
        rig.upper.rotation.z = (talk * Math.sin(t / 380) * 2 + Math.sin(t / 1300) * 0.8) * D2R;
        rig.root.position.y = BP.PLATE + bobWalk + sh * 0.06 * Math.abs(Math.sin(t / 200));
        rig.setFace(p.face || "smile");
        renderer.render(scene, cam);
      },
    };
    return api;
  }

  // a target in frame pixels: { obj, at } on a stage, { obj, col, row } on a stack, or { x, y }
  function target(a) {
    if (a.x != null && a.y != null && !a.obj) return [a.x, a.y];
    const st = BP.STAGES[a.obj];
    if (!st) return null;
    if (a.at != null && st.anchor && st.anchors) return st.anchor(st.anchors[a.at], st.x, st.y);
    if (st.project) return st.project(a.col, a.row, st.x, st.y);
    return null;
  }

  BP.stage("presenter", Presenter, { overlays: false });
})();

</script>
<script>
// ---- plugin: voice.js
// Spoken narration: plays the clips embedded by voice.build.mjs at their
// timeline times, and a four-chord music bed that ducks under the voice.
// Both run through the core's renderAudio, so the live page (Sound on) and
// render.mjs's MP4 get the same mix, sample for sample.
(function () {
  if (!window.VOICE_CLIPS) return;
  const BUF = {};
  // decode every clip before the page starts
  BP.ready.push(async () => {
    const ctx = new OfflineAudioContext(1, 1, 48000);
    await Promise.all(Object.entries(window.VOICE_CLIPS).map(async ([key, b64]) => {
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      BUF[key] = await ctx.decodeAudioData(bytes.buffer);
    }));
  });

  // a clip; `at` < 0 means the line started before this render range
  BP.voice("clip", (s, e, at, ctx, out) => {
    const b = BUF[e.clip];
    if (!b) return;
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = b; g.gain.value = e.gain ?? 1;
    src.connect(g).connect(out);
    if (at >= 0) src.start(at);
    else if (-at < b.duration) src.start(0, -at);
  });

  // effects dip under the voice too (the core's fx bus)
  BP.audioHooks.push((ctx, { fx }, fromMs) => {
    const off = fromMs / 1000, end = ctx.length / ctx.sampleRate;
    for (const c of BP.TL.sounds) {
      if (c.kind !== "clip") continue;
      const a = c.t / 1000 - off, b = (c.t + c.long) / 1000 - off;
      if (b < 0 || a > end) continue;
      fx.gain.setTargetAtTime(0.5, Math.max(0, a - 0.15), 0.08);
      fx.gain.setTargetAtTime(1, Math.max(0, b + 0.1), 0.25);
    }
  });
  // the music bed: slow chords, ducked about 8 dB while anyone is speaking
  const CHORDS = [[110, 164.81, 220, 261.63], [87.31, 130.81, 174.61, 220], [130.81, 196, 261.63, 329.63], [98, 146.83, 196, 246.94]];
  const BAR = 8, DUCK = 0.4;
  BP.voice("bed", (s, e, at, ctx, out) => {
    const off = -at;                           // timeline seconds at ctx time 0
    const end = ctx.length / ctx.sampleRate;   // ctx seconds available
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(1, 0);
    bus.connect(out);
    // duck under every clip that overlaps this range
    for (const c of BP.TL.sounds) {
      if (c.kind !== "clip") continue;
      const a = c.t / 1000 - off, b = (c.t + c.long) / 1000 - off;
      if (b < 0 || a > end) continue;
      bus.gain.setTargetAtTime(DUCK, Math.max(0, a - 0.15), 0.08);
      bus.gain.setTargetAtTime(1, Math.max(0, b + 0.1), 0.25);
    }
    const pad = (start, f, dur, gain) => {
      for (const [type, det] of [["sine", 0], ["triangle", 6], ["sine", -5]]) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = f; o.detune.value = det;
        const t0 = Math.max(0, start), into = t0 - start; // already this far into the bar
        g.gain.setValueAtTime(into > 1.6 ? gain : 0.0001, t0);
        if (into < 1.6) g.gain.exponentialRampToValueAtTime(gain, start + 1.6);
        if (start + dur - 1.6 > t0) g.gain.setValueAtTime(gain, start + dur - 1.6);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g).connect(bus); o.start(t0); o.stop(start + dur + 0.05);
      }
    };
    for (let b = Math.max(0, Math.floor(off / BAR) - 1); b * BAR - off < end; b++) {
      const start = b * BAR - off, ch = CHORDS[b % CHORDS.length];
      if (start + BAR + 1.5 < 0) continue;
      for (const f of ch) pad(start, f, BAR + 1.5, 0.009);
      pad(start, ch[0] / 2, BAR, 0.02);
    }
  });
})();

</script>
<script>BP.start();</script>
