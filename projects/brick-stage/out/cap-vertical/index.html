<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Vertical Format</title>
<meta name="description" content="Vertical Format">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #040817; color: #dbe6ff; font: 15px/1.4 "IBM Plex Sans", -apple-system, sans-serif; }
  .screen { container-type: inline-size; position: relative; width: min(100vw, calc((100vh - 56px) * 1080 / 1920)); margin: 0 auto; aspect-ratio: 1080 / 1920; }
  canvas { display: block; width: 100%; height: 100%; }
  /* captions sit low and light, a subtitle line rather than a box over the scene */
  #caption { position: absolute; left: 50%; bottom: 2.6%; transform: translateX(-50%); max-width: 88%; padding: 0.25em 0.7em; text-align: center;
    font: 500 clamp(12px, 3.4cqw, 26px)/1.35 "IBM Plex Sans", sans-serif; color: #f2f6ff; background: rgba(4, 9, 28, 0.5); border: 0;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    transition: opacity 0.25s; pointer-events: none; }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; width: min(100vw, max(560px, calc((100vh - 56px) * 1080 / 1920))); margin: 0 auto; padding: 10px 14px; box-sizing: border-box; font-size: 13px; color: #9fb0d6; }
  #controls button { all: unset; cursor: pointer; padding: 5px 10px; border: 1px solid rgba(219, 230, 255, 0.25); color: #dbe6ff; }
  #controls button:hover { border-color: #dbe6ff; }
  #controls button:focus-visible, #controls input:focus-visible { outline: 2px solid #7cc8ff; outline-offset: 1px; }
  #play { min-width: 4em; text-align: center; }
  #scrub { flex: 1 1 200px; accent-color: #ff7a59; }
  #time { font-family: "IBM Plex Mono", monospace; min-width: 8em; }
  .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapters button { font-size: 12px; }
  label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  /* render.mjs: the frame fills the window, no controls, captions go to the .srt */
  body.render .screen { width: 100vw; height: 100vh; aspect-ratio: auto; }
  body.render #controls, body.render #caption { display: none; }
</style>
</head>

<script>
// Brick drawing, shared by the player and the printable booklet (the build
// inlines this file into both). Plain parts are rounded boxes with studs;
// slopes and round parts use their real LDraw geometry, turned into the scene
// frame: LDU / 20, y and z flipped, rotated the way the LDraw export rotates it.
function brickKit({ THREE, RoundedBoxGeometry, toCreasedNormals, meshes, PLATE }) {
  const toScene = (x, yPlates, z) => new THREE.Vector3(x, yPlates * PLATE, -z);
  const geoCache = new Map(), meshGeoCache = new Map();
  const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.18, 24);
  function bodyGeo(w, h, d) {
    const k = `${w}x${h}x${d}`;
    if (!geoCache.has(k)) geoCache.set(k, new RoundedBoxGeometry(w - 0.03, h * PLATE - 0.02, d - 0.03, 3, 0.05));
    return geoCache.get(k);
  }
  function meshGeo(p) {
    const key = `${p.part}@${p.rot}`;
    if (meshGeoCache.has(key)) return meshGeoCache.get(key);
    const m = meshes[p.part], [cx, cz] = m.center, phi = THREE.MathUtils.degToRad(-p.rot), cs = Math.cos(phi), sn = Math.sin(phi);
    const pos = new Float32Array(m.tri.length);
    for (let i = 0; i < m.tri.length; i += 3) {
      const lx = (m.tri[i] - cx) / 20, ly = -m.tri[i + 1] / 20 + (p.h * PLATE) / 2, lz = -(m.tri[i + 2] - cz) / 20;
      pos[i] = lx * cs + lz * sn; pos[i + 1] = ly; pos[i + 2] = -lx * sn + lz * cs;
    }
    let geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo = toCreasedNormals(geo, Math.PI / 6);
    meshGeoCache.set(key, geo);
    return geo;
  }
  // `covered` (optional): skip studs hidden under another part, for big models
  function brick(p, mat, covered) {
    const g = new THREE.Group();
    g.userData.home = toScene(p.x + p.w / 2, p.y + p.h / 2, p.z + p.d / 2);
    if (p.mesh && meshes?.[p.part]) {
      const m = new THREE.Mesh(meshGeo(p), mat); m.castShadow = m.receiveShadow = true; g.add(m);
      return g;
    }
    const body = new THREE.Mesh(bodyGeo(p.w, p.h, p.d), mat);
    body.castShadow = body.receiveShadow = true; g.add(body);
    if (p.kind !== "tile") for (let i = 0; i < p.w; i++) for (let k = 0; k < p.d; k++) {
      if (covered && covered(p.x + i, p.y + p.h, p.z + k)) continue;
      const s = new THREE.Mesh(studGeo, mat); s.castShadow = true;
      s.position.set(-p.w / 2 + 0.5 + i, p.h * PLATE / 2 + 0.09, p.d / 2 - 0.5 - k);
      g.add(s);
    }
    return g;
  }
  return { brick, toScene, bodyGeo, meshGeo };
}

// ---- code: a tiny tokenizer per language
const KW = {

BP.register("code", (ctx, p, t, obj) => {

<script>
// ---- plugin: morph.js
// Morph: one checked brick model rebuilds itself into another, on camera.
// A stage of kind "morph" holds a chain of models (props.models); props.morph
// runs 0 → models.length − 1. Parts are matched model to model (same part,
// nearest first, colour may change); matched parts lift, fly an arc and
// settle in their new home, staggered left to right; parts the next model
// doesn't need lift off and shrink away; new parts drop in.
// Uses the core's LEGO kit (BP.kit), plastic (BP.plastic) and the same light
// as the built-in bricks stage.
(function () {
  "use strict";
  const { clamp, EASE, PLATE } = BP;

  // match model a's parts to model b's: same part and colour, then same part
  // (colour changes in flight); nearest home first. Returns b index → a index.
  function match(a, b, ha, hb) {
    const used = new Set(), out = new Map();

          if (used.has(i) || !pass(a[i], q)) continue;

    // whatever the part — the brick flies over and changes shape on the way,
    // so even different kinds of chart turn into each other

      if (out.has(j) || !freeA.length) return;

      freeA.forEach((i, k) => { const d = ha[i].distanceToSquared(hb[j]); if (d < bd) { bd = d; bi = k; } });

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

      pc.g = g; pc.color = undefined;
    };
    const place = (pc, pos, color, rotY, scale) => {
      const g = pc.g;
      g.visible = scale > 0.01;
      g.position.copy(pos); g.rotation.y = rotY; g.scale.setScalar(Math.max(0.001, scale));
      if (pc.color !== color) {
        pc.color = color;
        g.traverse((m) => { if (m.isMesh) m.material = BP.plastic(color); });
      }
    };
    const rad = (deg) => (deg * Math.PI) / 180;
    let cur = { v: 0 };

    return {
      canvas: renderer.domElement,
      update(p, t) {
        const v = clamp(p.morph || 0, 0, M - 1), step = Math.min(M - 2, Math.floor(v)), k = M > 1 ? v - Math.max(0, step) : 0;
        cur.v = v;
        // camera, aimed at the middle height of whichever models are in play
        const hA = models[Math.max(0, step)].size[1] * PLATE, hB = models[Math.min(M - 1, Math.max(0, step) + 1)].size[1] * PLATE;
        const e = EASE.inout(k), mA = models[Math.max(0, step)], mB = models[Math.min(M - 1, Math.max(0, step) + 1)];
        const mix = (i) => mA.size[i] + (mB.size[i] - mA.size[i]) * e;
        const ty = (hA + (hB - hA) * e) / 2, w = mix(0), dd = mix(2), hh = (hA + (hB - hA) * e);
        // the shared camera: focus, drift and automatic framing (dist "auto") as in the bricks stage
        BP.aim(cam, p, t ?? 0, { x: 0, y: ty, z: 0, box: { min: [-w / 2, 0, -dd / 2], max: [w / 2, hh, dd / 2] } }, () => null);

        if (v <= 0 || M === 1) {
          // building model 0, part by part, like the bricks stage
          const at = p.reveal * (N0 + N0 * 0.05), sp = Math.max(1, N0 * 0.05);
          for (const pc of pieces) {
            const a = pc.at[0];
            if (!a) { for (const x of pc.gs) if (x) x.visible = false; continue; }
            show(pc, pc.gs[0]);
            const kk = clamp((at - a.j) / sp), e = EASE.out(kk);
            tmp.copy(a.home); tmp.y += (1 - e) * 5;
            place(pc, tmp, a.color, 0, kk > 0 ? 1 : 0);
          }
        } else {
          const A = step, B = step + 1;
          for (const pc of pieces) {
            const a = pc.at[A], b = pc.at[B];
            const rotOf = (s) => rad(-(s.rot || 0)) + rad(pc.g.userData.rot0 || 0);
            if (a && b) {
              // fly an arc: lift, travel, settle
              // pieces that stay put (most of the base) don't hop
              const dist = a.home.distanceTo(b.home), moving = clamp(dist / 0.6);
              const d = delay(b.home, B), u = clamp((k - d) / 0.5), e = EASE.inout(u);
              const lift = Math.sin(Math.PI * u) * (2.5 + 0.12 * dist) * moving;
              tmp.lerpVectors(a.home, b.home, e); tmp.y += lift;
              const swap = pc.gs[A] !== pc.gs[B];
              show(pc, u < 0.5 ? pc.gs[A] : pc.gs[B]);
              // a transmuting brick squashes as it changes shape at the top of the arc
              const squash = swap ? 1 - 0.45 * Math.sin(Math.PI * u) : 1;
              place(pc, tmp, u < 0.5 ? a.color : b.color, rotOf(a) + (rotOf(b) - rotOf(a)) * e, squash);
            } else if (a) {
              show(pc, pc.gs[A]);
              // not needed: lift off and shrink away, early in the step
              const d = delay(a.home, A) * 0.6, u = clamp((k - d) / 0.35), e = EASE.inout(u);
              tmp.copy(a.home); tmp.y += e * 7;
              place(pc, tmp, a.color, rotOf(a) + e * 0.8, 1 - e);
            } else if (b) {
              show(pc, pc.gs[B]);
              // new: drops in, late in the step
              const d = 0.45 + delay(b.home, B) * 0.6, u = clamp((k - d) / 0.3), e = EASE.out(u);
              tmp.copy(b.home); tmp.y += (1 - e) * 6;
              place(pc, tmp, b.color, rotOf(b), u > 0 ? 0.25 + 0.75 * e : 0);
            } else for (const x of pc.gs) if (x) x.visible = false;
          }
        }
        renderer.render(scene, cam);
      },
      // anchors: "m<i>:name" (or "a:"/"b:") pin to one model; a plain name
      // follows whichever model is nearer in the morph
      anchor(a, x0, y0) {
        if (!a) return [-999, -999];
        let pt, m;
        if (Array.isArray(a)) { pt = a; m = 0; }
        else if (a.p) { pt = a.p; m = a.m; }
        else {
          const want = Math.round(cur.v);
          m = a.by[want] ? want : a.by.findIndex(Boolean);
          pt = a.by[m];
        }
        tmp.set(pt[0], pt[1] * PLATE, -pt[2]).sub(centers[m]).project(cam);
        return [x0 + (tmp.x * 0.5 + 0.5) * o.w, y0 + (-tmp.y * 0.5 + 0.5) * o.h];
      },
    };
  }
  BP.stage("morph", make, { glow: false, overlays: false });

  // the sound of a morph: a burst of plastic clicks under a soft whoosh
  BP.voice("morph", (s, e, at) => {
    const d = (e.dur || 2500) / 1000;
    s.noise(at, d * 0.8, 0.03, 300, 2600, "lowpass", 0.7);
    const n = Math.min(90, Math.floor(d / 0.045));
    for (let i = 0; i < n; i++) {
      const a = at + d * (0.15 + 0.8 * (i / n)) + s.rnd() * 0.03;
      s.noise(a, 0.025, 0.045, 3600 + s.rnd() * 1800, 2400, "bandpass", 3);
      s.tone(a, 1800 + s.rnd() * 600, 0.02, "triangle", 0.01);
    }
  });
})();

</script>
<script>
// ---- plugin: presenter.js
// The presenter stage: one LEGO minifigure (lib/minifig.js) on a 4×4 plate,
// lit like the brick stages, framed in its own rect. Gesture strengths (0..1,
// tweened by actions/presenter.mjs) become joint angles here, as a pure
// function of time. Pointing reads another stage's anchor, so create the
// presenter after the stage it points at (it then sees that frame's camera).
(function () {
  const { clamp, EASE, TL } = BP;
  const D2R = Math.PI / 180;
  let MFK = null;

  // smooth 0→1→0 envelope for a caption line, so talking eases in and out
  function talking(t) {
    let k = 0;
    for (const n of TL.narration) if (t > n.t && t < n.t + n.dur) k = Math.max(k, clamp((t - n.t) / 300) * clamp((n.t + n.dur - t) / 300));
    return k;
  }

  function Presenter(o) {
    const THREE = BP.THREE;
    MFK ||= minifigKit(THREE, TL.colors);
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(26, o.w / o.h, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(o.w, o.h, false); renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // the brick stages' light: a cool sky, a warm key with shadows, a blue rim
    scene.add(new THREE.HemisphereLight(0xe8eeff, 0x1a2550, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-10, 20, 14); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024); const sc = key.shadow.camera; sc.left = sc.bottom = -12; sc.right = sc.top = 12; sc.near = 1; sc.far = 60;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fb8ff, 1.1); rim.position.set(8, 8, -14); scene.add(rim);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.35 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.001; shadow.receiveShadow = true; scene.add(shadow);
    // a 4×4 plate to stand on (a real part, from the shared brick kit)
    const plate = BP.kit().brick({ part: "3031", x: -2, y: 0, z: -2, w: 4, d: 4, h: 1, kind: "plate", rot: 0 }, BP.plastic(o.plate ?? 72));
    plate.position.copy(plate.userData.home); scene.add(plate);
    const rig = MFK.build(o.look || {});
    rig.root.position.y = BP.PLATE; scene.add(rig.root);
    rig.root.scale.setScalar(0.9);
    // the camera: a little above chest height, looking slightly down
    const lookY = 2.1, dist = 15.5;
    cam.position.set(0, lookY + 2.6, dist); cam.lookAt(0, lookY, 0); cam.updateProjectionMatrix();
    // how far to walk so the figure starts just outside the rect
    const halfW = Math.tan((cam.fov * D2R) / 2) * dist * cam.aspect;
    const offstage = halfW + 2.5;

    const api = {
      canvas: renderer.domElement,
      update(p, t) {
        const sideSign = p.side === "right" ? 1 : -1;
        const walk = clamp(p.walk ?? 1), moving = walk > 0 && walk < 1;
        rig.root.position.x = (1 - walk) * offstage * sideSign;
        rig.root.visible = walk > 0.001;
        plate.visible = true;

        // pointing: turn the body toward the target's screen side, raise the arm toward it
        // pointing uses the arm on the target's side, swung out sideways at the
        // target's angle from the shoulder, with the body and head turned toward it
        let yaw = p.facing * D2R, pointElev = 0, pointRight = false;
        const pt = p.point > 0 && p.pointAt ? target(p.pointAt) : null;
        if (pt) {
          const cx = p.x + p.w / 2, cy = p.y + p.h * 0.36;
          const dx = pt[0] - cx, dy = pt[1] - cy;
          pointRight = dx > 0; // the figure faces the camera: its left arm is on screen right
          yaw += clamp(dx / 900, -1, 1) * 28 * D2R * EASE.inout(clamp(p.point));
          pointElev = clamp(90 + (Math.atan2(-dy, Math.abs(dx)) * 180) / Math.PI, 25, 165); // from hanging
        }
        rig.root.rotation.y = yaw;

        // walking: legs swing, arms counter-swing; whole steps so it settles at rest
        const steps = 6, swing = moving ? Math.sin(walk * steps * Math.PI * 2) * 32 * D2R : 0;
        rig.legs[0].rotation.x = -swing; rig.legs[1].rotation.x = swing;
        const bobWalk = moving ? Math.abs(Math.sin(walk * steps * Math.PI * 2)) * 0.08 : 0;

        // gestures → shoulder angles: x = raise forward (deg), z = raise out to the side (deg)
        const talk = Math.max(clamp(p.talk), p.talkOnNarration ? talking(t) : 0);
        const w = clamp(p.wave), pt0 = clamp(p.point), sh = clamp(p.shrug), nd = clamp(p.nod), th = clamp(p.think);
        let rX = 0, rZ = 0, lX = 0, lZ = 0, wristR = 0;
        // walking counter-swing
        rX += -swing * 0.7 / D2R; lX += swing * 0.7 / D2R;
        // wave: right arm up and out, rocking at the shoulder
        rZ += w * (125 + 18 * Math.sin(t / 115)); rX += w * 20; wristR += w * 60;
        // point: out to the side toward the target, a little forward so it reads
        if (pointRight) { lZ += pt0 * pointElev; lX += pt0 * 18; }
        else { rZ += pt0 * pointElev; rX += pt0 * 18; }
        // shrug: both arms out a little, palms up
        rZ += sh * 32; lZ += sh * 32; rX += sh * 28; lX += sh * 28;
        // think: right hand to the chin
        rX += th * 118; rZ += th * -22; wristR += th * 90;
        // talk: the free hand gestures a little
        lX += talk * (18 + 14 * Math.sin(t / 290));
        rX += talk * (1 - Math.max(w, pointRight ? 0 : pt0, th)) * (10 + 8 * Math.sin(t / 340 + 1));
        if (pointRight) lX -= talk * pt0 * (18 + 14 * Math.sin(t / 290)); // the pointing hand holds still
        for (const arm of rig.arms) {
          const right = arm.side === "r";
          arm.sh.rotation.x = -(right ? rX : lX) * D2R;
          arm.sh.rotation.z = (right ? -rZ : lZ) * D2R;
          arm.wrist.rotation.y = (right ? wristR : 0) * D2R;
        }
        // head and upper body
        rig.head.rotation.x = (nd * Math.sin(t / 150) * 16 + talk * Math.sin(t / 135) * 4 - th * 6) * D2R;
        rig.head.rotation.z = (sh * 9 + th * 8) * D2R;
        rig.head.rotation.y = pt ? (pointRight ? 0.45 : -0.45) * EASE.inout(pt0) : 0;
        rig.upper.rotation.x = (-sh * 5 + talk * Math.sin(t / 420) * 1.5) * D2R;
        rig.upper.rotation.z = (talk * Math.sin(t / 380) * 2 + Math.sin(t / 1300) * 0.8) * D2R;
        rig.root.position.y = BP.PLATE + bobWalk + sh * 0.06 * Math.abs(Math.sin(t / 200));
        rig.setFace(p.face || "smile");
        renderer.render(scene, cam);
      },
    };
    return api;
  }

  // a target in frame pixels: { obj, at } on a stage, { obj, col, row } on a stack, or { x, y }
  function target(a) {
    if (a.x != null && a.y != null && !a.obj) return [a.x, a.y];
    const st = BP.STAGES[a.obj];
    if (!st) return null;
    if (a.at != null && st.anchor && st.anchors) return st.anchor(st.anchors[a.at], st.x, st.y);
    if (st.project) return st.project(a.col, a.row, st.x, st.y);
    return null;
  }

  BP.stage("presenter", Presenter, { overlays: false, after: true });
})();

</script>
<script>
// ---- plugin: voice.js
// Spoken narration: plays the clips embedded by voice.build.mjs at their
// timeline times, and a four-chord music bed that ducks under the voice.
// Both run through the core's renderAudio, so the live page (Sound on) and
// render.mjs's MP4 get the same mix, sample for sample.
(function () {
  if (!window.VOICE_CLIPS) return;
  const BUF = {};
  // decode every clip before the page starts
  BP.ready.push(async () => {
    const ctx = new OfflineAudioContext(1, 1, 48000);
    await Promise.all(Object.entries(window.VOICE_CLIPS).map(async ([key, b64]) => {
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      BUF[key] = await ctx.decodeAudioData(bytes.buffer);
    }));
  });

  // a clip; `at` < 0 means the line started before this render range
  BP.voice("clip", (s, e, at, ctx, out) => {
    const b = BUF[e.clip];
    if (!b) return;
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = b; g.gain.value = e.gain ?? 1;
    src.connect(g).connect(out);
    if (at >= 0) src.start(at);
    else if (-at < b.duration) src.start(0, -at);
  });

  // effects dip under the voice too (the core's fx bus)
  BP.audioHooks.push((ctx, { fx }, fromMs) => {
    const off = fromMs / 1000, end = ctx.length / ctx.sampleRate;
    for (const c of BP.TL.sounds) {
      if (c.kind !== "clip") continue;
      const a = c.t / 1000 - off, b = (c.t + c.long) / 1000 - off;
      if (b < 0 || a > end) continue;
      fx.gain.setTargetAtTime(0.5, Math.max(0, a - 0.15), 0.08);
      fx.gain.setTargetAtTime(1, Math.max(0, b + 0.1), 0.25);
    }
  });
  // the music bed: slow chords, ducked about 8 dB while anyone is speaking
  const CHORDS = [[110, 164.81, 220, 261.63], [87.31, 130.81, 174.61, 220], [130.81, 196, 261.63, 329.63], [98, 146.83, 196, 246.94]];
  const BAR = 8, DUCK = 0.4;
  BP.voice("bed", (s, e, at, ctx, out) => {
    const off = -at;                           // timeline seconds at ctx time 0
    const end = ctx.length / ctx.sampleRate;   // ctx seconds available
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(1, 0);
    bus.connect(out);
    // duck under every clip that overlaps this range
    for (const c of BP.TL.sounds) {
      if (c.kind !== "clip") continue;
      const a = c.t / 1000 - off, b = (c.t + c.long) / 1000 - off;
      if (b < 0 || a > end) continue;
      bus.gain.setTargetAtTime(DUCK, Math.max(0, a - 0.15), 0.08);
      bus.gain.setTargetAtTime(1, Math.max(0, b + 0.1), 0.25);
    }
    const pad = (start, f, dur, gain) => {
      for (const [type, det] of [["sine", 0], ["triangle", 6], ["sine", -5]]) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = f; o.detune.value = det;
        const t0 = Math.max(0, start), into = t0 - start; // already this far into the bar
        g.gain.setValueAtTime(into > 1.6 ? gain : 0.0001, t0);
        if (into < 1.6) g.gain.exponentialRampToValueAtTime(gain, start + 1.6);
        if (start + dur - 1.6 > t0) g.gain.setValueAtTime(gain, start + dur - 1.6);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g).connect(bus); o.start(t0); o.stop(start + dur + 0.05);
      }
    };
    for (let b = Math.max(0, Math.floor(off / BAR) - 1); b * BAR - off < end; b++) {
      const start = b * BAR - off, ch = CHORDS[b % CHORDS.length];
      if (start + BAR + 1.5 < 0) continue;
      for (const f of ch) pad(start, f, BAR + 1.5, 0.009);
      pad(start, ch[0] / 2, BAR, 0.02);
    }
  });
})();

</script>
