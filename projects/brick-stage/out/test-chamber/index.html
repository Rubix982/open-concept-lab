    const used = new Set();
    for (let i = 0; i < n1; i++) for (let k = 0; k < n2; k++) {
      if (used.has(i + "," + k)) continue;
      let a = 1, b = 1; const roll = r();
      if (roll < 0.22 && i + 1 < n1 && !used.has(i + 1 + "," + k)) a = 2;
      else if (roll < 0.4 && k + 1 < n2 && !used.has(i + "," + (k + 1))) b = 2;
      for (let u = 0; u < a; u++) for (let v = 0; v < b; v++) used.add(i + u + "," + (k + v));
      if (a === 1 && b === 1 && roll > 0.72) for (const [u, v] of [[0, 0], [0.5, 0], [0, 0.5], [0.5, 0.5]]) place(i + u, k + v, 0.5, 0.5);
      else place(i, k, a, b);
    }
  }
  const G = 0.1, maxD = Math.hypot(R.w, R.d) / 2;
  cells(R.w / C, R.d / C, (i, k, a, b) => {
    const x0 = i * C, z0 = k * C, w = a * C, d = b * C;
    const home = new THREE.Vector3(x0 + w / 2, -0.07, -(z0 + d / 2));
    const dist = Math.hypot(x0 + w / 2 - R.w / 2, z0 + d / 2 - R.d / 2) / maxD;
    panel([w - G, 0.14, d - G], home, false, R.t0 + dist * R.dur * 0.5 + r() * 250);
  });
  const rows = Math.round(WALL / C);
  cells(R.w / C, rows, (i, k, a, b) => {           // back wall
    const x0 = i * C, y0 = k * C, w = a * C, h = b * C;
    if (inDoor(x0, x0 + w, y0, y0 + h)) return;
    panel([w - G, h - G, 0.3], new THREE.Vector3(x0 + w / 2, y0 + h / 2, -R.d - 0.15), true, R.t0 + R.dur * 0.5 + (x0 / R.w) * R.dur * 0.3 + y0 * 25);
  });
  cells(R.d / C, rows, (i, k, a, b) => {           // right wall
    const z0 = i * C, y0 = k * C, d = a * C, h = b * C;
    panel([0.3, h - G, d - G], new THREE.Vector3(R.w + 0.15, y0 + h / 2, -(z0 + d / 2)), true, R.t0 + R.dur * 0.62 + ((R.d - z0) / R.d) * R.dur * 0.25 + y0 * 25);

}
function evalRoom(t) {
  for (const p of panels) {

    const k = 1 - settle(clamp01((t - p.t0) / p.dur));
    p.m.visible = true;
    if (p.wall) { p.m.position.set(p.home.x, p.home.y - (R.h * PLATE + 2) * k, p.home.z); p.m.rotation.set(0, 0, 0); }
    else { p.m.position.set(p.home.x, p.home.y - 3 * k, p.home.z); p.m.rotation.set(1.3 * k, 0, 0.4 * k); }
  }
}

// a prop's on/off value at time t, easing between states
function level(p, t) {
  let v = 0;
  for (const e of p.events) {
    if (t < e.t) break;
    const q = easeInOut(clamp01((t - e.t) / Math.max(1, e.dur)));
    v = v + ((e.on ? 1 : 0) - v) * q;
  }
  return v;
}
const propViews = [];
const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 0.8 });
for (const [id, p] of Object.entries(PROPS)) {
  if (p.kind === "button") {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 0.32, 40), new THREE.MeshStandardMaterial({ color: 0x6f9ea2, roughness: 0.5 }));
    base.position.y = 0.16; base.castShadow = base.receiveShadow = true;
    const topMat = new THREE.MeshStandardMaterial({ color: 0xd6453b, roughness: 0.35, emissive: 0xff2a10, emissiveIntensity: 0 });
    const top = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.9, 0.45, 40), topMat);
    top.castShadow = true; g.add(base, top);
    g.position.set(p.at[0], 0, -p.at[2]); scene.add(g);
    propViews.push({ p, eval: (t) => {
      const k = 1 - settle(clamp01((t - p.t0) / p.dur));
      g.visible = t >= p.t0; g.position.y = -1.2 * k; g.scale.setScalar(1 - 0.4 * k);
      const v = level(p, t);
      top.position.y = 0.32 + 0.225 - 0.3 * v; topMat.emissiveIntensity = 0.5 * v;
    } });
  } else if (p.kind === "door") {
    const W = p.width, H = p.height * PLATE, z = -R.d;
    const g = new THREE.Group(); scene.add(g);
    const recess = new THREE.Mesh(new THREE.BoxGeometry(W, H, 1.2), darkMat); recess.position.set(p.x + W / 2, H / 2, z - 0.75);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x55595e, roughness: 0.6 });
    const lintel = new THREE.Mesh(new THREE.BoxGeometry(W + 0.8, 0.5, 0.5), frameMat); lintel.position.set(p.x + W / 2, H + 0.25, z + 0.1);
    const jambL = new THREE.Mesh(new THREE.BoxGeometry(0.4, H, 0.5), frameMat); jambL.position.set(p.x - 0.2, H / 2, z + 0.1);
    const jambR = jambL.clone(); jambR.position.x = p.x + W + 0.2;
    const leafMat = new THREE.MeshStandardMaterial({ color: 0xe6e6e2, roughness: 0.7 });
    const leafL = new THREE.Mesh(new THREE.BoxGeometry(W / 2 - 0.05, H - 0.05, 0.3), leafMat), leafR = leafL.clone();
    for (const m of [recess, lintel, jambL, jambR, leafL, leafR]) { m.castShadow = m.receiveShadow = true; g.add(m); }
    propViews.push({ p, eval: (t) => {
      const k = clamp01((t - p.t0) / p.dur), shown = t >= p.t0;
      g.visible = shown;
      const v = level(p, t), slide = (W / 2) * v;
      const close = (1 - easeOut(k)) * (W / 2);             // leaves slide in when the door is installed
      leafL.position.set(p.x + W / 4 - slide - close, H / 2, z - 0.1);
      leafR.position.set(p.x + 3 * W / 4 + slide + close, H / 2, z - 0.1);
      lintel.scale.x = Math.max(0.01, easeOut(k));
    } });
  } else if (p.kind === "signal") {
    const pts = p.points.map(([x, y, z]) => new THREE.Vector3(x, y * PLATE + 0.08, R && z >= R.d ? -R.d + 0.12 : -z));
    const dots = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], L = a.distanceTo(b);
      for (let s = 0; s < L; s += 0.85) dots.push({ pos: a.clone().lerp(b, s / L), at: total + s });
      total += L;
    }
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.1, 0.34), new THREE.MeshBasicMaterial({ color: 0xffffff }), dots.length);
    scene.add(mesh);
    const dim = new THREE.Color(0x9fd7e3), lit = new THREE.Color(0x14b6e0), c = new THREE.Color(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
    propViews.push({ p, eval: (t) => {
      const drawn = clamp01((t - p.t0) / p.dur) * total, v = level(p, t);
      dots.forEach((d, i) => {
        const on = t >= p.t0 && d.at <= drawn;
        m4.compose(d.pos, q, new THREE.Vector3(on ? 1 : 0, on ? 1 : 0, on ? 1 : 0));
        mesh.setMatrixAt(i, m4);
        const pulse = 0.65 + 0.35 * Math.sin(d.at * 1.3 - t * 0.012);
        c.copy(dim).lerp(lit, v * pulse); mesh.setColorAt(i, c);
      });
      mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    } });
  }
}

// pictogram figures
const figMat = new THREE.MeshStandardMaterial({ color: 0x1d1e21, roughness: 0.55 });
const figures = Object.entries(S.actors).filter(([, a]) => a.kind === "figure").map(([id, a]) => {
  const g = new THREE.Group(); scene.add(g);
  const legGeo = new THREE.BoxGeometry(0.34, 1.9, 0.4);
  const legs = [-0.3, 0.3].map((x) => {
    const hip = new THREE.Group(); hip.position.set(x, 1.9, 0);
    const leg = new THREE.Mesh(legGeo, figMat); leg.position.y = -0.95; leg.castShadow = true;
    hip.add(leg); g.add(hip); return hip;
  });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.62, 1.4, 6, 18), figMat); torso.position.y = 1.9 + 1.32; torso.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.52, 24, 18), figMat); head.position.y = 1.9 + 2.64 + 0.6; head.castShadow = true;
  g.add(torso, head);
  return { a, g, legs };
});
const lerpAngle = (a, b, p) => a + (((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * p;
function evalFigures(t) {
  for (const { a, g, legs } of figures) {
    g.visible = t >= a.t0;
    const drop = 1 - settle(clamp01((t - a.t0) / a.appear));
    const off = actorOffset(a, t);
    // face the direction of travel, then add any explicit turns
    let heading = THREE.MathUtils.degToRad(a.face || 0), pos = a.moves[0].to, swing = 0;
    for (const m of a.moves.slice(1)) {
      if (t < m.t) break;
      const dx = m.to[0] - pos[0], dz = m.to[2] - pos[2];
      if (Math.hypot(dx, dz) > 0.01) heading = lerpAngle(heading, Math.atan2(dx, -dz), easeInOut(clamp01((t - m.t) / Math.min(450, m.dur * 0.35))));
      const p = clamp01((t - m.t) / m.dur);
      if (p < 1 && Math.hypot(dx, dz) > 0.01) swing = Math.sin(p * Math.PI * m.steps) * 0.6 * Math.sin(p * Math.PI);
      pos = m.to;
    }
    g.position.set(off.x, off.y + drop * 9, off.z);
    g.rotation.y = heading + THREE.MathUtils.degToRad(actorTurn(a, t));
    legs[0].rotation.x = swing; legs[1].rotation.x = -swing;
  }
}

// camera: each keyframe eases from wherever the camera was at that moment
const shotKeys = ["az", "el", "dist", "ax", "ay", "az2"];
const toState = (s) => ({ az: s.az, el: s.el, dist: s.dist, ax: s.at[0], ay: s.at[1] * PLATE, az2: -s.at[2] });
const cams = S.camera.map((c) => ({ ...c, to: toState(c.shot) }));
const camFrom = [];
function camAt(t, upto = cams.length) {
  let i = -1;
  for (let j = 0; j < upto; j++) if (cams[j].t <= t) i = j;
  if (i < 0) return cams[0].to;
  const from = camFrom[i] ?? (camFrom[i] = i === 0 ? cams[0].to : camAt(cams[i].t, i));
  const e = easeInOut(clamp01((t - cams[i].t) / Math.max(1, cams[i].dur)));
  const out = {}; for (const k of shotKeys) out[k] = from[k] + (cams[i].to[k] - from[k]) * e;
  return out;
}
for (let i = 0; i < cams.length; i++) camAt(cams[i].t + 0.001);
function evalCamera(t) {
  const c = camAt(t);
  const az = THREE.MathUtils.degToRad(c.az + (S.meta.drift || 0) * t / 1000), el = THREE.MathUtils.degToRad(c.el);
  const target = new THREE.Vector3(c.ax, c.ay, c.az2);
  camera.position.set(target.x + c.dist * Math.cos(el) * Math.sin(az), target.y + c.dist * Math.sin(el), target.z + c.dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(target);
}

let shownCap = -1;
function evalOverlay(t) {
  let ci = -1; S.captions.forEach((c, i) => { if (c.t <= t) ci = i; });
  if (ci !== shownCap) {
    shownCap = ci;
    $("capK").textContent = ci >= 0 ? S.captions[ci].kicker : "";
    $("capT").textContent = ci >= 0 ? S.captions[ci].text : "";
  }
  document.querySelector(".cap").style.opacity = ci >= 0 ? clamp01((t - S.captions[ci].t) / 350) : 0;
  const card = S.cards.find((c) => t >= c.t && t < c.t + c.dur);
  if (card) {
    $("cardK").textContent = card.kicker; $("cardT").textContent = card.title; $("cardS").textContent = card.sub || "";
    const a = Math.min(clamp01((t - card.t) / 450), clamp01((card.t + card.dur - t) / 450));
    $("card").style.opacity = card.t === 0 ? Math.min(1, clamp01((card.t + card.dur - t) / 450)) : a;
  } else $("card").style.opacity = 0;
}

// ---------- playback
let t = 0, playing = true, last = performance.now();
$("scrub").max = S.duration;
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}.${Math.floor(ms / 100) % 10}`;
function setPlaying(p) { playing = p; $("play").textContent = p ? "❚❚" : "▶"; last = performance.now(); }
$("play").onclick = () => { if (t >= S.duration) t = 0; setPlaying(!playing); };
$("scrub").oninput = () => { t = +$("scrub").value; setPlaying(false); };
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); $("play").click(); }
  else if (k === "arrowright") { t = Math.min(S.duration, t + 2000); }
  else if (k === "arrowleft") { t = Math.max(0, t - 2000); }
  else if (k === "home" || k === "r") { t = 0; setPlaying(true); }
  else if (k === "h") document.body.classList.toggle("clean");
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
});

// model report: every model checked by brick-check at build time
const reps = Object.entries(S.reports), allOk = reps.every(([, r]) => r.ok);
$("badge").innerHTML = `<details><summary><b class="${allOk ? "" : "bad"}">${allOk ? "✓" : "✗"}</b> ${reps.length} models · ${allOk ? "all buildable" : "not all buildable"}</summary><div class="list">${
  reps.map(([n, r]) => `${r.ok ? "✓" : "✗"} ${n} · ${r.stats.parts} parts · <a href="models/${n.replace(/[^a-z0-9-]+/gi, "_")}.ldr" download>.ldr</a>`).join("<br>")}</div></details>`;

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

function frame(now) {
  if (playing) { t += now - last; if (t >= S.duration) { t = S.duration; setPlaying(false); } }
  last = now;
  evalParts(t); evalRoom(t); for (const v of propViews) v.eval(t); evalFigures(t); evalCamera(t); evalOverlay(t);
  $("scrub").value = t; $("time").textContent = `${fmt(t)} / ${fmt(S.duration)}`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
const qs = new URLSearchParams(location.search);
if (qs.has("t")) { t = +qs.get("t"); setPlaying(false); }
if (qs.has("clean")) document.body.classList.add("clean");
requestAnimationFrame(frame);
</script>
